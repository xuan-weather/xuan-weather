name: MOENV AQI Data

on:
  schedule:
    # 環境部通常在每小時過後幾分鐘才發布上一整點資料
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: moenv-aqi-data
  cancel-in-progress: false

jobs:
  fetch-aqi-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch MOENV AQX_P_432
        env:
          MOENV_API_KEY: ${{ secrets.MOENV_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${MOENV_API_KEY:-}" ]; then
            echo "::error::MOENV_API_KEY 未設定或為空，請檢查 GitHub Actions Secrets。"
            exit 1
          fi

          mkdir -p data
          echo "開始讀取 MOENV AQX_P_432..."

          # 使用 curl 的 --get / --data-urlencode 組裝 query string，
          # 避免 API key 中的特殊字元破壞 URL。
          curl             --silent             --show-error             --fail             --retry 3             --retry-delay 5             --get             --data-urlencode "api_key=${MOENV_API_KEY}"             --data-urlencode "limit=1000"             --data-urlencode "sort=publishtime desc"             "https://data.moenv.gov.tw/api/v2/aqx_p_432"             -o data/aqx-p-432.json

          echo "AQI 資料下載完成"

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/aqx-p-432.json")
          try:
              data = json.loads(path.read_text(encoding="utf-8"))
          except Exception as exc:
              raise SystemExit(f"AQI 回傳不是有效 JSON：{exc}")

          if isinstance(data, list):
              records = data
          elif isinstance(data, dict):
              records = data.get("records", [])
          else:
              records = []

          records = [record for record in records if isinstance(record, dict)]
          if not records:
              raise SystemExit("AQI 回傳沒有可用的 records，請檢查 API 回應或金鑰。")

          times = sorted({
              str(record.get("publishtime", "")).strip()
              for record in records
              if record.get("publishtime")
          })

          print("AQI records:", len(records))
          print("最新 publishtime:", times[-1] if times else "未知")
          PY

      - name: Commit and push AQI data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/aqx-p-432.json
          if git diff --cached --quiet; then
            echo "AQI 資料沒有變更，不需要提交。"
            exit 0
          fi

          git commit -m "Update MOENV AQI data"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
