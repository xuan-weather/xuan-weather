name: CWA Earthquake History Sync

on:
  workflow_dispatch:
    inputs:
      archive_url:
        description: '官方歷史地震年度 ZIP 下載網址（選填）'
        required: false
        type: string

  schedule:
    - cron: '30 3 5 * *'

permissions:
  contents: write

concurrency:
  group: cwa-earthquake-history-sync
  cancel-in-progress: false

jobs:
  sync-history:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Prepare folders
        run: |
          mkdir -p data scripts .cache/earthquake-history

      - name: Download current-year earthquake catalog
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${CWA_API_KEY:-}" ]; then
            echo "::error::缺少 CWA_API_KEY"
            exit 1
          fi

          TMP_FILE=".cache/earthquake-history/current-year.xml.tmp"
          OUTPUT_FILE=".cache/earthquake-history/current-year.xml"
          mkdir -p .cache/earthquake-history
          rm -f "$TMP_FILE"

          # 改用氣象署官方 fileapi 下載端點。
          # fileapi 會將檔案下載請求轉址至檔案主機；curl -L 必須跟隨轉址。
          # v1 為官方開發指南所列端點，v2 作為替代端點。
          DOWNLOADED=0
          for API_VERSION in v1 v2; do
            URL="https://opendata.cwa.gov.tw/fileapi/${API_VERSION}/opendataapi/E-A0073-001"

            for attempt in 1 2; do
              echo "使用 CWA fileapi ${API_VERSION} 下載：第 ${attempt}/2 次"

              rm -f "$TMP_FILE"
              set +e
              META=$(curl --silent --show-error --location --fail \
                --connect-timeout 20 --max-time 90 \
                --retry 1 --retry-delay 3 --retry-all-errors \
                --get "$URL" \
                --data-urlencode "Authorization=${CWA_API_KEY}" \
                --data-urlencode "format=XML" \
                --output "$TMP_FILE" \
                --write-out "%{http_code}|%{size_download}")
              CURL_EXIT=$?
              set -e

              HTTP_CODE="${META%%|*}"
              SIZE="${META##*|}"

              if [ "$CURL_EXIT" -eq 0 ] && [ "$HTTP_CODE" = "200" ] && [ -s "$TMP_FILE" ]; then
                if python - "$TMP_FILE" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = sys.argv[1]
          try:
              root = ET.parse(path).getroot()
          except ET.ParseError as exc:
              print(f"下載內容不是有效 XML：{exc}")
              raise SystemExit(1)

          local_name = root.tag.rsplit("}", 1)[-1]
          if local_name.lower() != "cwaopendata":
              print(f"XML 根節點不符預期：{local_name}")
              raise SystemExit(1)

          records = root.findall(".//{*}EarthquakeInfo")
          if not records:
              print("XML 中找不到地震目錄 EarthquakeInfo，拒絕採用空資料。")
              raise SystemExit(1)

          print(f"XML 驗證通過：共 {len(records)} 筆地震目錄資料")
          PY
                then
                  mv "$TMP_FILE" "$OUTPUT_FILE"
                  echo "下載成功：HTTP ${HTTP_CODE}，約 ${SIZE} bytes"
                  DOWNLOADED=1
                  break 2
                fi
              fi

              echo "::warning::fileapi ${API_VERSION} 下載失敗：HTTP ${HTTP_CODE:-unknown}，curl exit ${CURL_EXIT}，收到 ${SIZE:-0} bytes"
              if [ "$attempt" -lt 2 ]; then
                sleep 8
              fi
            done
          done

          if [ "$DOWNLOADED" -ne 1 ]; then
            rm -f "$TMP_FILE"
            echo "::error::CWA fileapi v1/v2 均未能取得有效地震目錄。"
            echo "本次同步中止；不會執行資料合併或提交，既有歷史資料會保留。"
            exit 1
          fi

          test -s "$OUTPUT_FILE"

      - name: Import historical ZIP if provided
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.archive_url != '' }}
        env:
          ARCHIVE_URL: ${{ inputs.archive_url }}
        run: |
          set -euo pipefail

          case "$ARCHIVE_URL" in
            https://opendata.cwa.gov.tw/*|https://data.gov.tw/*|https://*.cwa.gov.tw/*) ;;
            *)
              echo "只接受中央氣象署或政府資料平台網址"
              exit 1
              ;;
          esac

          curl --silent --show-error --fail --location \
            --retry 3 --retry-delay 3 \
            "$ARCHIVE_URL" \
            -o .cache/earthquake-history/historical.zip

          python - <<'PY'
          import zipfile

          p = ".cache/earthquake-history/historical.zip"

          if not zipfile.is_zipfile(p):
              raise SystemExit("下載檔案不是有效 ZIP")

          with zipfile.ZipFile(p) as z:
              files = [
                  n for n in z.namelist()
                  if n.lower().endswith(".xml")
                  and not n.startswith("/")
                  and ".." not in n.split("/")
              ]

              if not files:
                  raise SystemExit("ZIP 中沒有 XML 檔案")

              for name in files:
                  z.extract(name, ".cache/earthquake-history/archive")

              print("匯入 XML 數量：", len(files))
          PY

      - name: Normalize and merge earthquake history
        run: |
          set -euo pipefail

          python scripts/sync-earthquake-history.py \
            --current .cache/earthquake-history/current-year.xml \
            --archive-dir .cache/earthquake-history/archive \
            --output data/earthquake-history.json

      - name: Commit updated history
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/earthquake-history.json

          if git diff --cached --quiet; then
            echo "地震資料沒有變化"
            exit 0
          fi

          git commit -m "Update CWA earthquake history"

          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
