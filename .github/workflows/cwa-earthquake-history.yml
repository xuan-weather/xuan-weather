name: CWA Earthquake History Sync

on:
  workflow_dispatch:
    inputs:
      archive_url:
        description: '官方歷史地震年度 ZIP 下載網址（選填）'
        required: false
        type: string

  schedule:
    - cron: '30 3 5 * *'

permissions:
  contents: write

concurrency:
  group: cwa-earthquake-history-sync
  cancel-in-progress: false

jobs:
  sync-history:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 只抓取目前分支最新提交，避免 fetch-depth: 0 把整個 Git 歷史與 tags 全部抓下來。
          # 本工作流程只更新地震歷史 JSON，不需要完整 Git 歷史。
          fetch-depth: 1
          fetch-tags: false

      - name: Prepare folders
        run: |
          mkdir -p data scripts .cache/earthquake-history

      - name: Download current-year earthquake catalog
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${CWA_API_KEY:-}" ]; then
            echo "缺少 CWA_API_KEY"
            exit 1
          fi

          URL="https://opendata.cwa.gov.tw/api/v1/rest/datastore/E-A0073-001"
          TMP_FILE=".cache/earthquake-history/current-year.xml.tmp"
          OUTPUT_FILE=".cache/earthquake-history/current-year.xml"
          MAX_ATTEMPTS=6

          # CWA 偶爾會回傳 HTTP 500；採逐步延長等待時間重試。
          # 只有確認收到有效 XML 後，才取代正式下載檔。
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "下載當年度地震目錄：第 ${attempt}/${MAX_ATTEMPTS} 次"

            set +e
            HTTP_CODE=$(curl --silent --show-error --location \
              --connect-timeout 20 --max-time 120 \
              --get "$URL" \
              --data-urlencode "Authorization=${CWA_API_KEY}" \
              --data-urlencode "format=XML" \
              --output "$TMP_FILE" \
              --write-out "%{http_code}")
            CURL_EXIT=$?
            set -e

            if [ "$CURL_EXIT" -eq 0 ] && [ "$HTTP_CODE" = "200" ] && [ -s "$TMP_FILE" ]; then
              if python - "$TMP_FILE" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = sys.argv[1]
          try:
              ET.parse(path)
          except ET.ParseError as exc:
              print(f"下載內容不是有效 XML：{exc}")
              raise SystemExit(1)
          print("已確認下載內容為有效 XML")
          PY
              then
                mv "$TMP_FILE" "$OUTPUT_FILE"
                break
              fi
            fi

            echo "::warning::下載失敗（HTTP ${HTTP_CODE:-unknown}，curl exit ${CURL_EXIT}）"

            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              WAIT_SECONDS=$((attempt * 10))
              echo "等待 ${WAIT_SECONDS} 秒後重試"
              sleep "$WAIT_SECONDS"
            else
              echo "::error::已重試 ${MAX_ATTEMPTS} 次，仍無法取得有效的當年度地震目錄。"
              echo "本次同步中止，不會執行資料合併或提交，既有歷史資料會保留。"
              rm -f "$TMP_FILE"
              exit 1
            fi
          done

          test -s "$OUTPUT_FILE"

      - name: Import historical ZIP if provided
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.archive_url != '' }}
        env:
          ARCHIVE_URL: ${{ inputs.archive_url }}
        run: |
          set -euo pipefail

          case "$ARCHIVE_URL" in
            https://opendata.cwa.gov.tw/*|https://data.gov.tw/*|https://*.cwa.gov.tw/*) ;;
            *)
              echo "只接受中央氣象署或政府資料平台網址"
              exit 1
              ;;
          esac

          curl --silent --show-error --fail --location \
            --retry 3 --retry-delay 3 \
            "$ARCHIVE_URL" \
            -o .cache/earthquake-history/historical.zip

          python - <<'PY'
          import zipfile

          p = ".cache/earthquake-history/historical.zip"

          if not zipfile.is_zipfile(p):
              raise SystemExit("下載檔案不是有效 ZIP")

          with zipfile.ZipFile(p) as z:
              files = [
                  n for n in z.namelist()
                  if n.lower().endswith(".xml")
                  and not n.startswith("/")
                  and ".." not in n.split("/")
              ]

              if not files:
                  raise SystemExit("ZIP 中沒有 XML 檔案")

              for name in files:
                  z.extract(name, ".cache/earthquake-history/archive")

              print("匯入 XML 數量：", len(files))
          PY

      - name: Normalize and merge earthquake history
        run: |
          set -euo pipefail

          python scripts/sync-earthquake-history.py \
            --current .cache/earthquake-history/current-year.xml \
            --archive-dir .cache/earthquake-history/archive \
            --output data/earthquake-history.json

      - name: Commit updated history
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/earthquake-history.json

          if git diff --cached --quiet; then
            echo "地震資料沒有變化"
            exit 0
          fi

          git commit -m "Update CWA earthquake history"

          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
