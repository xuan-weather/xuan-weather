name: One-time Xuan Weather index repair
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  repair-index:
    if: github.event.head_commit.message == 'chore: add one-time index repair workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Remove misplaced station popup insertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("index.html")
          source = path.read_text(encoding="utf-8")
          bad = "${buildXuanStationPopupTabs(station,data,county,town,wxInfo,popForStation,mapRain,mapRain2d,mapRain3d)}"
          count = source.count(bad)
          if count != 1:
              raise SystemExit(f"Expected exactly one misplaced insertion; found {count}. No changes made.")
          path.write_text(source.replace(bad, "", 1), encoding="utf-8")
          print("Removed exactly one misplaced station popup insertion.")
          PY
      - name: Commit repaired index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: repair station popup script insertion"
          git push origin HEAD:main
