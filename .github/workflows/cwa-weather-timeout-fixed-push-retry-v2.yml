name: CWA Weather Data

on:
  # 使用既有外部計時器觸發；保留手動執行，不再和外部計時器重複排程。
  workflow_dispatch:
  repository_dispatch:
    types: [cwa-external-timer]

permissions:
  contents: write

# 避免同一工作流程重疊執行；不主動取消正在執行的舊工作。
concurrency:
  group: cwa-weather-data
  cancel-in-progress: false

jobs:
  fetch-cwa-data:
    runs-on: ubuntu-latest
    # 保留 30 分鐘整體上限，避免因縮短 job timeout 而更容易被取消。
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 先獨立測試各連線層級；診斷失敗不會中止後續正式資料下載。
      - name: Diagnose CWA website and OpenData connectivity
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: |
          set +e

          echo "========================================"
          echo "CWA 連線診斷開始"
          echo "========================================"

          probe() {
            label="$1"
            shift
            echo
            echo "----- ${label} -----"
            curl --silent --show-error --location \
              --ipv4 --http1.1 --tlsv1.2 \
              --connect-timeout 8 --max-time 15 \
              --output /dev/null \
              --write-out "HTTP_STATUS=%{http_code} IP=%{remote_ip} DNS=%{time_namelookup}s CONNECT=%{time_connect}s TLS=%{time_appconnect}s FIRST_BYTE=%{time_starttransfer}s TOTAL=%{time_total}s SSL_VERIFY=%{ssl_verify_result}\n" \
              "$@"
            curl_rc=$?
            echo "CURL_EXIT=${curl_rc}"
          }

          probe "1. CWA 官方網站首頁" \
            "https://www.cwa.gov.tw/"

          probe "2. OpenData 主機首頁" \
            "https://opendata.cwa.gov.tw/"

          probe "3. OpenData API（不帶 API Key）" \
            --get \
            --data-urlencode "_=$(date +%s%N)" \
            "https://opendata.cwa.gov.tw/api/v1/rest/datastore/O-A0001-001"

          if [[ -z "${CWA_API_KEY:-}" ]]; then
            echo
            echo "4. OpenData API（帶 API Key）：略過，找不到 CWA_API_KEY。"
          else
            probe "4. OpenData API（帶 API Key）" \
              --get \
              --data-urlencode "Authorization=${CWA_API_KEY}" \
              --data-urlencode "_=$(date +%s%N)" \
              "https://opendata.cwa.gov.tw/api/v1/rest/datastore/O-A0001-001"
          fi

          echo
          echo "CWA 連線診斷結束；以上測試不影響正式下載流程。"

      - name: Fetch all CWA datasets
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${CWA_API_KEY:-}" ]]; then
            echo "::error::找不到 CWA_API_KEY，請確認 GitHub Actions Secrets 設定。"
            exit 1
          fi

          mkdir -p data

          datasets=(
            O-A0001-001
            O-A0002-001
            O-A0003-001
            F-C0032-001
            F-D0047-089
            F-D0047-091
            W-C0033-001
            W-C0033-002
            W-C0033-003
            W-C0033-004
            W-C0033-005
            W-C0033-006
            W-C0034-001
            W-C0034-005
            E-A0015-001
            E-A0016-001
          )

          failed_datasets=()

          for dataset in "${datasets[@]}"; do
            echo "========================================"
            echo "正在取得 CWA：${dataset}"
            echo "========================================"

            # 每次請求加入唯一 cache-buster，避免上游快取舊資料。
            cache_buster="$(date +%s%N)"
            # CWA OpenData 常見授權方式為 URL query parameter。
            # 不把金鑰直接寫入 URL 字串或 echo，交由 curl 編碼參數。
            url="https://opendata.cwa.gov.tw/api/v1/rest/datastore/${dataset}"

            echo "開始下載 ${dataset}..."
            # 先下載到暫存檔；成功且 JSON 有效才覆蓋正式檔案。
            tmp_file="data/cwa-${dataset}.json.tmp"
            rm -f "$tmp_file"

            # CWA 官方支援 Authorization query 參數；強制 IPv4 + HTTP/1.1，
            # 並記錄 TLS/首位元組耗時，定位 HTTP_STATUS=000 卡在哪個階段。
            if curl --fail-with-body \
              --silent \
              --show-error \
              --location \
              --ipv4 \
              --http1.1 \
              --tlsv1.2 \
              --retry 1 \
              --retry-all-errors \
              --retry-connrefused \
              --retry-delay 2 \
              --retry-max-time 60 \
              --connect-timeout 10 \
              --max-time 45 \
              --max-redirs 5 \
              --get \
              --data-urlencode "Authorization=${CWA_API_KEY}" \
              --data-urlencode "_=${cache_buster}" \
              --write-out "\\nHTTP_STATUS=%{http_code} IP=%{remote_ip} DNS=%{time_namelookup}s CONNECT=%{time_connect}s TLS=%{time_appconnect}s PRETRANSFER=%{time_pretransfer}s FIRST_BYTE=%{time_starttransfer}s TOTAL=%{time_total}s SIZE=%{size_download}bytes SSL_VERIFY=%{ssl_verify_result}\\n" \
              -H "Accept: application/json" \
              -H "Cache-Control: no-cache, no-store, max-age=0" \
              -H "Pragma: no-cache" \
              -H "User-Agent: XuanWeather-CWA-Data/1.0" \
              "${url}" \
              -o "$tmp_file"; then

              # 驗證 JSON，避免 HTML 錯誤頁或空檔覆蓋正式資料。
              if python -m json.tool "$tmp_file" >/dev/null 2>&1; then
                mv "$tmp_file" "data/cwa-${dataset}.json"
                echo "${dataset} 下載完成且 JSON 驗證通過"
              else
                rm -f "$tmp_file"
                echo "::warning::${dataset} 回傳內容不是有效 JSON。"
                failed_datasets+=("$dataset")
                if [[ -s "data/cwa-${dataset}.json" ]]; then
                  echo "保留上次成功的 ${dataset} 資料。"
                fi
                continue
              fi
            else
              rm -f "$tmp_file"
              echo "::warning::${dataset} 本次下載失敗或逾時。"
              failed_datasets+=("$dataset")
              if [[ -s "data/cwa-${dataset}.json" ]]; then
                echo "保留上次成功的 ${dataset} 資料，不以空檔或不完整檔案覆蓋。"
              else
                echo "::warning::${dataset} 沒有可用的舊資料。"
              fi
              continue
            fi

            wc -c "data/cwa-${dataset}.json"

            # 降低連續呼叫 CWA API 的頻率，避免短時間大量請求。
            sleep 2

            python - "${dataset}" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone, timedelta

          dataset = sys.argv[1]
          path = f"data/cwa-{dataset}.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          print(f"{dataset}：JSON 格式正常")

          if not isinstance(data, dict):
              raise SystemExit(f"{dataset}：錯誤，回傳資料不是 JSON 物件")

          if dataset == "W-C0033-005":
              print(f"{dataset}：CAP 高溫資訊 JSON 保留原始結構")
              time_keys = {
                  "sent", "Sent", "issueTime", "IssueTime",
                  "publishTime", "PublishTime", "publishedAt",
                  "PublishedAt", "publishDate", "PublishDate",
                  "published", "Published", "updateTime",
                  "UpdateTime", "updatedAt", "UpdatedAt",
                  "modifiedAt", "ModifiedAt",
              }
              latest = None
              seen = set()

              def walk(node):
                  global latest
                  if not isinstance(node, (dict, list)):
                      return
                  ident = id(node)
                  if ident in seen:
                      return
                  seen.add(ident)
                  if isinstance(node, list):
                      for item in node:
                          walk(item)
                      return
                  for key, value in node.items():
                      if key in time_keys:
                          raw = value
                          if isinstance(value, dict):
                              raw = (
                                  value.get("value")
                                  or value.get("datetime")
                                  or value.get("DateTime")
                                  or value.get("time")
                                  or ""
                              )
                          if raw:
                              try:
                                  dt = datetime.fromisoformat(
                                      str(raw).replace("Z", "+00:00")
                                  )
                                  if dt.tzinfo is None:
                                      dt = dt.replace(tzinfo=timezone.utc)
                                  if latest is None or dt > latest:
                                      latest = dt
                              except Exception:
                                  pass
                      if isinstance(value, (dict, list)):
                          walk(value)

              walk(data)
              if latest:
                  taipei = latest.astimezone(timezone(timedelta(hours=8)))
                  print(
                      f"{dataset}：本次抓到的最新官方發布／更新時間 = "
                      f"{taipei.isoformat()}"
                  )
              else:
                  print(f"{dataset}：找不到可解析的官方發布／更新時間")
          else:
              if "records" not in data:
                  raise SystemExit(f"{dataset}：錯誤，找不到 records")
              print(f"{dataset}：records 存在")
              latest_time = None
              records = data.get("records", {})
              stations = records.get("Station", []) if isinstance(records, dict) else []
              if isinstance(stations, list):
                  for station in stations:
                      if not isinstance(station, dict):
                          continue
                      obs = station.get("ObsTime", {})
                      dt = obs.get("DateTime") if isinstance(obs, dict) else None
                      if dt:
                          try:
                              parsed = datetime.fromisoformat(
                                  dt.replace("Z", "+00:00")
                              )
                              if latest_time is None or parsed > latest_time:
                                  latest_time = parsed
                          except Exception:
                              pass
              if latest_time:
                  print(
                      f"{dataset}：本次抓到的最新 ObsTime = "
                      f"{latest_time.isoformat()}"
                  )
              else:
                  print(f"{dataset}：找不到可解析的 ObsTime")
          PY

          done

          if (( ${#failed_datasets[@]} > 0 )); then
            echo "::warning::本次有 ${#failed_datasets[@]} 個資料集下載失敗：${failed_datasets[*]}"
            echo "已保留可用的上次成功資料；繼續進行後續資料驗證。"
          else
            echo "所有 CWA 資料集均下載成功。"
          fi

      - name: Verify 7-day county forecast dataset
        run: |
          set -euo pipefail

          python <<'PY'
          import json

          path = "data/cwa-F-D0047-091.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, dict):
              raise SystemExit("F-D0047-091：回傳資料不是 JSON 物件")

          records = data.get("records")
          if not isinstance(records, dict) or not records:
              raise SystemExit(
                  "F-D0047-091：找不到有效的 records，停止提交。"
              )

          print("F-D0047-091：JSON 正常")
          print("F-D0047-091：records 欄位已取得，資料驗證通過")
          PY

      - name: Verify high-temperature CAP is not an old cached version
        run: |
          set -euo pipefail

          python <<'PY'
          import json
          from datetime import datetime, timezone, timedelta

          path = "data/cwa-W-C0033-005.json"
          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          keys = {
              "sent", "Sent", "issueTime", "IssueTime",
              "publishTime", "PublishTime", "publishedAt",
              "PublishedAt", "publishDate", "PublishDate",
              "published", "Published", "updateTime", "UpdateTime",
              "updatedAt", "UpdatedAt", "modifiedAt", "ModifiedAt",
          }

          latest = None
          seen = set()

          def walk(node):
              global latest
              if not isinstance(node, (dict, list)):
                  return
              ident = id(node)
              if ident in seen:
                  return
              seen.add(ident)
              if isinstance(node, list):
                  for item in node:
                      walk(item)
                  return
              for key, value in node.items():
                  if key in keys:
                      raw = value
                      if isinstance(value, dict):
                          raw = (
                              value.get("value")
                              or value.get("datetime")
                              or value.get("DateTime")
                              or value.get("time")
                              or ""
                          )
                      if raw:
                          try:
                              dt = datetime.fromisoformat(
                                  str(raw).replace("Z", "+00:00")
                              )
                              if dt.tzinfo is None:
                                  dt = dt.replace(tzinfo=timezone.utc)
                              if latest is None or dt > latest:
                                  latest = dt
                          except Exception:
                              pass
                  if isinstance(value, (dict, list)):
                      walk(value)

          walk(data)

          if latest:
              taipei = latest.astimezone(timezone(timedelta(hours=8)))
              print(f"W-C0033-005 最後發布／更新：{taipei.isoformat()}")

              now = datetime.now(timezone(timedelta(hours=8)))
              today_0730 = now.replace(
                  hour=7, minute=30, second=0, microsecond=0
              )

              if now >= today_0730 and taipei.date() < now.date():
                  raise SystemExit(
                      "W-C0033-005 仍是前一天版本，停止提交，"
                      "避免網站繼續發布舊高溫資訊。"
                  )
          else:
              print("W-C0033-005 無法解析發布時間，保留原資料流程。")
          PY

      - name: Show downloaded files
        run: |
          echo "========================================"
          echo "CWA 資料檔案"
          echo "========================================"
          ls -lh data/cwa-*.json

      - name: Commit CWA data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/cwa-*.json

          if git diff --cached --quiet; then
            echo "資料沒有變化，不需要提交"
            exit 0
          fi

          git commit -m "Update CWA weather data"

          # 多個工作流程可能同時更新相同的 CWA JSON。
          # 同步遠端時若同一資料檔衝突，保留本次成功下載的版本；不使用 force push。
          max_attempts=5
          for attempt in $(seq 1 "$max_attempts"); do
            echo "推送嘗試 ${attempt}/${max_attempts}"
            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "CWA 資料推送成功"
                exit 0
              fi
              echo "推送被拒絕，稍後重新同步遠端再試。"
            else
              conflicts="$(git diff --name-only --diff-filter=U)"
              if [[ -z "$conflicts" ]]; then
                git rebase --abort || true
                echo "Rebase 失敗，但沒有可辨識的檔案衝突。"
                exit 1
              fi

              while IFS= read -r file; do
                [[ -n "$file" ]] || continue
                case "$file" in
                  data/cwa-*.json)
                    git checkout --theirs -- "$file"
                    git add -- "$file"
                    ;;
                  *)
                    git rebase --abort || true
                    echo "非 CWA JSON 檔案發生衝突：$file；停止以避免覆蓋其他內容。"
                    exit 1
                    ;;
                esac
              done <<< "$conflicts"

              GIT_EDITOR=true git rebase --continue
              if git push origin HEAD:main; then
                echo "解決 CWA JSON 衝突後推送成功"
                exit 0
              fi
              echo "解決檔案衝突後推送仍被拒絕，稍後重新同步再試。"
            fi

            sleep 2
          done

          echo "重試 ${max_attempts} 次後仍無法推送，請檢查最新 GitHub Actions 日誌。"
          exit 1
