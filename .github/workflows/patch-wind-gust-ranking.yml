name: Fix nationwide wind gust ranking

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-wind-gust-ranking.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply verified source patch
        run: |
          echo ' ' | base64 -d > /tmp/patch_wind_gust.py
          python3 /tmp/patch_wind_gust.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/patch-wind-gust-ranking.yml
          git commit -m "Fix nationwide wind gust ranking coverage and order"
          git push origin main
