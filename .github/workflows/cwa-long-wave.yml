name: CWA 長浪即時訊息

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

# 避免每 5 分鐘的排程重疊，造成多個 Actions 同時 push。
concurrency:
  group: cwa-long-wave-data
  cancel-in-progress: false

jobs:
  fetch-long-wave:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Fetch CWA 長浪即時訊息
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');

          const url = 'https://www.cwa.gov.tw/V8/C/P/Warning/W37.html?T=' + Date.now();

          function normalizeText(s) {
            return String(s || '')
              .replace(/\u00a0/g, ' ')
              .replace(/[ \t]+/g, ' ')
              .replace(/\n{3,}/g, '\n\n')
              .trim();
          }

          function parsePublishedAt(text) {
            const normalized = normalizeText(text);
            const currentYear = new Date().toLocaleString('en-US', {
              timeZone: 'Asia/Taipei',
              year: 'numeric'
            });

            const md = normalized.match(
              /發[布佈]時間\s*[：:]\s*(\d{1,2})\/(\d{1,2})\s+(\d{1,2}):(\d{2})/
            );
            if (md) {
              const [, mo, d, h, mi] = md;
              const pad = n => String(n).padStart(2, '0');
              return `${currentYear}-${pad(mo)}-${pad(d)}T${pad(h)}:${pad(mi)}:00+08:00`;
            }

            const patterns = [
              /(20\d{2})[年\/-](\d{1,2})[月\/-](\d{1,2})日?\s*(\d{1,2})[時:]\s*(\d{1,2})分?\s*發布/,
              /(\d{4})[年\/-](\d{1,2})[月\/-](\d{1,2})日?\s*(\d{1,2}):(\d{2})\s*發布/,
              /(\d{4})\/(\d{1,2})\/(\d{1,2})\s+(\d{1,2}):(\d{2})/
            ];
            for (const re of patterns) {
              const m = normalized.match(re);
              if (!m) continue;
              const [_, y, mo, d, h, mi] = m;
              const pad = n => String(n).padStart(2, '0');
              return `${y}-${pad(mo)}-${pad(d)}T${pad(h)}:${pad(mi)}:00+08:00`;
            }
            return null;
          }

          function parseSummary(text) {
            const normalized = normalizeText(text);
            const markers = ['長浪即時訊息：', '長浪即時訊息:'];

            for (const marker of markers) {
              const idx = normalized.indexOf(marker);
              if (idx >= 0) {
                let rest = normalized.slice(idx + marker.length).trim();
                const stopTokens = [
                  '浪高監測長條圖',
                  '浪高監測燈號地圖',
                  '長浪即時訊息\n'
                ];
                for (const token of stopTokens) {
                  const p = rest.indexOf(token);
                  if (p > 20) rest = rest.slice(0, p).trim();
                }
                if (rest.length >= 20) return rest;
              }
            }

            const lines = normalized
              .split(/\n+/)
              .map(x => x.trim())
              .filter(Boolean);
            const candidates = lines.filter(x => /沿海/.test(x) && /請注意[。.]?$/.test(x));
            if (candidates.length) return candidates[candidates.length - 1];
            return '';
          }

          function looksLikeLoadedW37Page(text) {
            // 只確認 W37 頁面本身已成功載入；
            // 不再要求一定要有「沿海／浪高／請注意」等活動訊息。
            // 這樣當氣象署解除長浪後，頁面沒有活動本文時，
            // workflow 才能正常寫入 active=false，清除網站上的舊訊息。
            const normalized = normalizeText(text);
            return /長浪即時訊息/.test(normalized);
          }

          (async() => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({locale:'zh-TW'});
            try {
              await page.goto(url, {waitUntil:'domcontentloaded', timeout:60000});

              // W37 為 JavaScript 頁面，給動態內容足夠時間載入。
              await page.waitForTimeout(5000);

              // 最多再等 20 秒，確認 W37 頁面本身已完成載入。
              // 注意：不能要求一定要有長浪本文，因為「解除」時本文本來就應該消失。
              try {
                await page.waitForFunction(() => {
                  const t = document.body?.innerText || '';
                  return /長浪即時訊息/.test(t);
                }, {timeout:20000});
              } catch (_) {
                // 下面會再檢查一次；若連 W37 頁面標題都沒有，才視為抓取失敗，
                // 避免 CWA 網站暫時異常時誤把有效資料清掉。
              }

              const bodyText = await page.locator('body').innerText();
              const text = normalizeText(bodyText);
              const summary = parseSummary(text);
              const publishedAt = parsePublishedAt(text);

              if (!looksLikeLoadedW37Page(text)) {
                throw new Error('CWA W37 頁面未完成載入，為避免抓取異常，本次不更新 data/cwa-long-wave.json。');
              }

              // 以氣象署目前頁面是否仍有長浪本文作為 active 唯一判斷。
              // 有本文＝active=true；解除後沒有本文＝active=false。
              const active = Boolean(summary);
              if (active && !publishedAt) {
                console.warn('已解析到長浪本文，但未解析到發布時間；仍保留本文。');
              }

              const output = {
                updatedAt: new Date().toISOString(),
                source: '中央氣象署',
                product: '長浪即時訊息',
                active,
                publishedAt,
                publishTime: publishedAt,
                publishDate: publishedAt,
                published: publishedAt,
                summary: active ? summary : '',
                rawText: text,
                link: 'https://www.cwa.gov.tw/V8/C/P/Warning/W37.html'
              };

              fs.mkdirSync('data', {recursive:true});
              fs.writeFileSync('data/cwa-long-wave.json', JSON.stringify(output, null, 2) + '\n');
              console.log(JSON.stringify(output, null, 2));
            } finally {
              await browser.close();
            }
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE

      - name: Commit data/cwa-long-wave.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cwa-long-wave.json
          if git diff --cached --quiet; then
            echo "長浪資料沒有變化，不需要 commit。"
            exit 0
          fi
          git commit -m "chore: update CWA long-wave message"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
