name: CWA 長浪即時訊息

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  fetch-long-wave:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Fetch CWA 長浪即時訊息
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');

          const url = 'https://www.cwa.gov.tw/V8/C/P/Warning/W37.html?T=' + Date.now();

          function normalizeText(s) {
            return String(s || '')
              .replace(/\u00a0/g, ' ')
              .replace(/[ \t]+/g, ' ')
              .replace(/\n{3,}/g, '\n\n')
              .trim();
          }

          function parsePublishedAt(text) {
            const patterns = [
              /(20\d{2})[年\/-](\d{1,2})[月\/-](\d{1,2})日?\s*(\d{1,2})[時:]\s*(\d{1,2})分?\s*發布/,
              /(\d{4})[年\/-](\d{1,2})[月\/-](\d{1,2})日?\s*(\d{1,2}):(\d{2})\s*發布/,
              /(\d{4})\/(\d{1,2})\/(\d{1,2})\s+(\d{1,2}):(\d{2})/
            ];
            for (const re of patterns) {
              const m = text.match(re);
              if (!m) continue;
              const [_, y, mo, d, h, mi] = m;
              const pad = n => String(n).padStart(2, '0');
              return `${y}-${pad(mo)}-${pad(d)}T${pad(h)}:${pad(mi)}:00+08:00`;
            }
            return null;
          }

          function parseSummary(text) {
            const normalized = normalizeText(text);
            const markers = ['長浪即時訊息：', '長浪即時訊息:'];
            for (const marker of markers) {
              const idx = normalized.indexOf(marker);
              if (idx >= 0) {
                let rest = normalized.slice(idx + marker.length).trim();
                // 只取訊息本文，避免把後面的圖表說明一起帶進網站。
                const stopTokens = ['浪高監測長條圖', '浪高監測燈號地圖', '長浪即時訊息\n'];
                for (const token of stopTokens) {
                  const p = rest.indexOf(token);
                  if (p > 20) rest = rest.slice(0, p).trim();
                }
                if (rest.length >= 20) return rest;
              }
            }

            // 備援：從含「沿海」且以「請注意」結尾的句子擷取。
            const lines = normalized.split(/\n+/).map(x => x.trim()).filter(Boolean);
            const candidates = lines.filter(x => /沿海/.test(x) && /請注意[。.]?$/.test(x));
            if (candidates.length) return candidates[candidates.length - 1];
            return '';
          }

          (async() => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({locale:'zh-TW'});
            try {
              await page.goto(url, {waitUntil:'networkidle', timeout:60000});
              await page.waitForTimeout(3000);
              const bodyText = await page.locator('body').innerText();
              const text = normalizeText(bodyText);
              const summary = parseSummary(text);
              const publishedAt = parsePublishedAt(text);
              const active = Boolean(summary);

              const output = {
                updatedAt: new Date().toISOString(),
                source: '中央氣象署',
                product: '長浪即時訊息',
                active,
                publishedAt,
                summary: active ? summary : '',
                link: 'https://www.cwa.gov.tw/V8/C/P/Warning/W37.html'
              };

              fs.mkdirSync('data', {recursive:true});
              fs.writeFileSync('data/cwa-long-wave.json', JSON.stringify(output, null, 2) + '\n');
              console.log(JSON.stringify(output, null, 2));
              if (!active) console.log('CWA W37 頁面目前未解析到生效中的長浪即時訊息，已寫入 active=false。');
            } finally {
              await browser.close();
            }
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Commit data/cwa-long-wave.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cwa-long-wave.json
          if git diff --cached --quiet; then
            echo "長浪資料沒有變化，不需要 commit。"
          else
            git commit -m "chore: update CWA long-wave message"
            git push
          fi
