name: CWA Township Forecast

on:
  schedule:
    # 鄉鎮預報每天約 05:30 / 11:30 / 17:30 / 23:30 發布
    # 發布後約 10 分鐘抓取一次
    - cron: '40 21,3,9,15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cwa-township-forecast
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all 22 county/city township forecasts
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p data/cwa-township

          # F-D0047-093 的全臺產品在目前 API 狀態下直接查詢會異常，
          # 因此改用氣象署正式提供的 22 個縣市鄉鎮預報資料集，
          # 每個資料集抓完整縣市，再合併成一份全臺鄉鎮資料。
          datasets=(
            F-D0047-001
            F-D0047-005
            F-D0047-009
            F-D0047-013
            F-D0047-017
            F-D0047-021
            F-D0047-025
            F-D0047-029
            F-D0047-033
            F-D0047-037
            F-D0047-041
            F-D0047-045
            F-D0047-049
            F-D0047-053
            F-D0047-057
            F-D0047-061
            F-D0047-065
            F-D0047-069
            F-D0047-073
            F-D0047-077
            F-D0047-081
            F-D0047-085
          )

          for dataset in "${datasets[@]}"; do
            echo "========================================"
            echo "取得 ${dataset}"
            echo "========================================"

            cache_buster="$(date +%s%N)"
            url="https://opendata.cwa.gov.tw/api/v1/rest/datastore/${dataset}?_=${cache_buster}"

            curl --fail-with-body \
              --silent \
              --show-error \
              --retry 8 \
              --retry-all-errors \
              --retry-delay 5 \
              --connect-timeout 30 \
              --max-time 180 \
              --location \
              -H "Accept: application/json" \
              -H "Authorization: ${CWA_API_KEY}" \
              -H "Cache-Control: no-cache, no-store, max-age=0" \
              -H "Pragma: no-cache" \
              "${url}" \
              -o "data/cwa-township/${dataset}.json"

            test -s "data/cwa-township/${dataset}.json"
            echo "${dataset} 下載完成"
          done

      - name: Merge all township forecasts
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('fs');
          const path = 'data/cwa-F-D0047-093.json';

          const files = fs.readdirSync('data/cwa-township')
            .filter(name => /^F-D0047-\d+\.json$/.test(name))
            .sort();

          const allGroups = [];
          const seen = new Set();

          for (const file of files) {
            const full = `data/cwa-township/${file}`;
            const json = JSON.parse(fs.readFileSync(full, 'utf8'));

            const records =
              json?.records ||
              json?.result?.records ||
              {};

            // 氣象署 REST datastore 的縣市資料結構通常是：
            // records.locations[0].location
            const lowerGroups = records.locations || [];
            const upperGroups = records.Locations || [];

            const groups = lowerGroups.length
              ? lowerGroups
              : upperGroups;

            const groupArray = Array.isArray(groups) ? groups : [groups];

            for (const group of groupArray) {
              const cityName =
                group?.locationsName ||
                group?.LocationsName ||
                '';

              const locations =
                group?.location ||
                group?.Location ||
                [];

              const locationArray =
                Array.isArray(locations) ? locations : [];

              const normalizedLocations = [];

              for (const location of locationArray) {
                const geocode = String(
                  location?.geocode ??
                  location?.Geocode ??
                  ''
                ).trim();

                const name =
                  location?.locationName ||
                  location?.LocationName ||
                  '';

                // 同一鄉鎮只保留一次
                const key = geocode || `${cityName}|${name}`;

                if (seen.has(key)) {
                  continue;
                }

                seen.add(key);
                normalizedLocations.push(location);
              }

              if (normalizedLocations.length > 0) {
                allGroups.push({
                  LocationsName: cityName,
                  Location: normalizedLocations
                });
              }
            }
          }

          const total = allGroups.reduce(
            (sum, group) => sum + group.Location.length,
            0
          );

          const uniqueGeocodes = new Set();

          for (const group of allGroups) {
            for (const location of group.Location) {
              const code = String(
                location?.Geocode ??
                location?.geocode ??
                ''
              ).trim();

              if (code) {
                uniqueGeocodes.add(code);
              }
            }
          }

          console.log(`合併縣市資料組數：${allGroups.length}`);
          console.log(`合併 Location 數量：${total}`);
          console.log(`不重複 Geocode：${uniqueGeocodes.size}`);

          // 368 鄉鎮為正常目標；允許少量資料暫時缺失，
          // 但低於 300 就完全拒絕覆蓋網站舊資料。
          if (uniqueGeocodes.size < 300) {
            throw new Error(
              `全臺鄉鎮資料異常：只有 ${uniqueGeocodes.size} 個 Geocode，拒絕覆蓋舊資料`
            );
          }

          const output = {
            success: true,
            records: {
              Locations: allGroups
            }
          };

          fs.writeFileSync(
            path,
            JSON.stringify(output, null, 2),
            'utf8'
          );

          console.log(
            `✓ 已建立 ${path}，共 ${uniqueGeocodes.size} 個鄉鎮市區`
          );
          NODE

      - name: Validate township forecast
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('fs');

          const path = 'data/cwa-F-D0047-093.json';
          const json = JSON.parse(fs.readFileSync(path, 'utf8'));

          const groups = json?.records?.Locations || [];

          const locations = groups.flatMap(group =>
            Array.isArray(group?.Location) ? group.Location : []
          );

          const unique = new Set(
            locations
              .map(item =>
                String(item?.Geocode || '').trim()
              )
              .filter(Boolean)
          );

          console.log(`最終 Location：${locations.length}`);
          console.log(`最終不重複 Geocode：${unique.size}`);

          if (unique.size < 300) {
            throw new Error(
              `F-D0047-093 最終資料異常：${unique.size} 個鄉鎮`
            );
          }

          console.log(
            `✓ 鄉鎮市區資料驗證成功：${unique.size} 個`
          );
          NODE

      - name: Commit CWA township forecast
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/cwa-F-D0047-093.json

          if git diff --cached --quiet; then
            echo "資料沒有變化，不需要提交"
            exit 0
          fi

          git commit -m "Update CWA township forecast"

          for attempt in 1 2 3 4 5; do
            echo "Git push attempt ${attempt}/5"

            git pull --rebase origin main

            if git push origin HEAD:main; then
              echo "CWA township forecast push succeeded."
              exit 0
            fi

            if [ "${attempt}" -eq 5 ]; then
              echo "Git push failed after 5 attempts."
              exit 1
            fi

            echo "Remote main changed; retrying..."
            sleep 5
          done
