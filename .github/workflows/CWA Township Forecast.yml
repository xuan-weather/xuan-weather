name: CWA Township Forecast

on:
  schedule:
    # 氣象署鄉鎮預報每天約 05:30 / 11:30 / 17:30 / 23:30 發布
    # 在發布後約 10 分鐘抓取。
    - cron: '40 21,3,9,15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cwa-township-forecast
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch CWA F-D0047-093 (全臺 368 鄉鎮)
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p data

          # F-D0047-093 是全臺 368 鄉鎮市區預報。
          # 氣象署 API 文件示範：F-D0047-093 可透過 locationId
          # 指定各縣市的鄉鎮資料。這裡一次指定全臺 22 個縣市，
          # 避免不帶 locationId 時 API 回傳 404。
          location_ids="F-D0047-001,F-D0047-005,F-D0047-009,F-D0047-013,F-D0047-017,F-D0047-021,F-D0047-025,F-D0047-029,F-D0047-033,F-D0047-037,F-D0047-041,F-D0047-045,F-D0047-049,F-D0047-053,F-D0047-057,F-D0047-061,F-D0047-065,F-D0047-069,F-D0047-073,F-D0047-077,F-D0047-081,F-D0047-085"

          cache_buster="$(date +%s%N)"
          url="https://opendata.cwa.gov.tw/api/v1/rest/datastore/F-D0047-093?locationId=${location_ids}&_=${cache_buster}"

          echo "開始下載 F-D0047-093..."
          echo "指定全臺 22 個縣市鄉鎮資料"

          curl --fail-with-body \
            --silent \
            --show-error \
            --retry 8 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 180 \
            --location \
            -H "Accept: application/json" \
            -H "Authorization: ${CWA_API_KEY}" \
            -H "Cache-Control: no-cache, no-store, max-age=0" \
            -H "Pragma: no-cache" \
            "$url" \
            -o data/cwa-F-D0047-093.json

          test -s data/cwa-F-D0047-093.json
          echo "F-D0047-093 下載完成"
          wc -c data/cwa-F-D0047-093.json

      - name: Validate 368 township forecast
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('fs');

          const path = 'data/cwa-F-D0047-093.json';
          const json = JSON.parse(fs.readFileSync(path, 'utf8'));

          const records =
            json?.records ||
            json?.result?.records ||
            {};

          const groups =
            records.Locations ||
            records.locations ||
            [];

          const groupArray = Array.isArray(groups) ? groups : [groups];

          const locations = groupArray.flatMap(group => {
            const list =
              group?.Location ||
              group?.location ||
              [];
            return Array.isArray(list) ? list : [];
          });

          const unique = new Set(
            locations
              .map(item =>
                String(
                  item?.Geocode ??
                  item?.geocode ??
                  ''
                ).trim()
              )
              .filter(Boolean)
          );

          console.log(`API 回傳 Location 數量：${locations.length}`);
          console.log(`API 回傳不重複 Geocode：${unique.size}`);

          if (unique.size < 300) {
            throw new Error(
              `F-D0047-093 鄉鎮數量異常：${unique.size}，拒絕覆蓋舊資料`
            );
          }

          console.log(
            `✓ F-D0047-093 驗證成功：${unique.size} 個鄉鎮市區`
          );
          NODE

      - name: Show township forecast sample
        run: |
          node <<'NODE'
          const fs = require('fs');

          const json = JSON.parse(
            fs.readFileSync('data/cwa-F-D0047-093.json', 'utf8')
          );

          const records =
            json?.records ||
            json?.result?.records ||
            {};

          const groups =
            records.Locations ||
            records.locations ||
            [];

          const groupArray = Array.isArray(groups) ? groups : [groups];

          const locations = groupArray.flatMap(group => {
            const list = group?.Location || group?.location || [];
            return Array.isArray(list) ? list : [];
          });

          for (const item of locations.slice(0, 5)) {
            console.log(
              `${item?.LocationName || ''} ` +
              `(${item?.Geocode || ''}) ` +
              `${item?.Latitude || ''},${item?.Longitude || ''}`
            );
          }
          NODE

      - name: Commit CWA township forecast
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/cwa-F-D0047-093.json

          if git diff --cached --quiet; then
            echo "資料沒有變化，不需要提交"
            exit 0
          fi

          git commit -m "Update CWA township forecast"

          for attempt in 1 2 3 4 5; do
            echo "Git push attempt ${attempt}/5"

            git pull --rebase origin main

            if git push origin HEAD:main; then
              echo "CWA township forecast push succeeded."
              exit 0
            fi

            if [ "${attempt}" -eq 5 ]; then
              echo "Git push failed after 5 attempts."
              exit 1
            fi

            echo "Remote main changed; retrying..."
            sleep 5
          done
