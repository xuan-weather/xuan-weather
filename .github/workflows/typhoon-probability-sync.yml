name: Sync CWA Typhoon Probability Map OCR Diagnostics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: sync-typhoon-probability
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-tra
          python -m pip install --upgrade pip
          python -m pip install requests pillow pytesseract numpy rapidocr_onnxruntime

      - name: Verify OCR dependencies
        run: |
          python -c "import numpy; print('numpy:', numpy.__version__)"
          python -c "import pytesseract; print('Tesseract wrapper: OK')"
          python -c "from PIL import Image; print('Pillow: OK')"
          python -c "from rapidocr_onnxruntime import RapidOCR; print('RapidOCR: OK')"

      - name: Fetch official CWA map and extract exact city percentages
        run: python scripts/fetch_typhoon_probability.py

      - name: Upload OCR diagnostics even when extraction fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typhoon-probability-ocr-diagnostics
          path: artifacts/typhoon-probability-debug/
          if-no-files-found: warn
          retention-days: 7

      - name: Commit updated JSON if changed
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/typhoon-probability.json

          if git diff --cached --quiet; then
            echo "No JSON changes to commit."
            exit 0
          fi

          git commit -m "chore: sync exact CWA typhoon probability data"

          # The branch may have advanced while OCR was running.
          # Rebase onto the latest remote commit before pushing; never force-push.
          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"
            git fetch origin "${TARGET_BRANCH}"

            if ! git rebase "origin/${TARGET_BRANCH}"; then
              git rebase --abort || true
              echo "::error::Rebase conflict detected. No force push was attempted; inspect concurrent changes to data/typhoon-probability.json."
              exit 1
            fi

            if git push origin "HEAD:${TARGET_BRANCH}"; then
              echo "JSON update pushed successfully."
              exit 0
            fi

            echo "Push was rejected; will fetch the latest branch and retry."
            sleep 2
          done

          echo "::error::Push failed after 3 attempts. The remote branch may still be changing."
          exit 1
