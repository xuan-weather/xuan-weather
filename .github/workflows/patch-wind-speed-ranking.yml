name: Fix nationwide wind speed ranking

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-wind-speed-ranking.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch wind speed ranking
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          source = path.read_text(encoding="utf-8")

          anchor = "        function renderRankings() {"
          helper = """        // 風速排行以完整 O-A0001 測站清單為底，再以 O-A0003 同站最新資料覆蓋。
          function buildWindSpeedRankingSource() {
              const hourly = Array.isArray(latestHourlyStationData) ? latestHourlyStationData : [];
              const realtime = Array.isArray(latestRealtimeStationData) ? latestRealtimeStationData : [];
              const byId = new Map();
              hourly.forEach(station => {
                  const id = String(station?.StationId || '').trim();
                  if (id) byId.set(id, station);
              });
              realtime.forEach(station => {
                  const id = String(station?.StationId || '').trim();
                  if (!id) return;
                  const base = byId.get(id) || {};
                  const baseWeather = base.WeatherElement || base.weatherElement || {};
                  const liveWeather = station.WeatherElement || station.weatherElement || {};
                  byId.set(id, {
                      ...base,
                      ...station,
                      GeoInfo: station.GeoInfo || base.GeoInfo,
                      ObsTime: station.ObsTime || base.ObsTime,
                      WeatherElement: { ...baseWeather, ...liveWeather }
                  });
              });
              return Array.from(byId.values());
          }

          // 風速只讀取平均風速欄位，不把最大陣風或最大10分鐘平均風混入。
          function getRankingWindSpeed(station) {
              const weather = station?.WeatherElement || station?.weatherElement || {};
              const candidates = [
                  weather.WindSpeed, weather.windSpeed, weather.WDSD, weather.Wind_Speed,
                  station?.WindSpeed, station?.windSpeed, station?.WDSD
              ];
              for (const raw of candidates) {
                  if (raw === null || raw === undefined || String(raw).trim() === '') continue;
                  const value = Number.parseFloat(String(raw).trim());
                  if (Number.isFinite(value) && value >= 0 && value <= 100) return value;
              }
              return NaN;
          }

"""
          if source.count(anchor) != 1:
              raise SystemExit(f"renderRankings anchor count mismatch: {source.count(anchor)}")
          source = source.replace(anchor, helper + anchor, 1)

          old_source = """            const rankingSource = isRainPeriod
                ? ((Array.isArray(cwaRainfallRankingData) && cwaRainfallRankingData.length > 0) ? cwaRainfallRankingData : [])
                : ((Array.isArray(latestRealtimeStationData) && latestRealtimeStationData.length > 0)
                    ? latestRealtimeStationData
                    : weatherStationData);"""
          new_source = """            const rankingSource = isRainPeriod
                ? ((Array.isArray(cwaRainfallRankingData) && cwaRainfallRankingData.length > 0) ? cwaRainfallRankingData : [])
                : (currentRankingTab === 'wind'
                    ? buildWindSpeedRankingSource()
                    : (currentRankingTab === 'windGust'
                        ? buildWindGustRankingSource()
                        : ((Array.isArray(latestRealtimeStationData) && latestRealtimeStationData.length > 0)
                            ? latestRealtimeStationData
                            : weatherStationData)));"""
          if source.count(old_source) != 1:
              raise SystemExit(f"ranking source anchor count mismatch: {source.count(old_source)}")
          source = source.replace(old_source, new_source, 1)

          start = source.index(anchor)
          end = source.index("        function ", start + len(anchor))
          block = source[start:end]
          old_value = "                    windSpeed: data.windSpeed"
          new_value = "                    windSpeed: currentRankingTab === 'wind' ? getRankingWindSpeed(station) : data.windSpeed"
          if block.count(old_value) != 1:
              raise SystemExit(f"windSpeed mapping anchor count mismatch in ranking block: {block.count(old_value)}")
          block = block.replace(old_value, new_value, 1)

          old_sort = """                let validList = parsedList.filter(item => Number.isFinite(item.windSpeed) && item.windSpeed >= 0);
                validList.sort((a, b) => b.windSpeed - a.windSpeed);"""
          new_sort = """                // 依測站 ID 去重，保留該站較大的有效平均風速，再由大至小排序。
                const windSpeedByStation = new Map();
                parsedList.forEach(item => {
                    const id = String(item.stationId || '').trim();
                    if (!id || !Number.isFinite(item.windSpeed) || item.windSpeed < 0) return;
                    const previous = windSpeedByStation.get(id);
                    if (!previous || item.windSpeed > previous.windSpeed) windSpeedByStation.set(id, item);
                });
                let validList = Array.from(windSpeedByStation.values());
                validList.sort((a, b) => (b.windSpeed - a.windSpeed) ||
                    String(a.stationName || '').localeCompare(String(b.stationName || ''), 'zh-Hant'));"""
          if block.count(old_sort) != 1:
              raise SystemExit(f"wind speed sort anchor count mismatch: {block.count(old_sort)}")
          block = block.replace(old_sort, new_sort, 1)
          source = source[:start] + block + source[end:]

          path.write_text(source, encoding="utf-8")
          print("Patched wind speed ranking source, value parsing, deduplication and descending sort.")
          PY
      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/patch-wind-speed-ranking.yml
          git commit -m "Fix nationwide wind speed ranking coverage and order"
          git push origin main
