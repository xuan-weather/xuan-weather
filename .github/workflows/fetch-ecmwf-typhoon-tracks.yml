name: Fetch ECMWF Typhoon Tracks

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-ecmwf-typhoon-tracks
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ECMWF Open Data client and ecCodes tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-tools
          python -m pip install --upgrade pip
          python -m pip install ecmwf-opendata

      - name: Preserve current published tracks
        run: |
          mkdir -p data
          if [ -f data/typhoon-model-tracks.json ]; then
            cp data/typhoon-model-tracks.json /tmp/typhoon-model-tracks.previous.json
            echo "PREVIOUS_EXISTS=true" >> "$GITHUB_ENV"
          else
            echo "PREVIOUS_EXISTS=false" >> "$GITHUB_ENV"
          fi

      - name: Fetch official ECMWF BUFR tracks
        run: python scripts/fetch_ecmwf_typhoon_tracks.py

      - name: Validate result and preserve existing IFS route
        run: |
          python - <<'PY'
          import json, os, shutil, sys
          from pathlib import Path

          output = Path("data/typhoon-model-tracks.json")
          previous = Path("/tmp/typhoon-model-tracks.previous.json")
          valid = False
          try:
              data = json.loads(output.read_text(encoding="utf-8"))
              tracks = data.get("tracks", [])
              valid = isinstance(tracks, list) and any(
                  str(t.get("model", "")).upper() in ("ECMWF IFS", "IFS")
                  and isinstance(t.get("points"), list)
                  and len(t["points"]) >= 2
                  for t in tracks if isinstance(t, dict)
              )
          except Exception as exc:
              print(f"Generated JSON is invalid: {exc}")

          if not valid:
              if os.environ.get("PREVIOUS_EXISTS") == "true" and previous.exists():
                  shutil.copy2(previous, output)
                  print("No valid IFS route in new output; restored previous JSON to protect the existing route.")
              else:
                  output.unlink(missing_ok=True)
                  print("No valid IFS route and no previous JSON to restore.")
              sys.exit("Validation failed; refusing to publish the new JSON.")

          print("Validation passed: new JSON contains an ECMWF IFS route with at least two points.")
          print("Other models are only included when real BUFR data was downloaded and decoded.")
          PY

      - name: Commit updated track data
        run: |
          if git diff --quiet -- data/typhoon-model-tracks.json; then
            echo "No changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/typhoon-model-tracks.json
          git commit -m "Update ECMWF tropical cyclone tracks"
          git push origin HEAD:main
