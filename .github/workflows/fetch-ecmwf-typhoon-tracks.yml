name: Fetch ECMWF Typhoon Tracks

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths:
      - "scripts/fetch_ecmwf_typhoon_tracks.py"
      - ".github/workflows/fetch-ecmwf-typhoon-tracks.yml"

permissions:
  contents: write

concurrency:
  group: ecmwf-typhoon-tracks
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ecCodes and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-tools
          python -m pip install --upgrade pip
          python -m pip install ecmwf-opendata

      - name: Verify ecCodes tools
        run: |
          command -v bufr_dump
          bufr_dump -V

      - name: Fetch and parse ECMWF track products
        run: python scripts/fetch_ecmwf_typhoon_tracks.py

      # Keep a real IFS BUFR file and ecCodes JSON dump for diagnosis.
      # Upload as an Actions artifact; do not commit binary data to the repo.
      - name: Download IFS BUFR diagnostic sample
        if: always()
        run: |
          mkdir -p diagnostics
          python - <<'PY'
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          import json
          import subprocess

          out = Path("diagnostics")
          summary = {"status": "not_started", "attempts": []}
          try:
              from ecmwf.opendata import Client
          except Exception as exc:
              summary["status"] = "dependency_error"
              summary["error"] = repr(exc)
              (out / "download-summary.json").write_text(
                  json.dumps(summary, indent=2), encoding="utf-8"
              )
              raise

          now = datetime.now(timezone.utc)
          hour = (now.hour // 6) * 6
          latest = now.replace(
              hour=hour, minute=0, second=0, microsecond=0
          )
          cycles = [latest - timedelta(hours=back) for back in range(0, 36, 6)]

          for cycle in cycles:
              step = 144 if cycle.hour in (6, 18) else 240
              target = out / f"ifs-tf-{cycle:%Y%m%d%H}z-{step}h.bufr"
              target.unlink(missing_ok=True)
              try:
                  Client(source="aws").retrieve(
                      date=cycle.strftime("%Y%m%d"),
                      time=cycle.hour,
                      stream="oper",
                      type="tf",
                      step=step,
                      target=str(target),
                  )
                  size = target.stat().st_size if target.exists() else 0
                  summary["attempts"].append({
                      "cycle": cycle.strftime("%Y-%m-%dT%H:%M:%SZ"),
                      "stepHours": step,
                      "bytes": size,
                  })
                  if size > 0:
                      summary["status"] = "downloaded"
                      summary["selectedFile"] = target.name
                      dump = subprocess.run(
                          ["bufr_dump", "-j", "s", str(target)],
                          text=True, capture_output=True, check=False,
                      )
                      (out / "ifs-bufr-dump.stdout.txt").write_text(
                          dump.stdout or "", encoding="utf-8"
                      )
                      (out / "ifs-bufr-dump.stderr.txt").write_text(
                          dump.stderr or "", encoding="utf-8"
                      )
                      summary["bufrDumpExitCode"] = dump.returncode
                      try:
                          parsed = json.loads(dump.stdout)
                          (out / "ifs-bufr-dump.json").write_text(
                              json.dumps(parsed, ensure_ascii=False, indent=2),
                              encoding="utf-8",
                          )
                          summary["jsonParse"] = "valid"
                      except Exception as exc:
                          summary["jsonParse"] = "failed"
                          summary["jsonParseError"] = repr(exc)
                      break
              except Exception as exc:
                  summary["attempts"].append({
                      "cycle": cycle.strftime("%Y-%m-%dT%H:%M:%SZ"),
                      "stepHours": step,
                      "error": f"{type(exc).__name__}: {exc}",
                  })

          if summary["status"] != "downloaded":
              summary["status"] = "no_product_downloaded"
          (out / "download-summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Upload BUFR diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecmwf-ifs-bufr-diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Commit updated JSON
        if: always() && hashFiles('data/typhoon-model-tracks.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/typhoon-model-tracks.json /tmp/typhoon-model-tracks.json

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/typhoon-model-tracks.json data/typhoon-model-tracks.json
            git add data/typhoon-model-tracks.json

            if git diff --cached --quiet; then
              echo "No data changes to commit."
              exit 0
            fi

            git commit -m "Update ECMWF typhoon track data"
            if git push origin HEAD:main; then
              echo "JSON update pushed successfully."
              exit 0
            fi
            echo "Push failed; retrying with latest main."
          done

          echo "Failed to push after 3 attempts."
          exit 1
