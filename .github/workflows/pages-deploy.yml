name: Deploy Xuan Weather to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Cancel stuck Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -sS -o /tmp/pages-cancel-response.txt -w "%{http_code}" -X POST \\
            -H "Accept: application/vnd.github+json" \\
            -H "Authorization: Bearer ${GH_TOKEN}" \\
            -H "X-GitHub-Api-Version: 2022-11-28" \\
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments/0006eec2c575247f54986a63f69455d50df4ba4f/cancel")

          if [ "$status" = "204" ]; then
            echo "Stuck Pages deployment cancelled."
          elif [ "$status" = "404" ]; then
            echo "Stuck Pages deployment is already cleared or no longer exists."
          else
            echo "Could not cancel Pages deployment. HTTP status: $status"
            cat /tmp/pages-cancel-response.txt
            exit 1
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
