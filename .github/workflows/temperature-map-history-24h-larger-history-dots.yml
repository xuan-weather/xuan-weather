name: 氣溫分布每小時紀錄

on:
  schedule:
    # GitHub Actions 使用 UTC；每小時第 7 分鐘擷取，避開整點更新尖峰。
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temperature-map-history
  cancel-in-progress: false

jobs:
  capture-map:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Capture current Taiwan temperature distribution map
        env:
          SITE_URL: https://xuan-weather.github.io/xuan-weather/
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1100 }, deviceScaleFactor: 1 });
            page.setDefaultTimeout(45000);
            try {
              await page.goto(process.env.SITE_URL, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForTimeout(18000);
              const mapTab = page.locator('#tabMap');
              await mapTab.click();
              const map = page.locator('#map.leaflet-container');
              await map.waitFor({ state: 'visible', timeout: 45000 });

              // 地圖原本在隱藏分頁時可能已初始化；切換顯示後強制重新計算尺寸，
              // 避免 Leaflet 圖磚只鋪滿上半部、下半部露出黑色背景。
              await page.evaluate(() => {
                window.dispatchEvent(new Event('resize'));
                const el = document.querySelector('#map');
                if (el) {
                  el.style.background = '#0b1220';
                  el.getBoundingClientRect();
                }
              });
              await page.waitForTimeout(1200);

              const tempButton = page.locator('#mapModeBtnGroup button').filter({ hasText: '氣溫' }).first();
              if (await tempButton.count()) await tempButton.click();

              // 再觸發一次 resize，讓 Leaflet 在切換圖層後重新鋪設地圖圖磚。
              await page.evaluate(() => window.dispatchEvent(new Event('resize')));
              await page.waitForTimeout(5000);
              await page.locator('#map .leaflet-tile').first().waitFor({ state: 'visible', timeout: 30000 });

              // 記錄地圖實際尺寸，並確認容器不是零尺寸。
              const mapSize = await page.locator('#map').evaluate(el => {
                const r = el.getBoundingClientRect();
                return { width: Math.round(r.width), height: Math.round(r.height) };
              });
              if (mapSize.width < 300 || mapSize.height < 200) {
                throw new Error(`地圖容器尺寸異常：${mapSize.width}x${mapSize.height}`);
              }

              const markerCount = await page.locator('#map .leaflet-marker-icon').count();
              if (markerCount < 50) throw new Error(`溫度測站圓點數量不足（${markerCount}），為避免保存不完整圖片而中止。`);
              const timeLabel = (await page.locator('#mapObsTimeTag').innerText().catch(() => '')).trim();
              const now = new Date();
              const parts = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(now).reduce((a,p)=>(a[p.type]=p.value,a),{});
              const stamp = `${parts.year}-${parts.month}-${parts.day}-${parts.hour}`;
              const isoLocal = `${parts.year}-${parts.month}-${parts.day}T${parts.hour}:${parts.minute}:00+08:00`;
              const imageDir = path.join(process.cwd(), 'temperature-map-history');
              fs.mkdirSync(imageDir, { recursive: true });
              const imageName = `${stamp}.jpg`;
              const imagePath = path.join(imageDir, imageName);
              // 只放大「保存到共用歷史紀錄」的截圖圓點；不修改正式網站即時地圖的顯示。
              // 放大內層圓點，避免改變 Leaflet 外層 marker 的定位座標。
              await page.addStyleTag({ content: `
                #map .leaflet-marker-icon.custom-station-marker > div {
                  transform: scale(1.5) !important;
                  transform-origin: center center !important;
                }
              ` });
              await page.waitForTimeout(150);

              await page.locator('#map').screenshot({
                path: imagePath,
                type: 'jpeg',
                quality: 82,
                timeout: 45000,
                animations: 'disabled'
              });
              console.log(`地圖容器尺寸：${mapSize.width}x${mapSize.height}`);
              const manifestPath = path.join(process.cwd(), 'data', 'temperature-map-history.json');
              fs.mkdirSync(path.dirname(manifestPath), { recursive: true });
              let items = [];
              if (fs.existsSync(manifestPath)) {
                try { const old = JSON.parse(fs.readFileSync(manifestPath, 'utf8')); items = Array.isArray(old) ? old : (Array.isArray(old.items) ? old.items : []); } catch {}
              }
              items = items.filter(x => x && x.image !== `temperature-map-history/${imageName}`);
              items.unshift({ capturedAt: isoLocal, image: `temperature-map-history/${imageName}`, observationTime: timeLabel, stationCount: markerCount });
              // 只保留最近 24 小時的紀錄；過期項目會從索引與圖片檔案中清除。
              const cutoff = now.getTime() - 24 * 60 * 60 * 1000;
              const keep = [];
              for (const item of items) {
                const ts = Date.parse(item && item.capturedAt || '');
                if (item && Number.isFinite(ts) && ts >= cutoff) {
                  keep.push(item);
                } else if (item && item.image) {
                  const rel = String(item.image).replace(/^\/+/, '');
                  if (rel.startsWith('temperature-map-history/') && !rel.includes('..')) {
                    try { fs.rmSync(path.join(process.cwd(), rel), { force: true }); } catch {}
                  }
                }
              }

              // 另外清除索引未列出、但資料夾內仍殘留的 24 小時以前 JPG。
              // 檔名格式為 YYYY-MM-DD-HH.jpg，時間採台灣時區。
              for (const file of fs.readdirSync(imageDir)) {
                const match = file.match(/^(\d{4}-\d{2}-\d{2})-(\d{2})\.jpg$/i);
                if (!match) continue;
                const fileTime = Date.parse(`${match[1]}T${match[2]}:00:00+08:00`);
                if (Number.isFinite(fileTime) && fileTime < cutoff) {
                  try { fs.rmSync(path.join(imageDir, file), { force: true }); } catch {}
                }
              }

              keep.sort((a,b) => Date.parse(b.capturedAt || 0) - Date.parse(a.capturedAt || 0));
              fs.writeFileSync(manifestPath, JSON.stringify({ updatedAt: isoLocal, items: keep }, null, 2) + '\n');
              console.log(`24 小時保留清理完成，目前索引 ${keep.length} 筆紀錄。`);
              console.log(`已擷取 ${imageName}；測站圓點 ${markerCount}；觀測時間 ${timeLabel}`);
            } finally { await browser.close(); }
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Commit hourly image and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add temperature-map-history data/temperature-map-history.json
          if git diff --cached --quiet; then
            echo "No new temperature-map history changes to commit."
          else
            git commit -m "chore: save hourly Taiwan temperature map"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
