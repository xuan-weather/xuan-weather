name: CWA Township 7-Day Forecast Refresh

on:
  schedule:
    # 台灣時間 05:40、11:40、17:40、23:40
    - cron: "40 21,3,9,15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cwa-township-7day-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and validate official 7-day forecast
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "${CWA_API_KEY:-}" || {
            echo "::error::缺少 CWA_API_KEY Secret"
            exit 1
          }

          mkdir -p data
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          # 明確列出22個資料集，包含金門縣 F-D0047-087。
          python - "$tmpdir/ids.txt" <<'PYIDS'
          ids = [
              3, 7, 11, 15, 19, 23, 27, 31, 35, 39, 43,
              47, 51, 55, 59, 63, 67, 71, 75, 79, 83, 87
          ]
          assert len(ids) == 22 and ids[-1] == 87

          with open(__import__('sys').argv[1], 'w', encoding='utf-8') as f:
              f.write('\n'.join(f'F-D0047-{i:03d}' for i in ids) + '\n')

          print(
              f'將依序下載 {len(ids)} 個資料集，'
              '最後一個為 F-D0047-087（金門縣）'
          )
          PYIDS

          # 逐一下載並驗證每個官方資料集。
          while IFS= read -r dataid || [ -n "$dataid" ]; do
            [ -n "$dataid" ] || continue

            out="$tmpdir/$dataid.json"
            url="https://opendata.cwa.gov.tw/api/v1/rest/datastore/$dataid"

            echo "下載官方週預報：$dataid"

            code="$(curl --silent --show-error --location --get \
              --retry 2 --retry-all-errors --retry-delay 2 \
              --connect-timeout 20 --max-time 120 \
              --data-urlencode "Authorization=${CWA_API_KEY}" \
              --data-urlencode "format=JSON" \
              -H "Cache-Control: no-cache" \
              -o "$out" -w '%{http_code}' "$url" || true)"

            if [[ ! "$code" =~ ^2[0-9][0-9]$ ]]; then
              echo "::error::$dataid 下載失敗，HTTP $code"
              head -c 500 "$out" 2>/dev/null || true
              echo
              exit 1
            fi

            python - "$out" "$dataid" <<'PYVALID'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          dataid = sys.argv[2]

          try:
              data = json.loads(path.read_text(encoding='utf-8'))
          except Exception as exc:
              raise SystemExit(f"{dataid} JSON 解析失敗：{exc}")

          if data.get('success') is False or data.get('error'):
              raise SystemExit(
                  f"{dataid} API 回傳錯誤：{str(data)[:400]}"
              )

          groups = data.get('records', {}).get('Locations', [])
          if isinstance(groups, dict):
              groups = [groups]

          towns = 0
          for group in groups:
              if not isinstance(group, dict):
                  continue
              locations = group.get('Location', [])
              if isinstance(locations, dict):
                  locations = [locations]
              if isinstance(locations, list):
                  towns += sum(
                      1 for location in locations
                      if isinstance(location, dict)
                  )

          if not groups or towns < 1:
              raise SystemExit(f"{dataid} 沒有可用鄉鎮資料")

          print(f"{dataid} 驗證通過：{towns} 個鄉鎮")
          PYVALID

          done < "$tmpdir/ids.txt"

          # 合併各縣市資料；完整性不足時，不覆蓋既有資料。
          python - "$tmpdir" data/cwa-F-D0047-093.json <<'PYMERGE'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          by_county = {}

          for path in sorted(root.glob('F-D0047-*.json')):
              data = json.loads(path.read_text(encoding='utf-8'))
              rows = data.get('records', {}).get('Locations', [])

              if isinstance(rows, dict):
                  rows = [rows]

              for group in rows:
                  if not isinstance(group, dict):
                      continue

                  name = (
                      group.get('LocationsName')
                      or group.get('LocationName')
                  )

                  locations = group.get('Location', [])
                  if isinstance(locations, dict):
                      locations = [locations]

                  locations = [
                      item for item in locations
                      if isinstance(item, dict)
                  ]

                  if not name or not locations:
                      continue

                  previous = by_county.get(name)
                  old_locations = (
                      previous.get('Location', []) if previous else []
                  )

                  if previous is None or len(locations) > len(old_locations):
                      copied = dict(group)
                      copied['Location'] = locations
                      by_county[name] = copied

          groups = list(by_county.values())
          towns = sum(len(group.get('Location', [])) for group in groups)

          if len(groups) != 22 or towns != 368:
              print('實際取得縣市：' + ', '.join(sorted(by_county.keys())))
              raise SystemExit(
                  f'合併驗證失敗：縣市 {len(groups)}/22、'
                  f'鄉鎮 {towns}/368；拒絕覆蓋原始資料。'
                  '請檢查 F-D0047-087（金門縣）是否成功下載。'
              )

          output = {
              'success': True,
              'records': {'Locations': groups}
          }

          Path(sys.argv[2]).write_text(
              json.dumps(output, ensure_ascii=False, separators=(',', ':')),
              encoding='utf-8'
          )

          print(f'合併成功：{len(groups)} 組縣市、{towns} 個鄉鎮')
          PYMERGE

      - name: Rebuild web forecast JSON
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timedelta, timezone

          src = Path("data/cwa-F-D0047-093.json")
          dst = Path("data/cwa-F-D0047-093-web.json")
          tz = timezone(timedelta(hours=8))
          today = datetime.now(tz).date()

          raw = json.loads(src.read_text(encoding="utf-8"))
          groups = raw.get("records", {}).get("Locations", [])

          if isinstance(groups, dict):
              groups = [groups]

          def element_map(location, names):
              for element in location.get("WeatherElement", []) or []:
                  if element.get("ElementName") in names:
                      result = {}
                      for item in element.get("Time", []) or []:
                          key = item.get("StartTime") or item.get("DataTime")
                          values = item.get("ElementValue") or []
                          if key:
                              result[key] = (
                                  values[0] if values and isinstance(values[0], dict)
                                  else {}
                              )
                      return result
              return {}

          def getval(mapping, key, keys):
              for field in keys:
                  value = mapping.get(key, {}).get(field)
                  if value not in (None, "", "-", "NA", "N/A"):
                      try:
                          return float(value) if "." in str(value) else int(value)
                      except (ValueError, TypeError):
                          return value
              return None

          def nearest(mapping, start, keys):
              if not mapping:
                  return None

              target = datetime.fromisoformat(start.replace("Z", "+00:00"))
              key = min(
                  mapping,
                  key=lambda item: abs((
                      datetime.fromisoformat(item.replace("Z", "+00:00"))
                      - target
                  ).total_seconds())
              )
              return getval(mapping, key, keys)

          counties = {}
          dates = set()
          total = 0

          for group in groups:
              if not isinstance(group, dict):
                  continue

              county = (
                  group.get("LocationsName")
                  or group.get("LocationName")
              )
              locations = group.get("Location", []) or []

              if isinstance(locations, dict):
                  locations = [locations]

              if not county:
                  continue

              county_output = {}

              for location in locations:
                  if not isinstance(location, dict):
                      continue

                  location_name = location.get("LocationName")
                  if not location_name:
                      continue

                  elements = location.get("WeatherElement", []) or []

                  weather = element_map(location, ["天氣現象"])
                  lows = element_map(location, ["最低溫度"])
                  highs = element_map(location, ["最高溫度"])
                  pops = element_map(
                      location, ["12小時降雨機率", "降雨機率"]
                  )

                  periods = next(
                      (
                          element.get("Time", [])
                          for element in elements
                          if element.get("ElementName") == "天氣現象"
                      ),
                      []
                  )

                  if not periods:
                      periods = next(
                          (
                              element.get("Time", [])
                              for element in elements
                              if element.get("ElementName") == "最低溫度"
                          ),
                          []
                      )

                  days = []

                  for period in periods or []:
                      start = period.get("StartTime") or period.get("DataTime")
                      if not start:
                          continue

                      try:
                          dt = datetime.fromisoformat(
                              start.replace("Z", "+00:00")
                          ).astimezone(tz)
                      except ValueError:
                          continue

                      day = dt.date()
                      if day < today or day >= today + timedelta(days=7):
                          continue

                      weather_value = weather.get(start, {})
                      low = getval(
                          lows, start, ["MinTemperature", "Temperature"]
                      )
                      high = getval(
                          highs, start, ["MaxTemperature", "Temperature"]
                      )
                      pop = getval(
                          pops, start, ["ProbabilityOfPrecipitation"]
                      )

                      if low is None:
                          low = nearest(
                              lows, start, ["MinTemperature", "Temperature"]
                          )
                      if high is None:
                          high = nearest(
                              highs, start, ["MaxTemperature", "Temperature"]
                          )
                      if pop is None:
                          pop = nearest(
                              pops, start, ["ProbabilityOfPrecipitation"]
                          )

                      description = (
                          weather_value.get("Weather")
                          or weather_value.get("天氣現象")
                          or ""
                      )
                      code = (
                          weather_value.get("WeatherCode")
                          or weather_value.get("WeatherCodeValue")
                          or ""
                      )

                      if not description and low is None and high is None:
                          continue

                      days.append({
                          "date": day.isoformat(),
                          "period": "night" if dt.hour >= 18 else "day",
                          "start": start,
                          "end": period.get("EndTime", ""),
                          "min": low,
                          "max": high,
                          "pop": pop,
                          "wx": description,
                          "wxCode": str(code)
                      })
                      dates.add(day.isoformat())

                  days.sort(key=lambda item: (item["date"], item["start"]))

                  if days:
                      county_output[location_name] = {
                          "geocode": str(location.get("Geocode", "")),
                          "lat": str(location.get("Latitude", "")),
                          "lon": str(location.get("Longitude", "")),
                          "days": days
                      }

              if county_output:
                  counties[county] = county_output
                  total += len(county_output)

          expected = [
              (today + timedelta(days=offset)).isoformat()
              for offset in range(7)
          ]

          if len(counties) != 22 or total != 368:
              raise SystemExit(
                  f"整合驗證失敗：縣市 {len(counties)}/22、"
                  f"鄉鎮 {total}/368；不覆蓋舊 web JSON"
              )

          missing = [day for day in expected if day not in dates]
          if missing:
              raise SystemExit(
                  f"整合驗證失敗：缺少日期 {','.join(missing)}；"
                  "不覆蓋舊 web JSON"
              )

          result = {
              "success": True,
              "source": "CWA 官方各縣市 F-D0047 一週鄉鎮預報合併",
              "generatedAt": datetime.now(timezone.utc).isoformat(
                  timespec="milliseconds"
              ).replace("+00:00", "Z"),
              "startDate": expected[0],
              "days": 7,
              "counties": counties
          }

          temporary = dst.with_suffix(".json.tmp")
          temporary.write_text(
              json.dumps(result, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8"
          )
          temporary.replace(dst)

          print(
              f"完成：{total} 鄉鎮；完整 7 天 "
              f"{expected[0]} 至 {expected[-1]}"
          )
          PY

      - name: Commit and push updated JSON
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/cwa-F-D0047-093.json \
            data/cwa-F-D0047-093-web.json

          if git diff --cached --quiet; then
            echo "資料沒有變化"
            exit 0
          fi

          git commit -m "Refresh CWA township 7-day forecast"

          for attempt in 1 2 3 4 5; do
            git fetch origin main

            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi

            git rebase --abort 2>/dev/null || true

            if [ "$attempt" -eq 5 ]; then
              echo "::error::推送重試 5 次仍失敗"
              exit 1
            fi

            sleep $((attempt * 4))
          done
