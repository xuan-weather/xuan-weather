name: CWA Township 7-Day Forecast Refresh

on:
  schedule:
    # 台灣時間 05:40、11:40、17:40、23:40
    - cron: "40 21,3,9,15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cwa-township-7day-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and validate official 7-day forecast
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CWA_API_KEY:-}" || { echo "::error::缺少 CWA_API_KEY Secret"; exit 1; }
          mkdir -p data
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          # 明確列出22個資料集，包含金門縣 F-D0047-087。
          python - "$tmpdir/ids.txt" <<'PYIDS'
          ids=[3,7,11,15,19,23,27,31,35,39,43,47,51,55,59,63,67,71,75,79,83,87]
          assert len(ids)==22 and ids[-1]==87
          with open(__import__('sys').argv[1],'w') as f:
              f.write('\n'.join(f'F-D0047-{i:03d}' for i in ids))
          print(f'將依序下載 {len(ids)} 個資料集，最後一個為 F-D0047-087（金門縣）')
          PYIDS

          while IFS= read -r dataid; do
            [ -n "$dataid" ] || continue
            out="$tmpdir/$dataid.json"
            url="https://opendata.cwa.gov.tw/api/v1/rest/datastore/$dataid"
            echo "下載官方週預報：$dataid"
            code="$(curl --silent --show-error --location --get \
              --retry 2 --retry-all-errors --retry-delay 2 \
              --connect-timeout 20 --max-time 120 \
              --data-urlencode "Authorization=${CWA_API_KEY}" \
              --data-urlencode "format=JSON" \
              -H "Cache-Control: no-cache" \
              -o "$out" -w '%{http_code}' "$url" || true)"

            if [[ ! "$code" =~ ^2[0-9][0-9]$ ]]; then
              echo "::error::$dataid 下載失敗，HTTP $code"
              head -c 500 "$out" 2>/dev/null || true
              echo
              exit 1
            fi

            python - "$out" "$dataid" <<'PYVALID'
          import json,sys
          from pathlib import Path
          d=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          if d.get('success') is False or d.get('error'):
              raise SystemExit(f"{sys.argv[2]} API 回傳錯誤：{str(d)[:400]}")
          groups=d.get('records',{}).get('Locations',[])
          if isinstance(groups,dict):
              groups=[groups]
          towns=sum(
              len(g.get('Location',[]) if isinstance(g.get('Location',[]),list) else [g.get('Location')])
              for g in groups if isinstance(g,dict)
          )
          if not groups or towns < 1:
              raise SystemExit(f"{sys.argv[2]} 沒有可用鄉鎮資料")
          print(f"{sys.argv[2]} 驗證通過：{towns} 個鄉鎮")
          PYVALID
          done < "$tmpdir/ids.txt"

          # 按縣市名稱合併，重複時保留鄉鎮資料較完整的一組。
          python - "$tmpdir" data/cwa-F-D0047-093.json <<'PYMERGE'
          import json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          by_county={}

          for p in sorted(root.glob('F-D0047-*.json')):
              d=json.loads(p.read_text(encoding='utf-8'))
              rows=d.get('records',{}).get('Locations',[])
              if isinstance(rows,dict):
                  rows=[rows]

              for g in rows:
                  if not isinstance(g,dict):
                      continue
                  name=g.get('LocationsName') or g.get('LocationName')
                  locs=g.get('Location',[])
                  if isinstance(locs,dict):
                      locs=[locs]
                  locs=[x for x in locs if isinstance(x,dict)]

                  if not name or not locs:
                      continue

                  previous=by_county.get(name)
                  old_locs=previous.get('Location',[]) if previous else []
                  if previous is None or len(locs)>len(old_locs):
                      copy=dict(g)
                      copy['Location']=locs
                      by_county[name]=copy

          groups=list(by_county.values())
          towns=sum(len(g.get('Location',[])) for g in groups)

          if len(groups)!=22 or towns!=368:
              print('實際取得縣市：' + ', '.join(sorted(by_county.keys())))
              raise SystemExit(
                  f'合併驗證失敗：縣市 {len(groups)}/22、鄉鎮 {towns}/368；'
                  '拒絕覆蓋原始資料。請檢查 F-D0047-087（金門縣）是否成功下載。'
              )

          out={'success':True,'records':{'Locations':groups}}
          Path(sys.argv[2]).write_text(
              json.dumps(out,ensure_ascii=False,separators=(',',':')),
              encoding='utf-8'
          )
          print(f'合併成功：{len(groups)} 組縣市、{towns} 個鄉鎮')
          PYMERGE

      - name: Rebuild web forecast JSON
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime,timedelta,timezone

          src=Path("data/cwa-F-D0047-093.json")
          dst=Path("data/cwa-F-D0047-093-web.json")
          tz=timezone(timedelta(hours=8))
          today=datetime.now(tz).date()

          raw=json.loads(src.read_text(encoding="utf-8"))
          groups=raw.get("records",{}).get("Locations",[])
          if isinstance(groups,dict):
              groups=[groups]

          def element_map(loc,names):
              for e in loc.get("WeatherElement",[]) or []:
                  if e.get("ElementName") in names:
                      out={}
                      for t in e.get("Time",[]) or []:
                          k=t.get("StartTime") or t.get("DataTime")
                          v=t.get("ElementValue") or []
                          if k:
                              out[k]=v[0] if v and isinstance(v[0],dict) else {}
                      return out
              return {}

          def getval(mapping,key,keys):
              for k in keys:
                  v=mapping.get(key,{}).get(k)
                  if v not in (None,"","-","NA","N/A"):
                      try:
                          return float(v) if "." in str(v) else int(v)
                      except (ValueError,TypeError):
                          return v
              return None

          def nearest(mapping,start,keys):
              if not mapping:
                  return None
              target=datetime.fromisoformat(start.replace("Z","+00:00"))
              k=min(
                  mapping,
                  key=lambda x:abs((
                      datetime.fromisoformat(x.replace("Z","+00:00"))-target
                  ).total_seconds())
              )
              return getval(mapping,k,keys)

          counties={}
          dates=set()
          total=0

          for group in groups:
              if not isinstance(group,dict):
                  continue
              county=group.get("LocationsName") or group.get("LocationName")
              locs=group.get("Location",[]) or []
              if isinstance(locs,dict):
                  locs=[locs]
              if not county:
                  continue

              out={}
              for loc in locs:
                  if not isinstance(loc,dict) or not loc.get("LocationName"):
                      continue

                  els=loc.get("WeatherElement",[]) or []
                  wx=element_map(loc,["天氣現象"])
                  lows=element_map(loc,["最低溫度"])
                  highs=element_map(loc,["最高溫度"])
                  pops=element_map(loc,["12小時降雨機率","降雨機率"])

                  periods=next(
                      (e.get("Time",[]) for e in els if e.get("ElementName")=="天氣現象"),
                      []
                  )
                  if not periods:
                      periods=next(
                          (e.get("Time",[]) for e in els if e.get("ElementName")=="最低溫度"),
                          []
                      )

                  days=[]
                  for p in periods or []:
                      start=p.get("StartTime") or p.get("DataTime")
                      if not start:
                          continue
                      try:
                          dt=datetime.fromisoformat(start.replace("Z","+00:00")).astimezone(tz)
                      except ValueError:
                          continue

                      day=dt.date()
                      if day<today or day>=today+timedelta(days=7):
                          continue

                      w=wx.get(start,{})
                      low=getval(lows,start,["MinTemperature","Temperature"])
                      high=getval(highs,start,["MaxTemperature","Temperature"])
                      pop=getval(pops,start,["ProbabilityOfPrecipitation"])

                      if low is None:
                          low=nearest(lows,start,["MinTemperature","Temperature"])
                      if high is None:
                          high=nearest(highs,start,["MaxTemperature","Temperature"])
                      if pop is None:
                          pop=nearest(pops,start,["ProbabilityOfPrecipitation"])

                      desc=w.get("Weather") or w.get("天氣現象") or ""
                      code=w.get("WeatherCode") or w.get("WeatherCodeValue") or ""

                      if not desc and low is None and high is None:
                          continue

                      days.append({
                          "date":day.isoformat(),
                          "period":"night" if dt.hour>=18 else "day",
                          "start":start,
                          "end":p.get("EndTime",""),
                          "min":low,
                          "max":high,
                          "pop":pop,
                          "wx":desc,
                          "wxCode":str(code)
                      })
                      dates.add(day.isoformat())

                  days.sort(key=lambda x:(x["date"],x["start"]))
                  if days:
                      out[loc["LocationName"]]={
                          "geocode":str(loc.get("Geocode","")),
                          "lat":str(loc.get("Latitude","")),
                          "lon":str(loc.get("Longitude","")),
                          "days":days
                      }

              if out:
                  counties[county]=out
                  total+=len(out)

          ds=sorted(dates)
          if len(counties)!=22 or total!=368 or len(ds)<7:
              raise SystemExit(
                  f"整合驗證失敗：縣市 {len(counties)}/22、鄉鎮 {total}/368、"
                  f"有效預報日期 {len(ds)}；不覆蓋舊 web JSON"
              )

          expected=[(today+timedelta(days=i)).isoformat() for i in range(7)]
          missing=[d for d in expected if d not in set(ds)]
          if missing:
              raise SystemExit(
                  f"整合驗證失敗：缺少日期 {','.join(missing)}；不覆蓋舊 web JSON"
              )

          result={
              "success":True,
              "source":"CWA 官方各縣市 F-D0047 一週鄉鎮預報合併",
              "generatedAt":datetime.now(timezone.utc).isoformat(
                  timespec="milliseconds"
              ).replace("+00:00","Z"),
              "startDate":expected[0],
              "days":7,
              "counties":counties
          }

          tmp=dst.with_suffix(".json.tmp")
          tmp.write_text(
              json.dumps(result,ensure_ascii=False,separators=(",",":")),
              encoding="utf-8"
          )
          tmp.replace(dst)
          print(f"完成：{total} 鄉鎮；完整 7 天 {expected[0]} 至 {expected[-1]}")
          PY

      - name: Commit and push updated JSON
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cwa-F-D0047-093.json data/cwa-F-D0047-093-web.json
          if git diff --cached --quiet; then
            echo "資料沒有變化"
            exit 0
          fi
          git commit -m "Refresh CWA township 7-day forecast"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            if [ "$attempt" -eq 5 ]; then
              echo "::error::推送重試 5 次仍失敗"
              exit 1
            fi
            sleep $((attempt * 4))
          done
