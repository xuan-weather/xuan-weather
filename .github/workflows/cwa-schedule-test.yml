name: CWA Schedule Test

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check Scheduled trigger
        run: |
          echo "CWA Schedule Test"
          echo "UTC time:"
          date -u
          echo "Event:"
          echo "${{ github.event_name }}"
          echo "Run ID:"
          echo "${{ github.run_id }}"
