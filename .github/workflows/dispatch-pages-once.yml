name: One-time dispatch GitHub Pages deployment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-pages-once.yml'

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Pages deployment for latest main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/xuan-weather/xuan-weather/actions/workflows/pages-deploy.yml/dispatches \
            -d '{"ref":"main"}'
      - name: Remove one-time dispatcher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dispatch-pages-once.yml
          git commit -m "[regional-chart-bot] Remove one-time Pages dispatcher"
          git push origin HEAD:main
