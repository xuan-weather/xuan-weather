name: 更新停班停課公告資料

on:
  workflow_dispatch:
  schedule:
    # 每小時第 10 分鐘執行（台灣時間每小時第 10 分鐘）
    - cron: "10 * * * *"

permissions:
  contents: write

concurrency:
  group: update-typhoon-work-school
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4

      - name: Fetch official suspension announcement
        run: python scripts/fetch_typhoon_work_school.py

      - name: Commit updated JSON when changed
        run: |
          if [ -f data/typhoon-work-school.json ]; then
            git add data/typhoon-work-school.json
            if git diff --cached --quiet; then
              echo "公告資料沒有變更，不需要提交。"
            else
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "chore: update typhoon work school data"
              git push
            fi
          else
            echo "錯誤：找不到 data/typhoon-work-school.json"
            exit 1
          fi
