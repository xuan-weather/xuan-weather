name: 氣溫分布每小時紀錄

on:
  # 改由外部計時器每小時呼叫 GitHub repository_dispatch 觸發，避免依賴 Actions 排程。
  repository_dispatch:
    types: [hourly-temperature-map]
  # 保留手動執行按鈕，方便測試。
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temperature-map-history
  cancel-in-progress: false

jobs:
  capture-map:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Capture current Taiwan temperature distribution map
        env:
          SITE_URL: https://xuan-weather.github.io/xuan-weather/
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1920, height: 1200 }, deviceScaleFactor: 2 });
            page.setDefaultTimeout(45000);
            try {
              await page.goto(process.env.SITE_URL, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForTimeout(18000);
              const mapTab = page.locator('#tabMap');
              await mapTab.click();
              const map = page.locator('#map.leaflet-container');
              await map.waitFor({ state: 'visible', timeout: 45000 });

              // 地圖原本在隱藏分頁時可能已初始化；切換顯示後強制重新計算尺寸，
              // 避免 Leaflet 圖磚只鋪滿上半部、下半部露出黑色背景。
              await page.evaluate(() => {
                window.dispatchEvent(new Event('resize'));
                const el = document.querySelector('#map');
                if (el) {
                  el.style.background = '#0b1220';
                  el.getBoundingClientRect();
                }
              });
              await page.waitForTimeout(1200);

              const tempButton = page.locator('#mapModeBtnGroup button').filter({ hasText: '氣溫' }).first();
              if (await tempButton.count()) await tempButton.click();

              // 再觸發一次 resize，讓 Leaflet 在切換圖層後重新鋪設地圖圖磚。
              await page.evaluate(() => window.dispatchEvent(new Event('resize')));
              await page.waitForTimeout(5000);
              await page.locator('#map .leaflet-tile').first().waitFor({ state: 'visible', timeout: 30000 });

              // 記錄地圖實際尺寸，並確認容器不是零尺寸。
              const mapSize = await page.locator('#map').evaluate(el => {
                const r = el.getBoundingClientRect();
                return { width: Math.round(r.width), height: Math.round(r.height) };
              });
              if (mapSize.width < 300 || mapSize.height < 200) {
                throw new Error(`地圖容器尺寸異常：${mapSize.width}x${mapSize.height}`);
              }

              const markerCount = await page.locator('#map .leaflet-marker-icon').count();
              if (markerCount < 50) throw new Error(`溫度測站圓點數量不足（${markerCount}），為避免保存不完整圖片而中止。`);
              // 先讀取地圖觀測時間；若標籤可能以 UTC 顯示，嘗試校正 +8 小時。
              // 這可處理「實際是台灣時間 06:40，標籤卻顯示前一天 22:40」的情況，
              // 同時保留資料過舊時停止保存的保護，避免把舊地圖當成新紀錄。
              const readTimeLabel = async () =>
                (await page.locator('#mapObsTimeTag').innerText().catch(() => '')).trim();
              let timeLabel = await readTimeLabel();

              // 以台灣時間的「上一個整點」作為目標時段。
              const now = new Date();
              const taipeiOffset = 8 * 60 * 60 * 1000;
              const currentHour = Math.floor((now.getTime() + taipeiOffset) / 3600000) * 3600000 - taipeiOffset;
              const targetHour = new Date(currentHour - 3600000);
              const formatTaipei = date => new Intl.DateTimeFormat('en-CA', {
                timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
              }).formatToParts(date).reduce((a,p)=>(a[p.type]=p.value,a),{});
              const targetParts = formatTaipei(targetHour);
              const captureParts = formatTaipei(now);
              const stamp = `${targetParts.year}-${targetParts.month}-${targetParts.day}-${targetParts.hour}`;
              const isoLocal = `${captureParts.year}-${captureParts.month}-${captureParts.day}T${captureParts.hour}:${captureParts.minute}:00+08:00`;
              const targetIso = `${targetParts.year}-${targetParts.month}-${targetParts.day}T${targetParts.hour}:00:00+08:00`;

              const parseObservation = label => {
                const m = String(label || '').match(/(20\\d{2})[\\/.-](\\d{1,2})[\\/.-](\\d{1,2})\\s*(?:日)?\\s*(\\d{1,2}):(\\d{2})/);
                if (!m) return null;
                return new Date(Date.UTC(+m[1], +m[2]-1, +m[3], +m[4]-8, +m[5]));
              };
              let observation = parseObservation(timeLabel);
              if (!observation) {
                throw new Error(`無法辨識地圖觀測時間「${timeLabel || '空白'}」；停止保存，避免錯誤標記歷史紀錄。`);
              }

              let observationAge = now.getTime() - observation.getTime();
              // 如果標籤比現在舊超過 90 分鐘，嘗試把標籤當作 UTC 再轉台灣時間。
              // 只有校正後確實落在合理的最新觀測範圍內才採用。
              if (observationAge > 90 * 60 * 1000) {
                const utcLabelCandidate = new Date(observation.getTime() + taipeiOffset);
                const candidateAge = now.getTime() - utcLabelCandidate.getTime();
                if (candidateAge >= 0 && candidateAge <= 90 * 60 * 1000) {
                  observation = utcLabelCandidate;
                  observationAge = candidateAge;
                  console.log(`觀測時間標籤疑似以 UTC 顯示，已校正 +8 小時供檢查：${timeLabel}`);
                }
              }

              if (observationAge < 0 || observationAge > 90 * 60 * 1000) {
                throw new Error(`地圖觀測資料過舊或時間異常：「${timeLabel}」（延遲 ${Math.round(observationAge/60000)} 分鐘）；停止保存。請檢查網站地圖資料載入與時區格式。`);
              }
              if (observation.getTime() < targetHour.getTime() || observation.getTime() >= currentHour) {
                throw new Error(`地圖觀測時間 ${timeLabel} 不屬於目標上一整點時段 ${targetIso} 至下一整點；停止保存。`);
              }

              const imageDir = path.join(process.cwd(), 'temperature-map-history');
              fs.mkdirSync(imageDir, { recursive: true });
              const imageName = `${stamp}.jpg`;
              const imagePath = path.join(imageDir, imageName);
              // 相同目標小時已保存就不覆寫，避免重複觸發造成歷史紀錄變動。
              if (fs.existsSync(imagePath)) {
                console.log(`目標小時 ${stamp} 已有截圖，略過重複保存。`);
                return;
              }
              await page.locator('#map').screenshot({
                path: imagePath,
                type: 'jpeg',
                quality: 95,
                timeout: 45000,
                animations: 'disabled'
              });
              console.log(`地圖容器尺寸：${mapSize.width}x${mapSize.height}`);
              const manifestPath = path.join(process.cwd(), 'data', 'temperature-map-history.json');
              fs.mkdirSync(path.dirname(manifestPath), { recursive: true });
              let items = [];
              if (fs.existsSync(manifestPath)) {
                try { const old = JSON.parse(fs.readFileSync(manifestPath, 'utf8')); items = Array.isArray(old) ? old : (Array.isArray(old.items) ? old.items : []); } catch {}
              }
              items = items.filter(x => x && x.image !== `temperature-map-history/${imageName}`);
              items.unshift({ capturedAt: isoLocal, targetHour: targetIso, image: `temperature-map-history/${imageName}`, observationTime: timeLabel, stationCount: markerCount });
              // 保留最近 30 天的每小時截圖，避免 GitHub Pages 與儲存庫無限膨脹。
              const cutoff = now.getTime() - 30 * 24 * 60 * 60 * 1000;
              const keep = [];
              for (const item of items) {
                const ts = Date.parse(item.capturedAt || '');
                if (Number.isFinite(ts) && ts >= cutoff) keep.push(item);
                else if (item.image) {
                  const rel = String(item.image).replace(/^\/+/, '');
                  if (rel.startsWith('temperature-map-history/') && !rel.includes('..')) {
                    try { fs.rmSync(path.join(process.cwd(), rel), { force: true }); } catch {}
                  }
                }
              }
              keep.sort((a,b) => Date.parse(b.capturedAt || 0) - Date.parse(a.capturedAt || 0));
              fs.writeFileSync(manifestPath, JSON.stringify({ updatedAt: isoLocal, items: keep }, null, 2) + '\n');
              console.log(`已擷取 ${imageName}；測站圓點 ${markerCount}；觀測時間 ${timeLabel}`);
            } finally { await browser.close(); }
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Commit hourly image and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add temperature-map-history data/temperature-map-history.json
          if git diff --cached --quiet; then
            echo "No new temperature-map history changes to commit."
          else
            git commit -m "chore: save hourly Taiwan temperature map"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
