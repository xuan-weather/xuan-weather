name: CWA 10-Minute Temperature History

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: write

jobs:
  fetch-temperature-history:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # 取得 CWA O-A0003-001
      # 10 分鐘綜觀氣象資料
      # =========================================================
      - name: Fetch CWA O-A0003-001
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: |
          set -e

          mkdir -p data/history

          curl --silent --show-error --fail --retry 3 --retry-delay 2 \
            -H "Accept: application/json" \
            "https://opendata.cwa.gov.tw/api/v1/rest/datastore/O-A0003-001?Authorization=${CWA_API_KEY}&format=JSON" \
            -o /tmp/cwa-o-a0003-001.json

          # 七堵 C0B010 如果沒有出現在全測站回傳中，
          # 再用 stationId 明確補抓一次。
          curl --silent --show-error --fail --retry 3 --retry-delay 2 \
            -H "Accept: application/json" \
            "https://opendata.cwa.gov.tw/api/v1/rest/datastore/O-A0003-001?Authorization=${CWA_API_KEY}&format=JSON&stationId=C0B010" \
            -o /tmp/cwa-o-a0003-001-c0b010.json

      # =========================================================
      # 取得 O-A0001-001
      # 全測站逐時資料
      #
      # 這裡不是只抓 C0。
      # 改成抓全部測站，作為歷史資料的完整測站骨架。
      # =========================================================
      - name: Fetch CWA O-A0001-001 hourly fallback
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: |
          set -e

          curl --silent --show-error --fail --retry 3 --retry-delay 2 \
            -H "Accept: application/json" \
            "https://opendata.cwa.gov.tw/api/v1/rest/datastore/O-A0001-001?Authorization=${CWA_API_KEY}&format=JSON" \
            -o /tmp/cwa-o-a0001-001.json

      # =========================================================
      # 更新最近 30 小時歷史資料
      # =========================================================
      - name: Update rolling 30-hour history
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta, timezone

          # -----------------------------------------------------
          # 資料來源
          # -----------------------------------------------------
          source = "/tmp/cwa-o-a0003-001.json"
          explicit_source = "/tmp/cwa-o-a0003-001-c0b010.json"
          hourly_source = "/tmp/cwa-o-a0001-001.json"

          output = "data/history/cwa-o-a0003-001-history.json"

          # -----------------------------------------------------
          # 讀取測站資料
          # -----------------------------------------------------
          def extract_stations(payload):
              stations = (
                  payload.get("records", {}).get("Station")
                  or payload.get("result", {}).get("records", {}).get("Station")
                  or []
              )

              return stations if isinstance(stations, list) else []

          # -----------------------------------------------------
          # O-A0003-001
          # -----------------------------------------------------
          with open(source, "r", encoding="utf-8") as f:
              payload = json.load(f)

          stations = extract_stations(payload)

          if not stations:
              raise SystemExit(
                  "CWA O-A0003-001 找不到 records.Station"
              )

          # -----------------------------------------------------
          # C0B010 七堵補抓
          # -----------------------------------------------------
          with open(explicit_source, "r", encoding="utf-8") as f:
              explicit_payload = json.load(f)

          explicit_stations = extract_stations(explicit_payload)

          # -----------------------------------------------------
          # O-A0001-001 全測站逐時資料
          # -----------------------------------------------------
          with open(hourly_source, "r", encoding="utf-8") as f:
              hourly_payload = json.load(f)

          hourly_stations = extract_stations(hourly_payload)

          # -----------------------------------------------------
          # 載入既有歷史資料
          # -----------------------------------------------------
          history = {
              "generatedAt": None,
              "stations": {}
          }

          if os.path.exists(output):
              try:
                  with open(output, "r", encoding="utf-8") as f:
                      old = json.load(f)

                  if (
                      isinstance(old, dict)
                      and isinstance(old.get("stations"), dict)
                  ):
                      history = old

              except Exception:
                  pass

          # -----------------------------------------------------
          # 只保留最近 30 小時
          # -----------------------------------------------------
          cutoff_ms = int(
              (
                  datetime.now(timezone.utc)
                  - timedelta(hours=30)
              ).timestamp() * 1000
          )

          # -----------------------------------------------------
          # 加入單一測站資料
          # -----------------------------------------------------
          def append_station(station):
              if not isinstance(station, dict):
                  return

              station_id = str(
                  station.get("StationId") or ""
              ).strip()

              if not station_id:
                  return

              # -------------------------------------------------
              # 取得觀測時間
              # -------------------------------------------------
              obs = station.get("ObsTime")

              if isinstance(obs, dict):
                  obs = (
                      obs.get("DateTime")
                      or obs.get("dateTime")
                  )

              if not obs:
                  return

              try:
                  dt = datetime.fromisoformat(
                      str(obs).replace("Z", "+00:00")
                  )

                  if dt.tzinfo is None:
                      dt = dt.replace(
                          tzinfo=timezone.utc
                      )

                  ts_ms = int(
                      dt.timestamp() * 1000
                  )

              except Exception:
                  return

              # -------------------------------------------------
              # 取得氣溫
              # -------------------------------------------------
              weather = (
                  station.get("WeatherElement")
                  or {}
              )

              try:
                  temp = float(
                      weather.get(
                          "AirTemperature",
                          weather.get("TEMP")
                      )
                  )

              except (TypeError, ValueError):
                  return

              # -------------------------------------------------
              # 過濾明顯異常值
              # -------------------------------------------------
              if temp < -50 or temp > 60:
                  return

              # -------------------------------------------------
              # 寫入歷史資料
              # -------------------------------------------------
              history["stations"].setdefault(
                  station_id,
                  []
              ).append(
                  {
                      "ts": ts_ms,
                      "temp": round(temp, 1)
                  }
              )

          # =====================================================
          # 第一層：
          # O-A0001 全測站逐時資料
          #
          # 這一步非常重要。
          #
          # 先把所有有 O-A0001 資料的測站建立起來，
          # 避免 O-A0003 某一個 10 分鐘時段暫時缺資料時，
          # 該測站直接從歷史地圖消失。
          # =====================================================
          for station in hourly_stations:
              append_station(station)

          # =====================================================
          # 第二層：
          # O-A0003 全站 10 分鐘資料
          #
          # 同一時間的資料在後面清理時，
          # O-A0003 會覆蓋 O-A0001 的逐時 fallback。
          #
          # 因此：
          #
          # O-A0003 有資料
          # → 使用 10 分鐘資料
          #
          # O-A0003 沒資料
          # → 保留 O-A0001 整點資料
          # =====================================================
          for station in stations:
              append_station(station)

          # =====================================================
          # 第三層：
          # C0B010 七堵明確補抓
          # =====================================================
          for station in explicit_stations:

              if (
                  str(
                      station.get("StationId") or ""
                  ).strip()
                  == "C0B010"
              ):
                  append_station(station)

          # =====================================================
          # 清理：
          # 1. 移除 30 小時以前資料
          # 2. 相同 timestamp 只保留最後加入的資料
          #    → O-A0003 會覆蓋 O-A0001
          # 3. 重新排序
          # =====================================================
          for station_id, arr in list(
              history["stations"].items()
          ):

              unique = {}

              for point in arr:

                  try:
                      ts = int(point["ts"])
                      temp = float(point["temp"])

                  except (
                      KeyError,
                      TypeError,
                      ValueError
                  ):
                      continue

                  # 只保留最近 30 小時
                  if ts < cutoff_ms:
                      continue

                  # 過濾明顯異常溫度
                  if temp < -50 or temp > 60:
                      continue

                  # 相同 timestamp：
                  # 後加入的 O-A0003 覆蓋前面的 O-A0001
                  unique[ts] = {
                      "ts": ts,
                      "temp": round(temp, 1)
                  }

              # 依時間排序
              cleaned = [
                  unique[k]
                  for k in sorted(unique)
              ]

              if cleaned:
                  history["stations"][station_id] = cleaned
              else:
                  del history["stations"][station_id]

          # =====================================================
          # 更新產生時間
          # =====================================================
          history["generatedAt"] = (
              datetime.now(timezone.utc).isoformat()
          )

          # =====================================================
          # 寫回 JSON
          # =====================================================
          with open(
              output,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  history,
                  f,
                  ensure_ascii=False,
                  separators=(",", ":")
              )

          # =====================================================
          # GitHub Actions 診斷資訊
          # =====================================================
          print(
              "CWA 歷史資料測站數：",
              len(history["stations"])
          )

          print(
              "O-A0003 全站回傳數：",
              len(stations)
          )

          print(
              "O-A0001 全站回傳數：",
              len(hourly_stations)
          )

          print(
              "C0B010 七堵歷史筆數：",
              len(
                  history["stations"].get(
                      "C0B010",
                      []
                  )
              )
          )

      # =========================================================
      # 提交歷史 JSON
      # =========================================================
      - name: Commit history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/history/cwa-o-a0003-001-history.json

          if git diff --cached --quiet; then
            echo "歷史資料沒有變化，不需要提交"
          else
            git commit -m "Update CWA 10-minute temperature history"
            git push
          fi
