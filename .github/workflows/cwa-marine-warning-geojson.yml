name: CWA Marine Typhoon Warning Geometry

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: cwa-marine-warning-geojson
  cancel-in-progress: true

jobs:
  update-warning-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download and parse official CWA KMZ
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: python scripts/fetch_cwa_marine_warning.py

      - name: Commit GeoJSON when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cwa-marine-warning.geojson
          if git diff --cached --quiet; then
            echo "官方警戒 GeoJSON 沒有變更，不需提交。"
          else
            git commit -m "Update official CWA marine warning geometry"
            git push
          fi
