name: Update GoatCounter visitor statistics

on:
  schedule:
    # 每小時更新一次；GitHub Actions 排程以 UTC 執行
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: goatcounter-visitor-stats
  cancel-in-progress: false

jobs:
  update-visitor-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch GoatCounter statistics
        env:
          GOATCOUNTER_API_TOKEN: ${{ secrets.GOATCOUNTER_API_TOKEN }}
        run: python scripts/update_goatcounter_stats.py

      - name: Commit updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/visitor-stats.json
          if git diff --cached --quiet; then
            echo "Visitor statistics unchanged; no commit needed."
          else
            git commit -m "Update GoatCounter visitor statistics"
            git push
          fi
