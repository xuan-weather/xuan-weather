name: Fetch NOAA Typhoon Tracks

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-noaa-typhoon-tracks
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch NOAA tracks
        run: python fetch_noaa_typhoon_tracks.py

      - name: Commit updated track data
        run: |
          if git diff --quiet -- data/typhoon-model-tracks.json; then
            echo "No track data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/typhoon-model-tracks.json
          git commit -m "Update NOAA typhoon tracks"
          git push
