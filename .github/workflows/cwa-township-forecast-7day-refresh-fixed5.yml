name: CWA Township 7-Day Forecast Refresh

on:
  schedule:
    # 台灣時間 05:40、11:40、17:40、23:40
    - cron: "40 21,3,9,15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cwa-township-7day-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and validate official 7-day forecast
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CWA_API_KEY:-}" || { echo "::error::缺少 CWA_API_KEY Secret"; exit 1; }
          mkdir -p data
          tmp="$(mktemp)"
          # 先嘗試 REST API；若回傳 404，改走氣象署官方 fileapi 下載端點。
          # 官方說明列出兩種端點：https://opendata.cwa.gov.tw/devManual/description
          tmp="$(mktemp)"
          success=0
          for endpoint in \
            "https://opendata.cwa.gov.tw/api/v1/rest/datastore/F-D0047-093" \
            "https://opendata.cwa.gov.tw/fileapi/v1/opendataapi/F-D0047-093"; do
            echo "嘗試官方資料端點：${endpoint}"
            http_code="$(curl --silent --show-error --location --get \
              --retry 2 --retry-all-errors --retry-delay 3 \
              --connect-timeout 30 --max-time 180 \
              --data-urlencode "Authorization=${CWA_API_KEY}" \
              --data-urlencode "format=JSON" \
              -H "Cache-Control: no-cache, no-store, max-age=0" \
              -H "Pragma: no-cache" \
              -o "$tmp" -w '%{http_code}' "$endpoint" || true)"
            echo "HTTP 狀態碼：${http_code:-curl_failed}"
            if [[ "$http_code" =~ ^2[0-9][0-9]$ ]] && python - "$tmp" <<'PYVALID'
          import json,sys
          from pathlib import Path
          try:
              d=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
              groups=d.get('records',{}).get('Locations',[])
              if isinstance(groups,dict): groups=[groups]
              count=0
              for g in groups:
                  rows=g.get('Location',[]) if isinstance(g,dict) else []
                  count += len(rows) if isinstance(rows,list) else (1 if isinstance(rows,dict) else 0)
              if isinstance(d,dict) and groups and count >= 300:
                  print(f'官方 JSON 驗證通過：{len(groups)} 組、{count} 個地點')
                  raise SystemExit(0)
              print(f'此端點回應不是完整全臺鄉鎮資料（地點數={count}），改試下一個端點')
          except Exception as e:
              print(f'此端點不是可用的官方 JSON：{e}；改試下一個端點')
          raise SystemExit(1)
          PYVALID
            then
              success=1
              break
            else
              echo "端點未通過驗證，繼續嘗試下一個官方端點。"
              head -c 700 "$tmp" 2>/dev/null || true
              echo
            fi
          done
          if [[ "$success" -ne 1 ]]; then
            echo "::error::REST API 與 fileapi 都無法取得完整 F-D0047-093。請確認 CWA_API_KEY Secret，以及氣象署資料集是否仍可用。"
            exit 1
          fi
          mv "$tmp" data/cwa-F-D0047-093.json

      - name: Rebuild web forecast JSON
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime,timedelta,timezone
          src=Path("data/cwa-F-D0047-093.json")
          dst=Path("data/cwa-F-D0047-093-web.json")
          tz=timezone(timedelta(hours=8)); today=datetime.now(tz).date()
          raw=json.loads(src.read_text(encoding="utf-8"))
          groups=raw.get("records",{}).get("Locations",[])
          if isinstance(groups,dict): groups=[groups]
          def element_map(loc,names):
              for e in loc.get("WeatherElement",[]) or []:
                  if e.get("ElementName") in names:
                      out={}
                      for t in e.get("Time",[]) or []:
                          k=t.get("StartTime") or t.get("DataTime"); v=t.get("ElementValue") or []
                          if k: out[k]=v[0] if v and isinstance(v[0],dict) else {}
                      return out
              return {}
          def getval(mapping,key,keys):
              for k in keys:
                  v=mapping.get(key,{}).get(k)
                  if v not in (None,"","-","NA","N/A"):
                      try: return float(v) if "." in str(v) else int(v)
                      except (ValueError,TypeError): return v
              return None
          def nearest(mapping,start,keys):
              if not mapping: return None
              target=datetime.fromisoformat(start.replace("Z","+00:00"))
              k=min(mapping,key=lambda x:abs((datetime.fromisoformat(x.replace("Z","+00:00"))-target).total_seconds()))
              return getval(mapping,k,keys)
          counties={}; dates=set(); total=0
          for group in groups:
              if not isinstance(group,dict): continue
              county=group.get("LocationsName") or group.get("LocationName")
              locs=group.get("Location",[]) or []
              if isinstance(locs,dict): locs=[locs]
              if not county: continue
              out={}
              for loc in locs:
                  if not isinstance(loc,dict) or not loc.get("LocationName"): continue
                  els=loc.get("WeatherElement",[]) or []
                  wx=element_map(loc,["天氣現象"]); lows=element_map(loc,["最低溫度"]); highs=element_map(loc,["最高溫度"]); pops=element_map(loc,["12小時降雨機率","降雨機率"])
                  periods=next((e.get("Time",[]) for e in els if e.get("ElementName")=="天氣現象"),[])
                  if not periods: periods=next((e.get("Time",[]) for e in els if e.get("ElementName")=="最低溫度"),[])
                  days=[]
                  for p in periods or []:
                      start=p.get("StartTime") or p.get("DataTime")
                      if not start: continue
                      try: dt=datetime.fromisoformat(start.replace("Z","+00:00")).astimezone(tz)
                      except ValueError: continue
                      day=dt.date()
                      if day<today or day>=today+timedelta(days=7): continue
                      w=wx.get(start,{})
                      low=getval(lows,start,["MinTemperature","Temperature"]); high=getval(highs,start,["MaxTemperature","Temperature"]); pop=getval(pops,start,["ProbabilityOfPrecipitation"])
                      if low is None: low=nearest(lows,start,["MinTemperature","Temperature"])
                      if high is None: high=nearest(highs,start,["MaxTemperature","Temperature"])
                      if pop is None: pop=nearest(pops,start,["ProbabilityOfPrecipitation"])
                      desc=w.get("Weather") or w.get("天氣現象") or ""; code=w.get("WeatherCode") or w.get("WeatherCodeValue") or ""
                      if not desc and low is None and high is None: continue
                      days.append({"date":day.isoformat(),"period":"night" if dt.hour>=18 else "day","start":start,"end":p.get("EndTime",""),"min":low,"max":high,"pop":pop,"wx":desc,"wxCode":str(code)})
                      dates.add(day.isoformat())
                  days.sort(key=lambda x:(x["date"],x["start"]))
                  if days: out[loc["LocationName"]]={"geocode":str(loc.get("Geocode","")),"lat":str(loc.get("Latitude","")),"lon":str(loc.get("Longitude","")),"days":days}
              if out: counties[county]=out; total+=len(out)
          ds=sorted(dates)
          if total<300 or len(ds)<7:
              raise SystemExit(f"整合驗證失敗：鄉鎮 {total}、有效預報日期 {len(ds)}（{ds[0] if ds else '無'}～{ds[-1] if ds else '無'}）；不覆蓋舊 web JSON")
          # 確保資料是連續 7 天，而不是把只有 4～6 天的舊資料當成成功發布。
          expected=[(today+timedelta(days=i)).isoformat() for i in range(7)]
          present=set(ds)
          missing=[d for d in expected if d not in present]
          if missing:
              raise SystemExit(f"整合驗證失敗：缺少日期 {','.join(missing)}；不覆蓋舊 web JSON")
          result={"success":True,"source":"CWA F-D0047-093 官方全臺鄉鎮一週預報","generatedAt":datetime.now(timezone.utc).isoformat(timespec="milliseconds").replace("+00:00","Z"),"startDate":expected[0],"days":7,"counties":counties}
          tmp=dst.with_suffix(".json.tmp"); tmp.write_text(json.dumps(result,ensure_ascii=False,separators=(",",":")),encoding="utf-8"); tmp.replace(dst)
          print(f"完成：{total} 鄉鎮；完整 7 天 {expected[0]} 至 {expected[-1]}")
          PY

      - name: Commit and push updated JSON
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cwa-F-D0047-093.json data/cwa-F-D0047-093-web.json
          if git diff --cached --quiet; then echo "資料沒有變化"; exit 0; fi
          git commit -m "Refresh CWA township 7-day forecast"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            if [ "$attempt" -eq 5 ]; then echo "::error::推送重試 5 次仍失敗"; exit 1; fi
            sleep $((attempt * 4))
          done
