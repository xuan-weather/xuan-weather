name: Update typhoon model tracks

on:
  workflow_dispatch:
  schedule:
    # ECMWF runs are generally issued four times daily; run every 6 hours.
    - cron: "23 */6 * * *"

permissions:
  contents: write

concurrency:
  group: typhoon-model-tracks
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ECMWF BUFR decoder and downloader
        run: |
          python -m pip install --upgrade pip
          python -m pip install ecmwf-opendata eccodes

      - name: Fetch and normalize official ECMWF / AIFS tracks
        run: python scripts/update_typhoon_tracks.py

      - name: Commit updated track JSON
        run: |
          if git diff --quiet -- data/typhoon-model-tracks.json; then
            echo "No data change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/typhoon-model-tracks.json
          git commit -m "Update official typhoon model tracks"
          git push
