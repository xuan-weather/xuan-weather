name: One-time GitHub Pages deployment unlock

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  actions: write

jobs:
  unlock-and-redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel the stuck GitHub Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: "10d6071ed60da1758774694e52cf79df15f82646"
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          echo "Attempting to cancel Pages deployment: $DEPLOYMENT_ID"
          status="$(curl -sS -o "$response_file" -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/pages/deployments/$DEPLOYMENT_ID/cancel")"

          echo "Cancel API HTTP status: $status"
          if [ -s "$response_file" ]; then
            cat "$response_file"
            echo
          fi

          if [ "$status" != "204" ]; then
            echo "::error::GitHub did not confirm cancellation (expected HTTP 204). No redeployment was started."
            exit 1
          fi

          echo "Pages deployment cancellation confirmed."

      - name: Trigger a fresh GitHub Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          status="$(curl -sS -o "$response_file" -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/pages-deploy.yml/dispatches" \
            -d '{"ref":"main"}')"

          echo "Redeployment dispatch HTTP status: $status"
          if [ -s "$response_file" ]; then
            cat "$response_file"
            echo
          fi

          if [ "$status" != "204" ]; then
            echo "::error::The stuck deployment was cancelled, but GitHub did not accept the new Pages workflow dispatch."
            exit 1
          fi

          echo "A fresh Pages deployment has been queued."
