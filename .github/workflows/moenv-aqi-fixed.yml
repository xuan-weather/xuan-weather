name: MOENV AQI Data

on:
  schedule:
    # 環境部通常在每小時過後幾分鐘才發布上一整點資料
    - cron: '15 * * * *'
      timezone: 'Asia/Taipei'
  workflow_dispatch:

permissions:
  contents: write

# 避免同一個工作流程同時執行並互相覆蓋推送
concurrency:
  group: moenv-aqi-data
  cancel-in-progress: false

jobs:
  fetch-aqi-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch MOENV AQX_P_432
        env:
          MOENV_API_KEY: ${{ secrets.MOENV_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p data

          if [ -z "${MOENV_API_KEY:-}" ]; then
            echo "錯誤：尚未設定 MOENV_API_KEY secret"
            exit 1
          fi

          echo "開始讀取 MOENV AQX_P_432..."

          curl \\
            --silent \\
            --show-error \\
            --fail \\
            --retry 3 \\
            --retry-delay 5 \\
            -H "Authorization: Bearer ${MOENV_API_KEY}" \\
            "https://data.moenv.gov.tw/api/v2/aqx_p_432?api_key=${MOENV_API_KEY}&limit=1000&sort=publishtime%20desc" \\
            -o data/aqx-p-432.json

          echo "AQI 資料下載完成"

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/aqx-p-432.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          # MOENV API 可能直接回傳陣列，也可能回傳 {"records": [...]}。
          if isinstance(data, list):
              records = data
          elif isinstance(data, dict):
              records = data.get("records", [])
          else:
              records = []

          if not isinstance(records, list) or not records:
              raise SystemExit("AQI 回傳沒有 records 或格式不正確")

          records = [record for record in records if isinstance(record, dict)]
          if not records:
              raise SystemExit("AQI records 格式錯誤")

          times = sorted(
              str(record.get("publishtime", "")).strip()
              for record in records
              if record.get("publishtime")
          )

          print("AQI records:", len(records))
          print("最新 publishtime:", times[-1] if times else "未知")
          PY

      - name: Commit and push AQI data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 只提交 AQI 資料檔，避免意外提交其他檔案。
          git add data/aqx-p-432.json
          if git diff --cached --quiet; then
            echo "AQI 資料沒有變更，略過推送。"
            exit 0
          fi

          git commit -m "Update MOENV AQI data"

          # 先整合遠端最新提交，再推送；不使用 force push。
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
