name: CWA Rainfall Data

on:
  workflow_dispatch:
  schedule:
    # CWA O-A0002-001 約每 10 分鐘更新；GitHub 排程可能延遲。
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: cwa-rainfall-data
  cancel-in-progress: true

jobs:
  fetch-rainfall:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch official CWA rainfall observations
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: python scripts/fetch_cwa_rainfall.py
      - name: Commit updated public data file
        run: |
          if git diff --quiet -- data/rainfall-latest.json; then
            echo "No rainfall data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rainfall-latest.json
          git commit -m "chore: update CWA rainfall observations"
          git push
