name: CWA Weather Data

on:
  workflow_dispatch:
  schedule:
    # 每 5 分鐘自動更新 CWA 即時資料
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: cwa-weather-data
  cancel-in-progress: false

jobs:
  fetch-cwa-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all CWA datasets
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: |
          set -euo pipefail

          mkdir -p data
          mkdir -p data/history

          datasets=(
            O-A0001-001
            O-A0002-001
            O-A0003-001
            F-C0032-001
            W-C0033-001
            W-C0033-002
            W-C0033-005
            W-C0034-001
            W-C0034-005
            E-A0015-001
            E-A0016-001
          )

          for dataset in "${datasets[@]}"; do
            echo "========================================"
            echo "正在取得 CWA：${dataset}"
            echo "========================================"

            cache_buster="$(date +%s%N)"
            url="https://opendata.cwa.gov.tw/api/v1/rest/datastore/${dataset}?_=${cache_buster}"

            curl --fail-with-body \
              --silent \
              --show-error \
              --retry 3 \
              --retry-delay 2 \
              --location \
              -H "Accept: application/json" \
              -H "Authorization: ${CWA_API_KEY}" \
              -H "Cache-Control: no-cache, no-store, max-age=0" \
              -H "Pragma: no-cache" \
              "${url}" \
              -o "data/cwa-${dataset}.json"

            echo "CWA ${dataset} 資料取得成功"
            wc -c "data/cwa-${dataset}.json"

            python - "${dataset}" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone, timedelta

          dataset = sys.argv[1]
          path = f"data/cwa-{dataset}.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          print(f"{dataset}：JSON 格式正常")

          if not isinstance(data, dict):
              raise SystemExit(f"{dataset}：錯誤，回傳資料不是 JSON 物件")

          if dataset == "W-C0033-005":
              print(f"{dataset}：CAP 高溫資訊 JSON 保留原始結構")

              time_keys = {
                  "sent", "Sent",
                  "issueTime", "IssueTime",
                  "publishTime", "PublishTime",
                  "publishedAt", "PublishedAt",
                  "publishDate", "PublishDate",
                  "published", "Published",
                  "updateTime", "UpdateTime",
                  "updatedAt", "UpdatedAt",
                  "modifiedAt", "ModifiedAt",
              }

              latest = None
              seen = set()

              def walk(node):
                  global latest

                  if not isinstance(node, (dict, list)):
                      return

                  ident = id(node)

                  if ident in seen:
                      return

                  seen.add(ident)

                  if isinstance(node, list):
                      for item in node:
                          walk(item)
                      return

                  for key, value in node.items():
                      if key in time_keys:
                          if isinstance(value, dict):
                              raw = (
                                  value.get("value")
                                  or value.get("datetime")
                                  or value.get("DateTime")
                                  or value.get("time")
                                  or ""
                              )
                          else:
                              raw = value

                          if raw:
                              text = str(raw).replace("Z", "+00:00")

                              try:
                                  dt = datetime.fromisoformat(text)

                                  if dt.tzinfo is None:
                                      dt = dt.replace(
                                          tzinfo=timezone.utc
                                      )

                                  if latest is None or dt > latest:
                                      latest = dt

                              except Exception:
                                  pass

                      if isinstance(value, (dict, list)):
                          walk(value)

              walk(data)

              if latest:
                  taipei = latest.astimezone(
                      timezone(timedelta(hours=8))
                  )

                  print(
                      f"{dataset}：本次抓到的最新官方發布／更新時間 = "
                      f"{taipei.isoformat()}"
                  )
              else:
                  print(
                      f"{dataset}：找不到可解析的官方發布／更新時間"
                  )

          else:
              if "records" not in data:
                  raise SystemExit(
                      f"{dataset}：錯誤，找不到 records"
                  )

              print(f"{dataset}：records 存在")

              latest_time = None

              records = data.get("records", {})
              stations = records.get("Station", [])

              if isinstance(stations, list):
                  for station in stations:
                      obs = station.get("ObsTime", {})

                      dt = (
                          obs.get("DateTime")
                          if isinstance(obs, dict)
                          else None
                      )

                      if dt:
                          try:
                              parsed = datetime.fromisoformat(
                                  dt.replace("Z", "+00:00")
                              )

                              if (
                                  latest_time is None
                                  or parsed > latest_time
                              ):
                                  latest_time = parsed

                          except Exception:
                              pass

              if latest_time:
                  print(
                      f"{dataset}：本次抓到的最新 ObsTime = "
                      f"{latest_time.isoformat()}"
                  )
              else:
                  print(
                      f"{dataset}：找不到可解析的 ObsTime"
                  )
          PY

          done

      - name: Fetch explicit C0B010 station
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: |
          set -euo pipefail

          curl --silent --show-error --fail --retry 3 --retry-delay 2 \
            -H "Accept: application/json" \
            -H "Authorization: ${CWA_API_KEY}" \
            -H "Cache-Control: no-cache, no-store, max-age=0" \
            -H "Pragma: no-cache" \
            "https://opendata.cwa.gov.tw/api/v1/rest/datastore/O-A0003-001?Authorization=${CWA_API_KEY}&format=JSON&stationId=C0B010" \
            -o /tmp/cwa-o-a0003-001-c0b010.json

          echo "C0B010 七堵資料取得成功"

      - name: Merge C0B010 into O-A0003-001
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          main_path = Path("data/cwa-O-A0003-001.json")
          explicit_path = Path("/tmp/cwa-o-a0003-001-c0b010.json")

          main = json.loads(
              main_path.read_text(encoding="utf-8")
          )

          explicit = json.loads(
              explicit_path.read_text(encoding="utf-8")
          )

          def stations(payload):
              return (
                  payload.get("records", {}).get("Station")
                  or payload.get("result", {})
                  .get("records", {})
                  .get("Station")
                  or []
              )

          merged = stations(main)
          explicit_stations = stations(explicit)

          by_id = {
              str(x.get("StationId")): x
              for x in merged
              if x.get("StationId")
          }

          for station in explicit_stations:
              station_id = str(
                  station.get("StationId") or ""
              )

              if station_id == "C0B010":
                  by_id[station_id] = station

          merged = list(by_id.values())

          if main.get("records") is not None:
              main.setdefault("records", {})["Station"] = merged

          elif main.get("result", {}).get("records") is not None:
              main["result"]["records"]["Station"] = merged

          main_path.write_text(
              json.dumps(
                  main,
                  ensure_ascii=False,
                  separators=(",", ":")
              ),
              encoding="utf-8"
          )

          print(
              "Published O-A0003-001 stations:",
              len(merged)
          )
          PY

      - name: Verify high-temperature CAP is not an old cached version
        run: |
          set -euo pipefail

          python <<'PY'
          import json
          from datetime import datetime, timezone, timedelta

          path = "data/cwa-W-C0033-005.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          keys = {
              "sent", "Sent",
              "issueTime", "IssueTime",
              "publishTime", "PublishTime",
              "publishedAt", "PublishedAt",
              "publishDate", "PublishDate",
              "published", "Published",
              "updateTime", "UpdateTime",
              "updatedAt", "UpdatedAt",
              "modifiedAt", "ModifiedAt",
          }

          latest = None
          seen = set()

          def walk(node):
              global latest

              if not isinstance(node, (dict, list)):
                  return

              ident = id(node)

              if ident in seen:
                  return

              seen.add(ident)

              if isinstance(node, list):
                  for item in node:
                      walk(item)

                  return

              for key, value in node.items():

                  if key in keys:
                      raw = value

                      if isinstance(value, dict):
                          raw = (
                              value.get("value")
                              or value.get("datetime")
                              or value.get("DateTime")
                              or value.get("time")
                              or ""
                          )

                      if raw:
                          try:
                              dt = datetime.fromisoformat(
                                  str(raw).replace(
                                      "Z",
                                      "+00:00"
                                  )
                              )

                              if dt.tzinfo is None:
                                  dt = dt.replace(
                                      tzinfo=timezone.utc
                                  )

                              if latest is None or dt > latest:
                                  latest = dt

                          except Exception:
                              pass

                  if isinstance(value, (dict, list)):
                      walk(value)

          walk(data)

          if latest:
              taipei = latest.astimezone(
                  timezone(timedelta(hours=8))
              )

              print(
                  f"W-C0033-005 最後發布／更新："
                  f"{taipei.isoformat()}"
              )

              now = datetime.now(
                  timezone(timedelta(hours=8))
              )

              today_0730 = now.replace(
                  hour=7,
                  minute=30,
                  second=0,
                  microsecond=0
              )

              if (
                  now >= today_0730
                  and taipei.date() < now.date()
              ):
                  raise SystemExit(
                      "W-C0033-005 仍是前一天版本，"
                      "停止提交，避免網站繼續發布舊高溫資訊。"
                  )

          else:
              print(
                  "W-C0033-005 無法解析發布時間，"
                  "保留原資料流程。"
              )
          PY

      - name: Update rolling 7-day history
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta, timezone

          source = "data/cwa-O-A0003-001.json"
          explicit_source = "/tmp/cwa-o-a0003-001-c0b010.json"
          hourly_source = "data/cwa-O-A0001-001.json"
          rainfall_source = "data/cwa-O-A0002-001.json"
          output = "data/history/cwa-o-a0003-001-history.json"

          def extract_stations(payload):
              stations = (
                  payload.get("records", {}).get("Station")
                  or payload.get("result", {})
                  .get("records", {})
                  .get("Station")
                  or []
              )

              return (
                  stations
                  if isinstance(stations, list)
                  else []
              )

          with open(source, "r", encoding="utf-8") as f:
              payload = json.load(f)

          stations = extract_stations(payload)

          if not stations:
              raise SystemExit(
                  "CWA O-A0003-001 找不到 records.Station"
              )

          with open(
              explicit_source,
              "r",
              encoding="utf-8"
          ) as f:
              explicit_payload = json.load(f)

          explicit_stations = extract_stations(
              explicit_payload
          )

          with open(
              hourly_source,
              "r",
              encoding="utf-8"
          ) as f:
              hourly_payload = json.load(f)

          hourly_stations = extract_stations(
              hourly_payload
          )

          with open(
              rainfall_source,
              "r",
              encoding="utf-8"
          ) as f:
              rainfall_payload = json.load(f)

          rainfall_stations = extract_stations(
              rainfall_payload
          )

          if not rainfall_stations:
              raise SystemExit(
                  "CWA O-A0002-001 找不到 records.Station"
              )

          history = {
              "generatedAt": None,
              "stations": {}
          }

          if os.path.exists(output):
              try:
                  with open(
                      output,
                      "r",
                      encoding="utf-8"
                  ) as f:
                      old = json.load(f)

                  if (
                      isinstance(old, dict)
                      and isinstance(
                          old.get("stations"),
                          dict
                      )
                  ):
                      history = old

              except Exception:
                  pass

          cutoff_ms = int(
              (
                  datetime.now(timezone.utc)
                  - timedelta(days=7)
              ).timestamp() * 1000
          )

          def parse_ts(station):
              obs = station.get("ObsTime")

              if isinstance(obs, dict):
                  obs = (
                      obs.get("DateTime")
                      or obs.get("dateTime")
                  )

              if not obs:
                  return None

              try:
                  dt = datetime.fromisoformat(
                      str(obs).replace(
                          "Z",
                          "+00:00"
                      )
                  )

                  if dt.tzinfo is None:
                      dt = dt.replace(
                          tzinfo=timezone.utc
                      )

                  return int(
                      dt.timestamp() * 1000
                  )

              except Exception:
                  return None

          def append_station(
              station,
              only_c0=False,
              hourly_source=False
          ):
              if not isinstance(station, dict):
                  return

              station_id = str(
                  station.get("StationId") or ""
              ).strip()

              if (
                  not station_id
                  or (
                      only_c0
                      and not station_id.startswith("C0")
                  )
              ):
                  return

              ts_ms = parse_ts(station)

              if ts_ms is None:
                  return

              weather = (
                  station.get("WeatherElement")
                  or {}
              )

              temp = None

              try:
                  raw_temp = weather.get(
                      "AirTemperature",
                      weather.get("TEMP")
                  )

                  if raw_temp not in (
                      None,
                      "",
                      "X",
                      "T"
                  ):
                      temp = float(raw_temp)

              except (TypeError, ValueError):
                  temp = None

              if (
                  temp is not None
                  and (
                      temp == 0
                      or temp < -50
                      or temp > 60
                  )
              ):
                  temp = None

              hourly_wind = None

              raw_hourly_wind = weather.get(
                  "WindSpeed",
                  weather.get("WDSD")
              )

              if raw_hourly_wind not in (
                  None,
                  "",
                  "X",
                  "T"
              ):
                  try:
                      hourly_wind = float(
                          raw_hourly_wind
                      )

                  except (TypeError, ValueError):
                      hourly_wind = None

              max10min_wind = None

              max10 = (
                  weather.get("Max10MinAverage")
                  or {}
              )

              if isinstance(max10, dict):
                  raw_wind = max10.get(
                      "WindSpeed"
                  )

                  if raw_wind not in (
                      None,
                      "",
                      "X",
                      "T"
                  ):
                      try:
                          max10min_wind = float(
                              raw_wind
                          )

                      except (
                          TypeError,
                          ValueError
                      ):
                          max10min_wind = None

              gust = None

              gust_info = (
                  weather.get("GustInfo")
                  or {}
              )

              if isinstance(gust_info, dict):
                  raw_gust = gust_info.get(
                      "PeakGustSpeed"
                  )

                  if raw_gust not in (
                      None,
                      "",
                      "X",
                      "T"
                  ):
                      try:
                          gust = float(
                              raw_gust
                          )

                      except (
                          TypeError,
                          ValueError
                      ):
                          gust = None

              if (
                  hourly_wind is not None
                  and not 0 <= hourly_wind <= 60
              ):
                  hourly_wind = None

              if (
                  max10min_wind is not None
                  and not 0 <= max10min_wind <= 60
              ):
                  max10min_wind = None

              if (
                  gust is not None
                  and not 0 <= gust <= 80
              ):
                  gust = None

              if (
                  temp is None
                  and hourly_wind is None
                  and max10min_wind is None
                  and gust is None
              ):
                  return

              point = {
                  "ts": ts_ms
              }

              station_name = str(
                  station.get("StationName") or ""
              ).strip()

              if station_name:
                  point["stationName"] = station_name

              if temp is not None:
                  point["temp"] = round(
                      temp,
                      1
                  )

              if (
                  hourly_wind is not None
                  and hourly_source
              ):
                  point["hourlyWind"] = round(
                      hourly_wind,
                      1
                  )

              if max10min_wind is not None:
                  point["max10MinWind"] = round(
                      max10min_wind,
                      1
                  )

              if gust is not None:
                  if hourly_source:
                      point["hourlyGust"] = round(
                          gust,
                          1
                      )
                  else:
                      point["windGust"] = round(
                          gust,
                          1
                      )

              history["stations"].setdefault(
                  station_id,
                  []
              ).append(point)

          def append_rainfall_station(station):
              if not isinstance(station, dict):
                  return

              station_id = str(
                  station.get("StationId") or ""
              ).strip()

              if not station_id:
                  return

              ts_ms = parse_ts(station)

              if ts_ms is None:
                  return

              rainfall = (
                  station.get("RainfallElement")
                  or {}
              )

              past24 = (
                  rainfall.get("Past24hr")
                  or rainfall.get("Past24HR")
                  or rainfall.get("Past24Hour")
                  or {}
              )

              raw = (
                  past24.get("Precipitation")
                  if isinstance(past24, dict)
                  else None
              )

              if raw in (
                  None,
                  "",
                  "X",
                  "T"
              ):
                  return

              try:
                  rain24h = float(raw)

              except (TypeError, ValueError):
                  return

              if rain24h < 0:
                  return

              history["stations"].setdefault(
                  station_id,
                  []
              ).append({
                  "ts": ts_ms,
                  "rain24h": round(
                      rain24h,
                      1
                  )
              })

          for station in hourly_stations:
              append_station(
                  station,
                  hourly_source=True
              )

          def norm_key(value):
              return (
                  str(value or "")
                  .replace("台", "臺")
                  .replace(" ", "")
                  .replace("　", "")
                  .strip()
              )

          hourly_by_name = {}
          hourly_by_area = {}

          for station in hourly_stations:
              name = norm_key(
                  station.get("StationName")
              )

              ts_ms = parse_ts(station)

              weather = (
                  station.get("WeatherElement")
                  or {}
              )

              gust_info = (
                  weather.get("GustInfo")
                  or {}
              )

              raw_gust = gust_info.get(
                  "PeakGustSpeed"
              )

              try:
                  gust = float(raw_gust)

              except (
                  TypeError,
                  ValueError
              ):
                  gust = None

              raw_wind = weather.get(
                  "WindSpeed",
                  weather.get("WDSD")
              )

              try:
                  hourly_wind = float(
                      raw_wind
                  )

              except (
                  TypeError,
                  ValueError
              ):
                  hourly_wind = None

              if (
                  ts_ms is None
                  or (
                      gust is None
                      and hourly_wind is None
                  )
              ):
                  continue

              if (
                  gust is not None
                  and not 0 <= gust <= 80
              ):
                  gust = None

              if (
                  hourly_wind is not None
                  and not 0 <= hourly_wind <= 60
              ):
                  hourly_wind = None

              if (
                  gust is None
                  and hourly_wind is None
              ):
                  continue

              item = {
                  "ts": ts_ms,
                  "gust": (
                      round(gust, 1)
                      if gust is not None
                      else None
                  ),
                  "wind": (
                      round(hourly_wind, 1)
                      if hourly_wind is not None
                      else None
                  ),
                  "stationName": str(
                      station.get(
                          "StationName"
                      ) or ""
                  ).strip()
              }

              if name:
                  hourly_by_name[name] = item

              geo = (
                  station.get("GeoInfo")
                  or {}
              )

              area_key = (
                  norm_key(
                      geo.get("CountyName")
                  )
                  + "|"
                  + norm_key(
                      geo.get("TownName")
                  )
              )

              if area_key != "|":
                  hourly_by_area[area_key] = item

          for station in stations:
              station_id = str(
                  station.get("StationId") or ""
              ).strip()

              if not station_id:
                  continue

              name = norm_key(
                  station.get("StationName")
              )

              geo = (
                  station.get("GeoInfo")
                  or {}
              )

              area_key = (
                  norm_key(
                      geo.get("CountyName")
                  )
                  + "|"
                  + norm_key(
                      geo.get("TownName")
                  )
              )

              hourly = (
                  hourly_by_name.get(name)
                  or hourly_by_area.get(area_key)
              )

              if not hourly:
                  continue

              mapped_point = {
                  "ts": hourly["ts"],
                  "stationName": str(
                      station.get(
                          "StationName"
                      )
                      or hourly.get(
                          "stationName"
                      )
                      or ""
                  ).strip()
              }

              if hourly.get("wind") is not None:
                  mapped_point["hourlyWind"] = (
                      hourly["wind"]
                  )

              if hourly.get("gust") is not None:
                  mapped_point["hourlyGust"] = (
                      hourly["gust"]
                  )

              history["stations"].setdefault(
                  station_id,
                  []
              ).append(mapped_point)

          for station in stations:
              append_station(station)

          for station in explicit_stations:
              if (
                  str(
                      station.get("StationId")
                      or ""
                  ).strip()
                  == "C0B010"
              ):
                  append_station(station)

          for station in rainfall_stations:
              append_rainfall_station(station)

          for station_id, arr in list(
              history["stations"].items()
          ):
              unique = {}

              for point in arr:
                  try:
                      ts = int(point["ts"])

                  except (
                      KeyError,
                      TypeError,
                      ValueError
                  ):
                      continue

                  if ts < cutoff_ms:
                      continue

                  item = {
                      "ts": ts
                  }

                  if point.get("stationName"):
                      item["stationName"] = str(
                          point.get(
                              "stationName"
                          )
                      ).strip()

                  has_value = False

                  try:
                      temp = float(
                          point.get("temp")
                      )

                      if (
                          temp != 0
                          and -50 <= temp <= 60
                      ):
                          item["temp"] = round(
                              temp,
                              1
                          )
                          has_value = True

                  except (
                      TypeError,
                      ValueError
                  ):
                      pass

                  try:
                      rain24h = float(
                          point.get("rain24h")
                      )

                      if rain24h >= 0:
                          item["rain24h"] = round(
                              rain24h,
                              1
                          )
                          has_value = True

                  except (
                      TypeError,
                      ValueError
                  ):
                      pass

                  try:
                      max10min_wind = float(
                          point.get(
                              "max10MinWind"
                          )
                      )

                      if (
                          0 <= max10min_wind <= 60
                      ):
                          item[
                              "max10MinWind"
                          ] = round(
                              max10min_wind,
                              1
                          )
                          has_value = True

                  except (
                      TypeError,
                      ValueError
                  ):
                      pass

                  try:
                      gust = float(
                          point.get(
                              "windGust"
                          )
                      )

                      if 0 <= gust <= 80:
                          item[
                              "windGust"
                          ] = round(
                              gust,
                              1
                          )
                          has_value = True

                  except (
                      TypeError,
                      ValueError
                  ):
                      pass

                  try:
                      hourly_wind = float(
                          point.get(
                              "hourlyWind"
                          )
                      )

                      if (
                          0 <= hourly_wind <= 60
                      ):
                          item[
                              "hourlyWind"
                          ] = round(
                              hourly_wind,
                              1
                          )
                          has_value = True

                  except (
                      TypeError,
                      ValueError
                  ):
                      pass

                  try:
                      hourly_gust = float(
                          point.get(
                              "hourlyGust"
                          )
                      )

                      if 0 <= hourly_gust <= 80:
                          item[
                              "hourlyGust"
                          ] = round(
                              hourly_gust,
                              1
                          )
                          has_value = True

                  except (
                      TypeError,
                      ValueError
                  ):
                      pass

                  if has_value:
                      if ts in unique:
                          unique[ts].update(item)
                      else:
                          unique[ts] = item

              cleaned = [
                  unique[k]
                  for k in sorted(unique)
              ]

              if cleaned:
                  history[
                      "stations"
                  ][station_id] = cleaned
              else:
                  del history[
                      "stations"
                  ][station_id]

          history["generatedAt"] = (
              datetime.now(
                  timezone.utc
              ).isoformat()
          )

          with open(
              output,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  history,
                  f,
                  ensure_ascii=False,
                  separators=(",", ":")
              )

          print(
              "CWA 歷史測站數：",
              len(history["stations"])
          )

          print(
              "C0B010 七堵歷史筆數：",
              len(
                  history["stations"].get(
                      "C0B010",
                      []
                  )
              )
          )

          rain_count = sum(
              1
              for arr in history[
                  "stations"
              ].values()
              if any(
                  "rain24h" in p
                  for p in arr
              )
          )

          wind_count = sum(
              1
              for arr in history[
                  "stations"
              ].values()
              if any(
                  "max10MinWind" in p
                  for p in arr
              )
          )

          gust_count = sum(
              1
              for arr in history[
                  "stations"
              ].values()
              if any(
                  "windGust" in p
                  or "hourlyGust" in p
                  for p in arr
              )
          )

          hourly_gust_count = sum(
              1
              for arr in history[
                  "stations"
              ].values()
              if any(
                  "hourlyGust" in p
                  for p in arr
              )
          )

          print(
              "含 24 小時雨量歷史的測站數：",
              rain_count
          )

          print(
              "含 10 分鐘平均風歷史的測站數：",
              wind_count
          )

          print(
              "含陣風歷史的測站數：",
              gust_count
          )

          print(
              "含整點官方小時最大陣風歷史的測站數：",
              hourly_gust_count
          )
          PY

