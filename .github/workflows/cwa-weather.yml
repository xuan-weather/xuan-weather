name: CWA Weather Data

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  fetch-cwa-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch all CWA datasets
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: |
          set -e

          mkdir -p data

          datasets=(
            O-A0001-001
            O-A0002-001
            O-A0003-001
            F-C0032-001
            W-C0033-001
            W-C0034-001
            W-C0034-005
            E-A0015-001
            E-A0016-001
          )

          for dataset in "${datasets[@]}"; do
            echo "========================================"
            echo "正在取得 CWA：${dataset}"
            echo "========================================"

            curl --fail-with-body \
              --silent \
              --show-error \
              --retry 3 \
              --retry-delay 2 \
              -H "Accept: application/json" \
              -H "Authorization: ${CWA_API_KEY}" \
              -H "Cache-Control: no-cache, no-store, max-age=0" \
              -H "Pragma: no-cache" \
              "https://opendata.cwa.gov.tw/api/v1/rest/datastore/${dataset}" \
              -o "data/cwa-${dataset}.json"

            echo "CWA ${dataset} 資料取得成功"
            wc -c "data/cwa-${dataset}.json"

            python - "${dataset}" <<'PY'
          import json
          import sys
          from datetime import datetime

          dataset = sys.argv[1]
          path = f"data/cwa-{dataset}.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          print(f"{dataset}：JSON 格式正常")

          if not isinstance(data, dict):
              raise SystemExit(
                  f"{dataset}：錯誤，回傳資料不是 JSON 物件"
              )

          if "records" not in data:
              raise SystemExit(
                  f"{dataset}：錯誤，找不到 records"
              )

          print(f"{dataset}：records 存在")

          # 顯示這次實際抓到的最新觀測時間
          latest_time = None

          records = data.get("records", {})
          stations = records.get("Station", [])

          if isinstance(stations, list):
              for station in stations:
                  obs = station.get("ObsTime", {})
                  dt = obs.get("DateTime") if isinstance(obs, dict) else None

                  if dt:
                      try:
                          parsed = datetime.fromisoformat(
                              dt.replace("Z", "+00:00")
                          )

                          if latest_time is None or parsed > latest_time:
                              latest_time = parsed

                      except Exception:
                          pass

          if latest_time:
              print(
                  f"{dataset}：本次抓到的最新 ObsTime = "
                  f"{latest_time.isoformat()}"
              )
          else:
              print(
                  f"{dataset}：找不到可解析的 ObsTime"
              )
          PY

          done

      - name: Show downloaded files
        run: |
          echo "========================================"
          echo "CWA 資料檔案"
          echo "========================================"

          ls -lh data/cwa-*.json

      - name: Commit CWA data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/cwa-*.json

          if git diff --cached --quiet; then
            echo "資料沒有變化，不需要提交"
          else
            git commit -m "Update CWA weather data"
            git push
          fi
