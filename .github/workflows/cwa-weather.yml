name: CWA Weather Data

on:
  workflow_dispatch:
  repository_dispatch:
    types: [cwa-external-timer]

permissions:
  contents: write

# 避免每 5 分鐘排程重疊造成舊資料覆蓋新資料或 git push 衝突
concurrency:
  group: cwa-weather-data
  cancel-in-progress: false

jobs:
  fetch-cwa-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all CWA datasets
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: |
          set -euo pipefail

          mkdir -p data

          datasets=(
            O-A0001-001
            O-A0002-001
            O-A0003-001
            F-C0032-001
            F-D0047-089
            W-C0033-001
            W-C0033-002
            W-C0033-005
            W-C0034-001
            W-C0034-005
            E-A0015-001
            E-A0016-001
          )

          for dataset in "${datasets[@]}"; do
            echo "========================================"
            echo "正在取得 CWA：${dataset}"
            echo "========================================"

            # 每次請求加入唯一 cache-buster，避免高溫 CAP 被上游／代理快取成前一版。
            cache_buster="$(date +%s%N)"
            url="https://opendata.cwa.gov.tw/api/v1/rest/datastore/${dataset}?_=${cache_buster}"

            curl --fail-with-body               --silent               --show-error               --retry 3               --retry-delay 2               --location               -H "Accept: application/json"               -H "Authorization: ${CWA_API_KEY}"               -H "Cache-Control: no-cache, no-store, max-age=0"               -H "Pragma: no-cache"               "${url}"               -o "data/cwa-${dataset}.json"

            echo "CWA ${dataset} 資料取得成功"
            wc -c "data/cwa-${dataset}.json"

            python - "${dataset}" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone, timedelta

          dataset = sys.argv[1]
          path = f"data/cwa-{dataset}.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          print(f"{dataset}：JSON 格式正常")

          if not isinstance(data, dict):
              raise SystemExit(f"{dataset}：錯誤，回傳資料不是 JSON 物件")

          # W-C0033-005 為 CAP 高溫資訊，可能不是一般 datastore records。
          if dataset == "W-C0033-005":
              print(f"{dataset}：CAP 高溫資訊 JSON 保留原始結構")

              # 把 CAP 常見的發布／更新時間欄位全部往下搜尋，
              # 讓 Actions log 明確顯示這次抓到的是哪一版。
              time_keys = {
                  "sent", "Sent",
                  "issueTime", "IssueTime",
                  "publishTime", "PublishTime",
                  "publishedAt", "PublishedAt",
                  "publishDate", "PublishDate",
                  "published", "Published",
                  "updateTime", "UpdateTime",
                  "updatedAt", "UpdatedAt",
                  "modifiedAt", "ModifiedAt",
              }

              latest = None
              seen = set()

              def walk(node):
                  global latest
                  if not isinstance(node, (dict, list)):
                      return

                  ident = id(node)
                  if ident in seen:
                      return
                  seen.add(ident)

                  if isinstance(node, list):
                      for item in node:
                          walk(item)
                      return

                  for key, value in node.items():
                      if key in time_keys:
                          if isinstance(value, dict):
                              raw = (
                                  value.get("value")
                                  or value.get("datetime")
                                  or value.get("DateTime")
                                  or value.get("time")
                                  or ""
                              )
                          else:
                              raw = value

                          if raw:
                              text = str(raw).replace("Z", "+00:00")
                              try:
                                  dt = datetime.fromisoformat(text)
                                  if dt.tzinfo is None:
                                      dt = dt.replace(tzinfo=timezone.utc)
                                  if latest is None or dt > latest:
                                      latest = dt
                              except Exception:
                                  pass

                      if isinstance(value, (dict, list)):
                          walk(value)

              walk(data)

              if latest:
                  taipei = latest.astimezone(timezone(timedelta(hours=8)))
                  print(f"{dataset}：本次抓到的最新官方發布／更新時間 = {taipei.isoformat()}")
              else:
                  print(f"{dataset}：找不到可解析的官方發布／更新時間")
          else:
              if "records" not in data:
                  raise SystemExit(f"{dataset}：錯誤，找不到 records")
              print(f"{dataset}：records 存在")

              latest_time = None
              records = data.get("records", {})
              stations = records.get("Station", [])

              if isinstance(stations, list):
                  for station in stations:
                      obs = station.get("ObsTime", {})
                      dt = obs.get("DateTime") if isinstance(obs, dict) else None
                      if dt:
                          try:
                              parsed = datetime.fromisoformat(dt.replace("Z", "+00:00"))
                              if latest_time is None or parsed > latest_time:
                                  latest_time = parsed
                          except Exception:
                              pass

              if latest_time:
                  print(f"{dataset}：本次抓到的最新 ObsTime = {latest_time.isoformat()}")
              else:
                  print(f"{dataset}：找不到可解析的 ObsTime")
          PY

          done

      - name: Verify 7-day county forecast dataset
        run: |
          set -euo pipefail

          python <<'PY'
          import json

          path = "data/cwa-F-D0047-089.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, dict):
              raise SystemExit("F-D0047-089：錯誤，回傳資料不是 JSON 物件")

          records = data.get("records") or data.get("result", {}).get("records") or {}
          locations = records.get("location") or records.get("dataset", {}).get("location") or []

          if not isinstance(locations, list) or not locations:
              raise SystemExit("F-D0047-089：錯誤，找不到縣市預報 location 資料")

          names = []
          for location in locations:
              name = location.get("locationName") or location.get("LocationName")
              if name:
                  names.append(str(name))

          print(f"F-D0047-089：JSON 正常，共取得 {len(names)} 個預報區域")
          print("F-D0047-089：預報區域範例 =", ", ".join(names[:10]))

          if len(names) < 20:
              raise SystemExit(
                  f"F-D0047-089：預報區域數量只有 {len(names)}，"
                  "疑似不是完整縣市預報資料，停止提交。"
              )

          has_weather_element = any(
              isinstance(location.get("weatherElement"), list)
              and len(location.get("weatherElement")) > 0
              for location in locations
          )

          if not has_weather_element:
              raise SystemExit(
                  "F-D0047-089：找不到 weatherElement，停止提交。"
              )

          print("F-D0047-089：縣市一週預報資料結構驗證成功")
          PY

      - name: Verify high-temperature CAP is not an old cached version
        run: |
          set -euo pipefail

          python <<'PY'
          import json
          from datetime import datetime, timezone, timedelta

          path = "data/cwa-W-C0033-005.json"
          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          keys = {
              "sent", "Sent",
              "issueTime", "IssueTime",
              "publishTime", "PublishTime",
              "publishedAt", "PublishedAt",
              "publishDate", "PublishDate",
              "published", "Published",
              "updateTime", "UpdateTime",
              "updatedAt", "UpdatedAt",
              "modifiedAt", "ModifiedAt",
          }

          latest = None
          seen = set()

          def walk(node):
              global latest
              if not isinstance(node, (dict, list)):
                  return
              ident = id(node)
              if ident in seen:
                  return
              seen.add(ident)

              if isinstance(node, list):
                  for item in node:
                      walk(item)
                  return

              for key, value in node.items():
                  if key in keys:
                      raw = value
                      if isinstance(value, dict):
                          raw = (
                              value.get("value")
                              or value.get("datetime")
                              or value.get("DateTime")
                              or value.get("time")
                              or ""
                          )
                      if raw:
                          try:
                              dt = datetime.fromisoformat(str(raw).replace("Z", "+00:00"))
                              if dt.tzinfo is None:
                                  dt = dt.replace(tzinfo=timezone.utc)
                              if latest is None or dt > latest:
                                  latest = dt
                          except Exception:
                              pass
                  if isinstance(value, (dict, list)):
                      walk(value)

          walk(data)

          if latest:
              taipei = latest.astimezone(timezone(timedelta(hours=8)))
              print(f"W-C0033-005 最後發布／更新：{taipei.isoformat()}")

              # 07:30 續發後仍抓到前一天 17:30 左右的版本時，
              # 不允許這個舊版本繼續被提交到 GitHub Pages。
              now = datetime.now(timezone(timedelta(hours=8)))
              today_0730 = now.replace(hour=7, minute=30, second=0, microsecond=0)

              if now >= today_0730 and taipei.date() < now.date():
                  raise SystemExit(
                      "W-C0033-005 仍是前一天版本，停止提交，避免網站繼續發布舊高溫資訊。"
                  )
          else:
              print("W-C0033-005 無法解析發布時間，保留原資料流程。")
          PY

      - name: Show downloaded files
        run: |
          echo "========================================"
          echo "CWA 資料檔案"
          echo "========================================"
          ls -lh data/cwa-*.json

      - name: Commit CWA data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/cwa-*.json

          if git diff --cached --quiet; then
            echo "資料沒有變化，不需要提交"
          else
            git commit -m "Update CWA weather data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
