      - name: Fetch MOENV AQX_P_432
        env:
          MOENV_API_KEY: ${{ secrets.MOENV_API_KEY }}
        run: |
          set -e
          mkdir -p data

          echo "開始讀取 MOENV AQX_P_432..."

          curl \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 2 \
            -H "Accept: application/json" \
            -w "\nHTTP_STATUS:%{http_code}\n" \
            "https://data.moenv.gov.tw/api/v2/aqx_p_432?format=json&offset=0&limit=1000&api_key=${MOENV_API_KEY}" \
            -o data/aqx-p-432.json \
            2>curl-error.txt

          echo "===== CURL ERROR ====="
          cat curl-error.txt || true

          echo "===== HTTP STATUS ====="
          tail -n 1 data/aqx-p-432.json || true

          echo "===== FILE SIZE ====="
          wc -c data/aqx-p-432.json

          echo "===== RESPONSE PREVIEW ====="
          head -c 500 data/aqx-p-432.json
          echo
