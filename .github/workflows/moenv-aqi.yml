      - name: Validate AQI JSON
        run: |
          python -c "
          import json

          path = 'data/aqx-p-432.json'

          with open(path, 'r', encoding='utf-8') as f:
              data = json.load(f)

          if not isinstance(data, list):
              raise SystemExit('錯誤：AQI 回傳不是 JSON 陣列')

          print(f'AQI records：{len(data)} 筆')

          if not data:
              raise SystemExit('錯誤：AQI 資料為空')

          first = data[0]

          if not isinstance(first, dict):
              raise SystemExit('錯誤：AQI 測站資料格式錯誤')

          print(f'第一個測站：{first.get(\"sitename\", \"未知\")}')
          print(f'第一筆 AQI：{first.get(\"aqi\", \"-\")}')
          "
