name: MOENV AQI Data

on:
  schedule:
    - cron: '10 * * * *'
      timezone: 'Asia/Taipei'
  workflow_dispatch:
  repository_dispatch:
    types: [hourly-data-update]

permissions:
  contents: write

jobs:
  fetch-aqi-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch MOENV AQX_P_432
        env:
          MOENV_API_KEY: ${{ secrets.MOENV_API_KEY }}
        run: |
          set -e
          mkdir -p data

          echo "開始讀取 MOENV AQX_P_432..."

          curl \
            --silent \
            --show-error \
            --fail \
            --retry 3 \
            --retry-delay 5 \
            -H "Authorization: Bearer ${MOENV_API_KEY}" \
            "https://data.moenv.gov.tw/api/v2/aqx_p_432?api_key=${MOENV_API_KEY}&limit=1000&sort=publishtime%20desc" \
            -o data/aqx-p-432.json

          echo "AQI 資料下載完成"

          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("data/aqx-p-432.json")
          data = json.loads(p.read_text(encoding="utf-8"))

          # MOENV API 可能直接回傳陣列，
          # 也可能回傳 {"records": [...]}。
          if isinstance(data, list):
              records = data
          elif isinstance(data, dict):
              records = data.get("records", [])
          else:
              records = []

          if not records:
              raise SystemExit("AQI 回傳沒有 records")

          # 確認 records 內容確實是物件
          records = [
              r for r in records
              if isinstance(r, dict)
          ]

          if not records:
              raise SystemExit("AQI records 格式錯誤")

          times = sorted({
              str(r.get("publishtime", "")).strip()
              for r in records
              if r.get("publishtime")
          })

          print("AQI records:", len(records))
          print("最新 publishtime:", times[-1] if times else "未知")
          PY

      - name: Commit and push AQI data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/aqx-p-432.json

          if git diff --cached --quiet; then
            echo "AQI 資料沒有變化，不需要 commit"
          else
            git commit -m "Update MOENV AQI data"
            git push
          fi
