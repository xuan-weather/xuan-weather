name: MOENV AQI Data

on:
  # 每小時第 20 分鐘嘗試更新；GitHub Actions 可能因排程負載延遲啟動。
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: moenv-aqi-data
  cancel-in-progress: false

jobs:
  fetch-aqi-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch MOENV AQX_P_432
        env:
          MOENV_API_KEY: ${{ secrets.MOENV_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$MOENV_API_KEY" || { echo "缺少 MOENV_API_KEY secret"; exit 1; }
          mkdir -p data

          echo "開始讀取 MOENV AQX_P_432..."
          cache_buster="$(date +%s)"
          curl \
            --silent \
            --show-error \
            --fail-with-body \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 20 \
            --max-time 90 \
            -H "Authorization: Bearer ${MOENV_API_KEY}" \
            -H "Cache-Control: no-cache, no-store, max-age=0" \
            -H "Pragma: no-cache" \
            "https://data.moenv.gov.tw/api/v2/aqx_p_432?api_key=${MOENV_API_KEY}&limit=1000&sort=publishtime%20desc&_=${cache_buster}" \
            -o data/aqx-p-432.json

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/aqx-p-432.json")
          try:
              payload = json.loads(path.read_text(encoding="utf-8"))
          except Exception as exc:
              raise SystemExit(f"AQI 回傳不是有效 JSON：{exc}")

          if isinstance(payload, list):
              records = payload
          elif isinstance(payload, dict):
              records = payload.get("records", [])
          else:
              records = []

          records = [item for item in records if isinstance(item, dict)] if isinstance(records, list) else []
          if not records:
              raise SystemExit("AQI 回傳沒有有效 records，停止覆寫資料")

          times = sorted(str(item.get("publishtime", "")).strip() for item in records if item.get("publishtime"))
          print(f"AQI records：{len(records)}")
          print(f"最新 publishtime：{times[-1] if times else '來源未提供時間欄位'}")
          PY

      - name: Commit and push AQI data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/aqx-p-432.json

          if git diff --cached --quiet; then
            echo "AQI 檔案沒有變化，不需要提交。"
            exit 0
          fi

          git commit -m "Update MOENV AQI data"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
