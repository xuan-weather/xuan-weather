name: 更新國家級警報

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-national-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 抓取 NCDR 生效中的政府／氣象署示警
        shell: python
        run: |
          import json
          import re
          import urllib.request
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          TZ = timezone(timedelta(hours=8))
          FEED_URL = "https://alerts.ncdr.nat.gov.tw/JSONAtomFeeds.ashx"

          # 只納入目前網站需要的重大災害示警類別。
          TARGET_CATEGORIES = {
              "地震",
              "海嘯",
              "颱風",
              "雷雨",
              "降雨",
              "強風",
              "濃霧",
              "高溫",
              "低溫",
              "火山",
              "巨浪",
          }

          # NCDR 的總 JSON Feed 也包含其他政府機關資料。
          # 這裡只保留中央氣象署（CWA）相關示警。
          CWA_KEYWORDS = (
              "中央氣象署",
              "氣象署",
              "交通部中央氣象署",
              "CWA",
          )

          def clean_text(value):
              if isinstance(value, dict):
                  value = value.get("#text", value.get("value", ""))
              return re.sub(r"\s+", " ", str(value or "")).strip()

          def val(obj, *keys):
              for key in keys:
                  if isinstance(obj, dict) and key in obj:
                      value = obj[key]
                      if isinstance(value, dict):
                          value = value.get("#text", value.get("value", ""))
                      return str(value or "").strip()
              return ""

          def parse_time(value):
              s = str(value or "").strip()
              if not s:
                  return None

              # ISO 8601
              try:
                  d = datetime.fromisoformat(s.replace("Z", "+00:00"))
                  if d.tzinfo is None:
                      d = d.replace(tzinfo=TZ)
                  return d.astimezone(TZ)
              except Exception:
                  pass

              # NCDR 常見中文日期：
              # 2026/9/21 上午 09:21:00
              # 2026/9/21 下午 03:21:00
              m = re.search(
                  r"(\d{4})[/-](\d{1,2})[/-](\d{1,2})"
                  r".*?(上午|下午)?\s*(\d{1,2}):(\d{2})(?::(\d{2}))?",
                  s
              )

              if m:
                  y, mo, day = map(int, m.group(1, 2, 3))
                  ap = m.group(4) or ""
                  hh = int(m.group(5))
                  mm = int(m.group(6))
                  ss = int(m.group(7) or 0)

                  if ap == "下午" and hh < 12:
                      hh += 12
                  if ap == "上午" and hh == 12:
                      hh = 0

                  return datetime(
                      y, mo, day, hh, mm, ss, tzinfo=TZ
                  )

              return None

          def get_category(entry):
              category = entry.get("category", "")

              if isinstance(category, dict):
                  return (
                      category.get("@term")
                      or category.get("term")
                      or category.get("#text")
                      or category.get("value")
                      or ""
                  )

              if isinstance(category, list):
                  for item in category:
                      if isinstance(item, dict):
                          value = (
                              item.get("@term")
                              or item.get("term")
                              or item.get("#text")
                              or item.get("value")
                              or ""
                          )
                          if value:
                              return str(value)
                      elif item:
                          return str(item)

              return str(category or "")

          def get_author(entry):
              author = entry.get("author", "")

              if isinstance(author, dict):
                  return clean_text(
                      author.get("name")
                      or author.get("#text")
                      or author.get("value")
                  )

              return clean_text(author)

          def get_link(entry):
              raw_link = entry.get("link", "")

              if isinstance(raw_link, dict):
                  return (
                      raw_link.get("@href")
                      or raw_link.get("href")
                      or ""
                  )

              if isinstance(raw_link, list):
                  for item in raw_link:
                      if not isinstance(item, dict):
                          continue
                      rel = item.get("@rel") or item.get("rel")
                      href = item.get("@href") or item.get("href") or ""
                      if rel in (None, "alternate") and href:
                          return href

                  for item in raw_link:
                      if isinstance(item, dict):
                          href = item.get("@href") or item.get("href") or ""
                          if href:
                              return href

              return str(raw_link or "")

          def normalize(entry):
              if not isinstance(entry, dict):
                  return None

              category = get_category(entry).strip()
              title = clean_text(entry.get("title", ""))
              author = get_author(entry)
              summary = clean_text(entry.get("summary", ""))
              status = val(entry, "cap:status", "status") or "Actual"
              msg_type = val(entry, "cap:msgType", "msgType") or "Alert"

              # 只接受實際警報，不把演練 Test 當成真正警報。
              if str(status).lower() != "actual":
                  return None

              if str(msg_type).lower() == "cancel":
                  return None

              if category not in TARGET_CATEGORIES:
                  return None

              # 只保留中央氣象署相關資料。
              cwa_text = " ".join([author, title, summary, category])
              if not any(k.lower() in cwa_text.lower() for k in CWA_KEYWORDS):
                  return None

              updated = val(entry, "updated")
              effective = val(entry, "cap:effective", "effective")
              expires = val(entry, "cap:expires", "expires")

              now = datetime.now(TZ)
              eff_dt = parse_time(effective) or parse_time(updated)
              exp_dt = parse_time(expires)

              # 尚未生效
              if eff_dt and eff_dt > now:
                  return None

              # 已過期
              if exp_dt and exp_dt < now:
                  return None

              return {
                  "id": val(entry, "id")
                        or f"{category}|{updated}|{title}|{summary}",
                  "category": category,
                  "title": title or category,
                  "status": status,
                  "msgType": msg_type,
                  "author": author,
                  "updated": updated,
                  "effective": effective,
                  "expires": expires,
                  "summary": summary,
                  "link": get_link(entry),
              }

          # 下載 NCDR 最新完整 JSON Feed
          request = urllib.request.Request(
              FEED_URL,
              headers={
                  "User-Agent": "Xuan-Weather-National-Alert/2.0",
                  "Accept": "application/json",
              },
          )

          with urllib.request.urlopen(request, timeout=20) as response:
              if response.status != 200:
                  raise RuntimeError(
                      f"NCDR HTTP 狀態碼：{response.status}"
                  )

              raw = response.read().decode(
                  "utf-8-sig", "replace"
              )

          payload = json.loads(raw)

          entries = payload.get("entry", [])
          if isinstance(entries, dict):
              entries = [entries]
          if not isinstance(entries, list):
              entries = []

          normalized = []

          for entry in entries:
              item = normalize(entry)
              if item:
                  normalized.append(item)

          # 相同 ID 只保留最新一筆
          latest = {}

          for item in normalized:
              key = item["id"]
              old = latest.get(key)

              if not old:
                  latest[key] = item
                  continue

              new_time = (
                  parse_time(item["updated"])
                  or datetime.min.replace(tzinfo=TZ)
              )
              old_time = (
                  parse_time(old["updated"])
                  or datetime.min.replace(tzinfo=TZ)
              )

              if new_time > old_time:
                  latest[key] = item

          alerts = list(latest.values())

          alerts.sort(
              key=lambda x: (
                  parse_time(x["updated"])
                  or datetime.min.replace(tzinfo=TZ)
              ),
              reverse=True,
          )

          output = {
              "updatedAt": datetime.now(TZ).isoformat(),
              "source": "NCDR 民生示警公開資料平台／中央氣象署",
              "feed": FEED_URL,
              "alerts": alerts,
          }

          out = Path("data/national-alerts.json")
          out.parent.mkdir(parents=True, exist_ok=True)

          out.write_text(
              json.dumps(
                  output,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print(f"NCDR 生效中的 CWA 重大示警：{len(alerts)}")

          for item in alerts:
              print(
                  f"- {item['category']} | "
                  f"{item['title']} | "
                  f"{item['effective']} ~ {item['expires']}"
              )

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/national-alerts.json

          if git diff --cached --quiet; then
            echo "沒有新的國家級警報資料變化，不需要提交。"
            exit 0
          fi

          git commit -m "chore: update national alerts"
          git push
