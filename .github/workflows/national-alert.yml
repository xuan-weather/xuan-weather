name: 更新國家級警報

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-national-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 抓取 NCDR 公開生效中示警
        shell: python
        run: |
          import json
          import re
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          TZ = timezone(timedelta(hours=8))

          # 使用 NCDR 公開 ATOM Feed。
          # 不需要 API Key。
          FEED_URL = "https://alerts.ncdr.nat.gov.tw/RssAtomFeeds.ashx"

          # 只排除明確不是災害示警的項目。
          # 不再限制只有中央氣象署，讓公開的中央部會災害示警
          # 有機會進入網站。
          EXCLUDED_CATEGORIES = {
              "道路施工",
              "開放路邊停車",
              "開放臨時停車",
              "國家公園入園示警",
              "海灘水質",
              "捷運營運",
              "鐵路事故",
          }

          def clean_text(value):
              if value is None:
                  return ""
              return re.sub(r"\s+", " ", str(value)).strip()

          def local_name(tag):
              return tag.split("}", 1)[-1] if "}" in tag else tag

          def child_text(element, names):
              wanted = {str(x).lower() for x in names}
              for child in list(element):
                  if local_name(child.tag).lower() in wanted:
                      return clean_text(child.text)
              return ""

          def find_descendant_text(element, names):
              wanted = {str(x).lower() for x in names}
              for child in element.iter():
                  if local_name(child.tag).lower() in wanted:
                      text = clean_text(child.text)
                      if text:
                          return text
              return ""

          def parse_time(value):
              s = clean_text(value)
              if not s:
                  return None

              try:
                  d = datetime.fromisoformat(s.replace("Z", "+00:00"))
                  if d.tzinfo is None:
                      d = d.replace(tzinfo=TZ)
                  return d.astimezone(TZ)
              except Exception:
                  pass

              m = re.search(
                  r"(\d{4})[/-](\d{1,2})[/-](\d{1,2})"
                  r".*?(上午|下午)?\s*(\d{1,2}):(\d{2})(?::(\d{2}))?",
                  s
              )

              if m:
                  y, mo, day = map(int, m.group(1, 2, 3))
                  ap = m.group(4) or ""
                  hh = int(m.group(5))
                  mm = int(m.group(6))
                  ss = int(m.group(7) or 0)

                  if ap == "下午" and hh < 12:
                      hh += 12
                  if ap == "上午" and hh == 12:
                      hh = 0

                  return datetime(
                      y, mo, day, hh, mm, ss, tzinfo=TZ
                  )

              return None

          def parse_status(entry):
              return (
                  find_descendant_text(entry, ["status"])
                  or "Actual"
              )

          def parse_msg_type(entry):
              return (
                  find_descendant_text(entry, ["msgType"])
                  or "Alert"
              )

          def parse_category(entry):
              for child in list(entry):
                  if local_name(child.tag).lower() == "category":
                      term = (
                          child.attrib.get("term")
                          or child.attrib.get("{http://www.w3.org/2005/Atom}term")
                      )
                      if term:
                          return clean_text(term)

                      text = clean_text(child.text)
                      if text:
                          return text

              return (
                  find_descendant_text(entry, ["category"])
                  or ""
              )

          def parse_link(entry):
              # Atom 標準 link href
              for child in list(entry):
                  if local_name(child.tag).lower() == "link":
                      href = child.attrib.get("href", "")
                      if href:
                          return href.strip()

                      text = clean_text(child.text)
                      if text:
                          return text

              return find_descendant_text(entry, ["link"])

          def parse_author(entry):
              author = find_descendant_text(entry, ["name"])
              if author:
                  return author
              return find_descendant_text(entry, ["author"])

          def parse_entry(entry):
              title = find_descendant_text(entry, ["title"])
              summary = find_descendant_text(entry, ["summary", "description"])
              author = parse_author(entry)
              category = parse_category(entry)
              status = parse_status(entry)
              msg_type = parse_msg_type(entry)

              entry_id = find_descendant_text(entry, ["id"])
              updated = find_descendant_text(entry, ["updated", "published"])
              effective = find_descendant_text(entry, ["effective"])
              expires = find_descendant_text(entry, ["expires"])
              link = parse_link(entry)

              text_blob = " ".join([
                  category, title, summary, author
              ]).strip()

              status_lower = status.lower()

              # 保留正式示警與演練／測試資料。
              if status_lower not in ("actual", "test"):
                  return None

              # Cancel 不作為目前有效示警。
              if msg_type.lower() == "cancel":
                  return None

              # 明確不是災害警示的公開項目不放進本區。
              if category in EXCLUDED_CATEGORIES:
                  return None

              now = datetime.now(TZ)
              eff_dt = parse_time(effective) or parse_time(updated)
              exp_dt = parse_time(expires)

              if eff_dt and eff_dt > now:
                  return None

              if exp_dt and exp_dt < now:
                  return None

              # 判斷演練／測試。
              drill_keywords = (
                  "國家防災日",
                  "國家級警報",
                  "地震速報演練",
                  "海嘯警報演練",
                  "演練",
                  "測試",
              )

              is_drill = (
                  status_lower == "test"
                  or any(
                      k.lower() in text_blob.lower()
                      for k in drill_keywords
                  )
              )

              if not entry_id:
                  entry_id = (
                      f"{category}|{updated}|{title}|{summary}"
                  )

              return {
                  "id": entry_id,
                  "category": category,
                  "title": title or category or "NCDR 示警",
                  "status": status,
                  "msgType": msg_type,
                  "author": author,
                  "updated": updated,
                  "effective": effective,
                  "expires": expires,
                  "summary": summary,
                  "link": link,
                  "isDrill": is_drill,
              }

          request = urllib.request.Request(
              FEED_URL,
              headers={
                  "User-Agent": "Xuan-Weather-National-Alert/3.0",
                  "Accept": (
                      "application/atom+xml, "
                      "application/xml, text/xml, */*"
                  ),
              },
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 200:
                  raise RuntimeError(
                      f"NCDR HTTP 狀態碼：{response.status}"
                  )
              raw = response.read()

          # 自動處理 UTF-8 BOM。
          raw = raw.lstrip(b"\xef\xbb\xbf")

          try:
              root = ET.fromstring(raw)
          except ET.ParseError as exc:
              # 若服務端回傳 JSON，保留診斷能力。
              try:
                  payload = json.loads(raw.decode("utf-8-sig", "replace"))
                  raise RuntimeError(
                      "NCDR 回傳 JSON 而非 ATOM XML；"
                      f"JSON keys={list(payload)[:10]}"
                  ) from exc
              except json.JSONDecodeError:
                  raise RuntimeError(
                      f"NCDR ATOM XML 解析失敗：{exc}"
                  ) from exc

          entries = [
              element
              for element in root.iter()
              if local_name(element.tag).lower() == "entry"
          ]

          normalized = []

          for entry in entries:
              item = parse_entry(entry)
              if item:
                  normalized.append(item)

          # 同 ID 只保留 updated 較新的版本。
          latest = {}

          for item in normalized:
              key = item["id"]
              old = latest.get(key)

              if old is None:
                  latest[key] = item
                  continue

              new_time = (
                  parse_time(item["updated"])
                  or datetime.min.replace(tzinfo=TZ)
              )
              old_time = (
                  parse_time(old["updated"])
                  or datetime.min.replace(tzinfo=TZ)
              )

              if new_time > old_time:
                  latest[key] = item

          alerts = list(latest.values())

          alerts.sort(
              key=lambda x: (
                  parse_time(x["updated"])
                  or datetime.min.replace(tzinfo=TZ)
              ),
              reverse=True,
          )

          output = {
              "updatedAt": datetime.now(TZ).isoformat(),
              "source": "NCDR 民生示警公開資料平台",
              "feed": FEED_URL,
              "alerts": alerts,
          }

          out = Path("data/national-alerts.json")
          out.parent.mkdir(parents=True, exist_ok=True)

          out.write_text(
              json.dumps(
                  output,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print(f"NCDR 公開生效中示警：{len(alerts)}")

          for item in alerts:
              drill = "【演練／測試】" if item.get("isDrill") else ""
              print(
                  f"- {drill}{item['category']} | "
                  f"{item['title']} | "
                  f"{item['author']} | "
                  f"{item['effective']} ~ {item['expires']}"
              )

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/national-alerts.json

          if git diff --cached --quiet; then
            echo "沒有新的 NCDR 示警資料變化，不需要提交。"
            exit 0
          fi

          git commit -m "chore: update national alerts"
          git push
