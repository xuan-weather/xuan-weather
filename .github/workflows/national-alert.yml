name: 更新國家級警報

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-national-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 抓取 NCDR 生效中的政府／氣象示警
        shell: python
        run: |
          import json
          import re
          import urllib.request
          from datetime import datetime, timezone, timedelta
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path

          TZ = timezone(timedelta(hours=8))
          BASE = "https://alerts.ncdr.nat.gov.tw/JSONAtomFeed.ashx?AlertType={}"

          TARGET_CATEGORIES = {
              "地震", "海嘯", "颱風", "雷雨", "降雨",
              "強風", "濃霧", "高溫", "火山", "巨浪"
          }

          def fetch_one(alert_type):
              url = BASE.format(alert_type)
              try:
                  req = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "Xuan-Weather-National-Alert/1.0",
                          "Accept": "application/json"
                      }
                  )
                  with urllib.request.urlopen(req, timeout=8) as r:
                      if r.status != 200:
                          return []
                      payload = json.loads(
                          r.read().decode("utf-8-sig", "replace")
                      )

                  entries = payload.get("entry", [])
                  if isinstance(entries, dict):
                      entries = [entries]

                  return entries if isinstance(entries, list) else []

              except Exception:
                  return []

          def val(x, *keys):
              for k in keys:
                  if isinstance(x, dict) and k in x:
                      v = x[k]

                      if isinstance(v, dict):
                          v = v.get("#text", v.get("value", ""))

                      return str(v or "").strip()

              return ""

          def parse_time(s):
              s = str(s or "").strip()

              if not s:
                  return None

              try:
                  d = datetime.fromisoformat(
                      s.replace("Z", "+00:00")
                  )

                  if d.tzinfo is None:
                      d = d.replace(tzinfo=TZ)

                  return d.astimezone(TZ)

              except Exception:
                  pass

              m = re.search(
                  r"(\d{4})[/-](\d{1,2})[/-](\d{1,2}).*?"
                  r"(上午|下午)?\s*(\d{1,2}):(\d{2})(?::(\d{2}))?",
                  s
              )

              if m:
                  y, mo, day = map(
                      int,
                      m.group(1, 2, 3)
                  )

                  ap = m.group(4) or ""
                  hh = int(m.group(5))
                  mm = int(m.group(6))
                  ss = int(m.group(7) or 0)

                  if ap == "下午" and hh < 12:
                      hh += 12

                  if ap == "上午" and hh == 12:
                      hh = 0

                  return datetime(
                      y, mo, day,
                      hh, mm, ss,
                      tzinfo=TZ
                  )

              return None

          def normalize(entry):

              category = val(
                  entry,
                  "category",
                  "title"
              )

              if isinstance(entry.get("category"), dict):
                  category = val(
                      entry["category"],
                      "@term",
                      "term",
                      "#text",
                      "value"
                  )

              if category not in TARGET_CATEGORIES:
                  return None

              status = val(
                  entry,
                  "cap:status",
                  "status"
              ) or "Actual"

              msg_type = val(
                  entry,
                  "cap:msgType",
                  "msgType"
              ) or "Alert"

              if str(msg_type).lower() == "cancel":
                  return None

              if str(status).lower() not in {
                  "actual",
                  "test"
              }:
                  return None

              updated = val(entry, "updated")
              effective = val(
                  entry,
                  "cap:effective",
                  "effective"
              )
              expires = val(
                  entry,
                  "cap:expires",
                  "expires"
              )

              now = datetime.now(TZ)

              eff_dt = (
                  parse_time(effective)
                  or parse_time(updated)
              )

              exp_dt = parse_time(expires)

              if eff_dt and eff_dt > now:
                  return None

              if exp_dt and exp_dt < now:
                  return None

              summary = entry.get("summary", "")

              if isinstance(summary, dict):
                  summary = summary.get(
                      "#text",
                      summary.get("value", "")
                  )

              summary = re.sub(
                  r"<[^>]+>",
                  " ",
                  str(summary or "")
              )

              summary = re.sub(
                  r"\s+",
                  " ",
                  summary
              ).strip()

              link = ""

              raw_link = entry.get("link", "")

              if isinstance(raw_link, dict):
                  link = (
                      raw_link.get("@href")
                      or raw_link.get("href")
                      or ""
                  )

              elif isinstance(raw_link, list):

                  for item in raw_link:

                      if isinstance(item, dict) and (
                          item.get("@rel")
                          in (None, "alternate")
                      ):

                          link = (
                              item.get("@href")
                              or item.get("href")
                              or ""
                          )

                          if link:
                              break

              else:
                  link = str(raw_link or "")

              return {
                  "id": val(entry, "id")
                        or f"{category}|{updated}|{summary}",

                  "category": category,

                  "title": val(
                      entry,
                      "title"
                  ) or category,

                  "status": status,

                  "msgType": msg_type,

                  "updated": updated,

                  "effective": effective,

                  "expires": expires,

                  "summary": summary,

                  "link": link
              }

          entries = []

          with ThreadPoolExecutor(
              max_workers=20
          ) as pool:

              futures = [
                  pool.submit(fetch_one, i)
                  for i in range(1, 121)
              ]

              for future in as_completed(futures):
                  entries.extend(
                      future.result()
                  )

          normalized = []

          for entry in entries:

              item = normalize(entry)

              if item:
                  normalized.append(item)

          latest = {}

          for item in normalized:

              key = item["id"]

              old = latest.get(key)

              if (
                  not old
                  or (
                      parse_time(item["updated"])
                      or datetime.min.replace(tzinfo=TZ)
                  )
                  >
                  (
                      parse_time(old["updated"])
                      or datetime.min.replace(tzinfo=TZ)
                  )
              ):

                  latest[key] = item

          alerts = list(
              latest.values()
          )

          alerts.sort(
              key=lambda x:
                  parse_time(x["updated"])
                  or datetime.min.replace(tzinfo=TZ),
              reverse=True
          )

          output = {
              "updatedAt":
                  datetime.now(TZ).isoformat(),

              "source":
                  "NCDR 民生示警公開資料平台／中央氣象署等政府示警",

              "alerts":
                  alerts
          }

          out = Path(
              "data/national-alerts.json"
          )

          out.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          out.write_text(
              json.dumps(
                  output,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print(
              f"生效中的重要示警：{len(alerts)}"
          )

          for x in alerts:
              print(
                  f"- {x['category']} | "
                  f"{x['status']} | "
                  f"{x['updated']} | "
                  f"{x['summary'][:80]}"
              )

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/national-alerts.json

          if git diff --cached --quiet; then
            echo "沒有新的國家級警報資料變化，不需要提交。"
            exit 0
          fi

          git commit -m "chore: update national alerts"
          git push
