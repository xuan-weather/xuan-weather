name: CWA Radar History 24h

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: cwa-radar-history
  cancel-in-progress: false

jobs:
  fetch-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pillow requests
      - name: Fetch and render official CWA history
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: python scripts/fetch_cwa_radar_history.py
      - name: Commit history frames
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/radar-history/
          if ! git diff --cached --quiet; then
            git commit -m "Update official CWA radar history (24h)"
            git push
          else
            echo "No radar history changes."
          fi
