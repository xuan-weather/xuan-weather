name: CWA Radar History 24h

on:
  # Keep manual execution available for testing and recovery.
  workflow_dispatch:

  # Triggered by the dedicated Cloudflare Worker every 10 minutes.
  repository_dispatch:
    types:
      - cwa-radar-history-refresh

permissions:
  contents: write

concurrency:
  group: cwa-radar-history
  cancel-in-progress: false

jobs:
  fetch-history:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pillow requests

      - name: Fetch and render official CWA history
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: python scripts/fetch_cwa_radar_history.py

      - name: Commit and push history frames safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f data/radar-history/

          if git diff --cached --quiet; then
            echo "No radar history changes."
            exit 0
          fi

          git commit -m "Update official CWA radar history (24h)"

          # Rebase generated commit on the latest main branch.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
