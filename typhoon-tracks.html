<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xuan Weather｜多模式颱風路徑</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{color-scheme:dark;--bg:#07111f;--panel:#0e1d30;--line:#243b55;--txt:#edf5ff;--muted:#9fb2c8;--accent:#42d6e8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{padding:14px 16px;background:#0c1b2d;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;justify-content:space-between}.top h1{font-size:18px;margin:0}.top p{font-size:12px;color:var(--muted);margin:5px 0 0}.back{color:#c5f6ff;border:1px solid #36546e;border-radius:10px;padding:9px 12px;text-decoration:none;white-space:nowrap}.wrap{padding:12px;max-width:1400px;margin:auto}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field select,.field button{width:100%;padding:11px;border-radius:9px;background:#132942;color:var(--txt);border:1px solid #35516e;font-size:14px}.model-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.pill{font-size:12px;border:1px solid #35516e;background:#12243a;border-radius:999px;padding:6px 9px;color:#b8cde2}.pill.ok{border-color:#197b70;color:#9af5dc}.pill.bad{border-color:#775a32;color:#ffdca3}.status{font-size:13px;line-height:1.65;color:#c5d5e5;white-space:pre-wrap}.mapbox{height:58vh;min-height:360px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#091725}#map{width:100%;height:100%}.sliderrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-top:12px}.sliderrow input{width:100%}.legend{font-size:12px;color:var(--muted);line-height:1.7;margin-top:10px}.foot{font-size:11px;color:var(--muted);line-height:1.7;padding:12px 2px}button{cursor:pointer}@media(max-width:520px){.top{align-items:flex-start}.top h1{font-size:16px}.controls{grid-template-columns:1fr 1fr}.mapbox{height:56vh;min-height:330px}}
</style></head><body>
<header class="top"><div><h1>🌀 多模式颱風路徑</h1><p>Xuan Weather｜獨立專區</p></div><a class="back" href="./index.html">← 返回首頁</a></header>
<main class="wrap"><section class="panel"><div class="controls"><div class="field"><label for="storm">颱風／風暴</label><select id="storm"><option value="">載入中…</option></select></div><div class="field"><label for="model">預報模式</label><select id="model"><option value="">載入中…</option></select></div></div><div class="model-list" id="modelStatus"></div><div class="sliderrow"><input id="lead" type="range" min="0" max="0" step="6" value="0" aria-label="預報時效"><strong id="leadText">預報時效：—</strong></div><div class="legend" id="cycleText">正在讀取本站資料…</div></section>
<div class="mapbox"><div id="map" aria-label="颱風路徑互動地圖"></div></div><section class="panel" style="margin-top:12px"><div class="status" id="status" role="status">正在讀取 data/typhoon-model-tracks.json…</div></section><div class="foot">資料來源與更新時間以 JSON 內紀錄為準。只有資料檔中實際存在且含有效座標的路徑才會繪製；未取得資料的模式會明確標示，不會以示意線冒充預報。颱風警報與官方最新資訊請以中央氣象署公告為準。</div></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const colors=['#22d3ee','#fb923c','#a78bfa','#4ade80','#f472b6','#facc15','#60a5fa'];let data=null,lines=[],markers=[],currentPoints=[];const map=L.map('map',{zoomControl:true,minZoom:3,maxZoom:10}).setView([21.5,126],4);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap'}).addTo(map);const region=L.latLngBounds([[3,100],[42,155]]);function clear(){[...lines,...markers].forEach(x=>map.removeLayer(x));lines=[];markers=[];currentPoints=[]}function modelLabel(m){return m||'未標示模式'}function getModels(){return [...new Set((data?.tracks||[]).map(t=>t.model).filter(Boolean))]}function renderStatuses(){const names=getModels();const info=data?.models||{};const all=[...new Set([...names,...Object.keys(info)])];$('modelStatus').innerHTML=all.map(n=>{const available=names.includes(n);const detail=info[n]?.status;return `<span class="pill ${available?'ok':'bad'}">${escapeHtml(n)}：${available?'有路徑資料':'目前無路徑資料'}</span>`}).join('')||'<span class="pill bad">目前沒有可用模式</span>'}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function populate(){const storms=[...new Map((data.tracks||[]).map(t=>[`${t.stormId||''}|${t.stormName||''}`,{id:t.stormId||'',name:t.stormName||'未命名風暴'}])).values()];$('storm').innerHTML=storms.length?storms.map(s=>`<option value="${escapeHtml(s.id+'|'+s.name)}">${escapeHtml(s.name)}${s.id?' ('+escapeHtml(s.id)+')':''}</option>`).join(''):'<option value="">目前無風暴路徑</option>';const models=getModels();$('model').innerHTML=models.length?models.map(m=>`<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join(''):'<option value="">目前無可用模式</option>';renderStatuses();draw()}function draw(){clear();if(!data)return;const selected=$('storm').value.split('|');const stormId=selected[0]||'',stormName=selected.slice(1).join('|');const model=$('model').value;const track=(data.tracks||[]).find(t=>(t.stormId||'')===stormId&&(t.stormName||'未命名風暴')===stormName&&t.model===model);if(!track||!Array.isArray(track.points)){ $('status').textContent=`${model||'此模式'}目前沒有可繪製的路徑資料。`; $('cycleText').textContent='請選擇其他有資料的模式；不會顯示虛構路徑。';$('lead').max=0;$('lead').value=0;$('leadText').textContent='預報時效：—';return}const points=track.points.filter(p=>Number.isFinite(Number(p.lat))&&Number.isFinite(Number(p.lon))&&Number(p.lat)>=-90&&Number(p.lat)<=90&&Number(p.lon)>=-180&&Number(p.lon)<=180).sort((a,b)=>(a.leadHours||0)-(b.leadHours||0));if(!points.length){$('status').textContent='資料檔存在此風暴，但沒有有效座標。';return}currentPoints=points;const max=Math.max(...points.map(p=>Number(p.leadHours)||0));$('lead').max=max;$('lead').step=6;$('lead').value=0;const coords=points.map(p=>[Number(p.lat),Number(p.lon)]);const line=L.polyline(coords,{color:colors[getModels().indexOf(model)%colors.length],weight:4,opacity:.9}).addTo(map);lines.push(line);points.forEach(p=>{const marker=L.circleMarker([Number(p.lat),Number(p.lon)],{radius:Number(p.leadHours)===0?6:4,color:'#fff',weight:1,fillColor:colors[getModels().indexOf(model)%colors.length],fillOpacity:.95}).bindPopup(`${escapeHtml(track.stormName||'風暴')}<br>${escapeHtml(model)}<br>預報時效：+${Number(p.leadHours)||0} 小時<br>座標：${Number(p.lat).toFixed(1)}, ${Number(p.lon).toFixed(1)}`).addTo(map);markers.push(marker)});map.fitBounds(line.getBounds().pad(.15),{maxZoom:5});$('cycleText').textContent=`模式：${modelLabel(model)}｜起報時間：${track.cycleTime||'資料未提供'}｜來源：${track.source||'JSON 未標示'}｜資料更新：${data.updatedAt||'未提供'}`;$('status').textContent=`已從本站 JSON 讀取 ${points.length} 個有效座標點。地圖顯示的是資料檔中現有的路徑，並非代表所有模式均已接通。`;updateLead()}function updateLead(){const h=Number($('lead').value)||0;$('leadText').textContent=`預報時效：+${h} 小時`;if(!currentPoints.length)return;const p=currentPoints.reduce((best,x)=>Math.abs((Number(x.leadHours)||0)-h)<Math.abs((Number(best.leadHours)||0)-h)?x:best,currentPoints[0]);$('leadText').textContent=`預報時效：+${p.leadHours||0} 小時`;markers.forEach(m=>{const ll=m.getLatLng();if(Math.abs(ll.lat-Number(p.lat))<1e-6&&Math.abs(ll.lng-Number(p.lon))<1e-6)m.openPopup()})}async function start(){try{const url=new URL('./data/typhoon-model-tracks.json',location.href);url.searchParams.set('_',Date.now());const res=await fetch(url,{cache:'no-store'});if(!res.ok)throw new Error(`HTTP ${res.status}：無法讀取本站 JSON`);data=await res.json();if(!Array.isArray(data.tracks))throw new Error('JSON 格式不符：找不到 tracks 陣列');populate();}catch(e){$('status').textContent='載入失敗：'+e.message+'。請確認 typhoon-tracks.html 與 data/typhoon-model-tracks.json 都已部署在同一個網站根目錄下。';$('cycleText').textContent='尚未載入路徑資料。'}}$('storm').addEventListener('change',draw);$('model').addEventListener('change',draw);$('lead').addEventListener('input',updateLead);start();})();
</script></body></html>
