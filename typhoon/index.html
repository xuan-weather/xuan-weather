<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>臺灣颱風監測中心</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;
      background: #07111f;
      color: #f8fafc;
    }

    body {
      overflow-x: hidden;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      background:
        radial-gradient(
          circle at top right,
          rgba(37, 99, 235, 0.18),
          transparent 35%
        ),
        linear-gradient(180deg, #07111f 0%, #0b1728 100%);
    }

    .header {
      padding:
        calc(18px + env(safe-area-inset-top))
        18px
        18px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: rgba(7,17,31,0.92);
      backdrop-filter: blur(18px);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #2563eb, #06b6d4);
      font-size: 25px;
      box-shadow: 0 10px 30px rgba(37,99,235,0.25);
    }

    .brand-title {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .brand-subtitle {
      margin-top: 3px;
      font-size: 12px;
      color: #94a3b8;
    }

    .container {
      width: min(1200px, calc(100% - 24px));
      margin: 16px auto 40px;
    }

    .status-card {
      border-radius: 20px;
      padding: 18px;
      background: linear-gradient(
        135deg,
        rgba(30,41,59,0.96),
        rgba(15,23,42,0.96)
      );
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 18px 50px rgba(0,0,0,0.25);
      margin-bottom: 14px;
    }

    .status-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .status-label {
      color: #94a3b8;
      font-size: 13px;
    }

    .status-name {
      margin-top: 4px;
      font-size: 28px;
      font-weight: 900;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(34,197,94,0.12);
      color: #86efac;
      border: 1px solid rgba(34,197,94,0.22);
      font-size: 13px;
      font-weight: 700;
    }

    .status-badge.off {
      background: rgba(148,163,184,0.12);
      color: #cbd5e1;
      border-color: rgba(148,163,184,0.2);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 16px;
    }

    .stat {
      padding: 14px;
      border-radius: 15px;
      background: rgba(255,255,255,0.045);
      border: 1px solid rgba(255,255,255,0.06);
    }

    .stat-label {
      color: #94a3b8;
      font-size: 12px;
    }

    .stat-value {
      margin-top: 5px;
      font-size: 18px;
      font-weight: 800;
    }

    .map-card {
      position: relative;
      overflow: hidden;
      border-radius: 22px;
      background: #111827;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 18px 50px rgba(0,0,0,0.28);
    }

    #map {
      width: 100%;
      height: min(70vh, 650px);
      min-height: 430px;
    }

    .map-title {
      position: absolute;
      left: 14px;
      top: 14px;
      z-index: 500;
      padding: 10px 13px;
      border-radius: 12px;
      background: rgba(7,17,31,0.88);
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      font-size: 14px;
      font-weight: 800;
    }

    .legend {
      position: absolute;
      right: 14px;
      bottom: 14px;
      z-index: 500;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(7,17,31,0.9);
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      font-size: 12px;
      color: #cbd5e1;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 5px 0;
    }

    .legend-line {
      width: 26px;
      height: 3px;
      border-radius: 99px;
    }

    .legend-line.history {
      background: #38bdf8;
    }

    .legend-line.forecast {
      background: #f59e0b;
    }

    .info-card {
      margin-top: 14px;
      padding: 17px;
      border-radius: 20px;
      background: rgba(15,23,42,0.95);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .info-title {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 9px;
    }

    .info-item {
      padding: 11px 12px;
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
    }

    .info-item span {
      display: block;
      color: #94a3b8;
      font-size: 11px;
      margin-bottom: 4px;
    }

    .info-item strong {
      font-size: 14px;
    }

    .empty {
      padding: 55px 20px;
      text-align: center;
    }

    .empty-icon {
      font-size: 52px;
      margin-bottom: 10px;
    }

    .empty-title {
      font-size: 22px;
      font-weight: 800;
    }

    .empty-text {
      margin-top: 8px;
      color: #94a3b8;
      line-height: 1.7;
    }

    .footer {
      text-align: center;
      color: #64748b;
      font-size: 12px;
      line-height: 1.7;
      padding:
        20px
        20px
        calc(30px + env(safe-area-inset-bottom));
    }

    .loading {
      padding: 50px 20px;
      text-align: center;
      color: #94a3b8;
    }

    .loading-dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #38bdf8;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from {
        opacity: 0.25;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1.15);
      }
    }

    .leaflet-control-zoom {
      border: 0 !important;
      box-shadow: 0 5px 20px rgba(0,0,0,0.25) !important;
    }

    .leaflet-control-zoom a {
      background: rgba(15,23,42,0.92) !important;
      color: #fff !important;
      border-color: rgba(255,255,255,0.1) !important;
    }

    .leaflet-popup-content-wrapper,
    .leaflet-popup-tip {
      background: #0f172a;
      color: #fff;
    }

    .popup-title {
      font-weight: 800;
      font-size: 15px;
      margin-bottom: 5px;
    }

    .popup-text {
      font-size: 12px;
      line-height: 1.7;
      color: #cbd5e1;
    }

    @media (max-width: 700px) {
      .container {
        width: min(100% - 12px, 1200px);
        margin-top: 10px;
      }

      .header {
        padding-left: 13px;
        padding-right: 13px;
      }

      .brand-title {
        font-size: 18px;
      }

      .brand-subtitle {
        font-size: 11px;
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      #map {
        height: 58vh;
        min-height: 400px;
      }

      .map-title {
        font-size: 12px;
      }

      .legend {
        font-size: 11px;
      }

      .info-grid {
        grid-template-columns: 1fr;
      }

      .status-name {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <header class="header">
      <div class="header-inner">
        <div class="brand">
          <div class="brand-icon">🌀</div>
          <div>
            <div class="brand-title">臺灣颱風監測中心</div>
            <div class="brand-subtitle">
              中央氣象署颱風資料 · GitHub Pages
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="container">

      <section class="status-card">
        <div class="status-top">
          <div>
            <div class="status-label">目前颱風資訊</div>
            <div id="stormName" class="status-name">資料載入中…</div>
          </div>

          <div id="statusBadge" class="status-badge">
            <span>●</span>
            <span>資料載入中</span>
          </div>
        </div>

        <div id="stats" class="stats">
          <div class="stat">
            <div class="stat-label">中心氣壓</div>
            <div id="pressure" class="stat-value">—</div>
          </div>

          <div class="stat">
            <div class="stat-label">最大風速</div>
            <div id="wind" class="stat-value">—</div>
          </div>

          <div class="stat">
            <div class="stat-label">最大陣風</div>
            <div id="gust" class="stat-value">—</div>
          </div>

          <div class="stat">
            <div class="stat-label">目前位置</div>
            <div id="position" class="stat-value">—</div>
          </div>
        </div>
      </section>

      <section class="map-card">
        <div class="map-title">🌀 颱風路徑監測</div>

        <div id="map">
          <div class="loading">
            <span class="loading-dot"></span>
            正在載入地圖…
          </div>
        </div>

        <div class="legend">
          <div class="legend-row">
            <span class="legend-line history"></span>
            <span>歷史路徑</span>
          </div>

          <div class="legend-row">
            <span class="legend-line forecast"></span>
            <span>預測路徑</span>
          </div>
        </div>
      </section>

      <section class="info-card">
        <div class="info-title">📡 資料資訊</div>

        <div class="info-grid">
          <div class="info-item">
            <span>資料來源</span>
            <strong>中央氣象署</strong>
          </div>

          <div class="info-item">
            <span>資料集</span>
            <strong>W-C0034-005</strong>
          </div>

          <div class="info-item">
            <span>最後更新</span>
            <strong id="updatedAt">—</strong>
          </div>

          <div class="info-item">
            <span>颱風編號</span>
            <strong id="typhoonNo">—</strong>
          </div>
        </div>
      </section>

    </main>

    <footer class="footer">
      臺灣颱風監測中心<br>
      資料由中央氣象署公開資料提供
    </footer>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const DATA_URL = "../data/typhoon.json";

    let map = null;

    function byId(id) {
      return document.getElementById(id);
    }

    function formatNumber(value, digits = 0) {
      if (value === null || value === undefined || value === "") {
        return "—";
      }

      const n = Number(value);

      if (!Number.isFinite(n)) {
        return "—";
      }

      return n.toFixed(digits);
    }

    function msToKmh(ms) {
      if (ms === null || ms === undefined || ms === "") {
        return null;
      }

      const n = Number(ms);

      if (!Number.isFinite(n)) {
        return null;
      }

      return n * 3.6;
    }

    function createMap() {
      map = L.map("map", {
        zoomControl: true,
        attributionControl: true
      });

      map.setView([23.7, 120.9], 6);

      L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
          maxZoom: 18,
          attribution: "&copy; OpenStreetMap contributors"
        }
      ).addTo(map);
    }

    function clearMapLayers() {
      map.eachLayer(layer => {
        if (!(layer instanceof L.TileLayer)) {
          map.removeLayer(layer);
        }
      });
    }

    function addPoint(item, color, title, isCurrent = false) {
      if (!item) return;

      const lat = Number(item.lat);
      const lon = Number(item.lon);

      if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
        return;
      }

      const radius = isCurrent ? 9 : 5;

      const marker = L.circleMarker(
        [lat, lon],
        {
          radius,
          color,
          weight: isCurrent ? 3 : 2,
          fillColor: color,
          fillOpacity: 0.9
        }
      );

      const pressure =
        item.pressureHpa !== null &&
        item.pressureHpa !== undefined
          ? `${formatNumber(item.pressureHpa)} hPa`
          : "—";

      const windKmh = msToKmh(item.maxWindMs);
      const gustKmh = msToKmh(item.maxGustMs);

      marker.bindPopup(`
        <div class="popup-title">${title}</div>
        <div class="popup-text">
          時間：${item.time || "—"}<br>
          座標：${lat.toFixed(2)}°N，
          ${lon.toFixed(2)}°E<br>
          中心氣壓：${pressure}<br>
          最大風速：
          ${windKmh !== null ? windKmh.toFixed(1) + " km/h" : "—"}<br>
          最大陣風：
          ${gustKmh !== null ? gustKmh.toFixed(1) + " km/h" : "—"}
        </div>
      `);

      marker.addTo(map);
    }

    function drawTrack(typhoon) {
      clearMapLayers();

      const analysis = Array.isArray(typhoon.analysis)
        ? typhoon.analysis
        : [];

      const forecast = Array.isArray(typhoon.forecast)
        ? typhoon.forecast
        : [];

      const historyLatLngs = analysis
        .map(item => [Number(item.lat), Number(item.lon)])
        .filter(point =>
          Number.isFinite(point[0]) &&
          Number.isFinite(point[1])
        );

      const forecastLatLngs = forecast
        .map(item => [Number(item.lat), Number(item.lon)])
        .filter(point =>
          Number.isFinite(point[0]) &&
          Number.isFinite(point[1])
        );

      const allPoints = [
        ...historyLatLngs,
        ...forecastLatLngs
      ];

      if (historyLatLngs.length >= 2) {
        L.polyline(
          historyLatLngs,
          {
            color: "#38bdf8",
            weight: 5,
            opacity: 0.95
          }
        ).addTo(map);
      }

      if (forecastLatLngs.length >= 2) {
        L.polyline(
          forecastLatLngs,
          {
            color: "#f59e0b",
            weight: 4,
            opacity: 0.95,
            dashArray: "10 8"
          }
        ).addTo(map);
      }

      analysis.forEach((item, index) => {
        addPoint(
          item,
          "#38bdf8",
          `歷史位置 ${index + 1}`,
          index === analysis.length - 1
        );
      });

      forecast.forEach((item, index) => {
        addPoint(
          item,
          "#f59e0b",
          `預測位置 ${index + 1}`,
          false
        );
      });

      if (allPoints.length > 0) {
        map.fitBounds(allPoints, {
          padding: [35, 35],
          maxZoom: 8
        });
      }
    }

    function showNoTyphoon(data) {
      byId("stormName").textContent =
        "目前無活動中的熱帶氣旋";

      const badge = byId("statusBadge");

      badge.classList.add("off");
      badge.innerHTML = `
        <span>●</span>
        <span>目前無颱風</span>
      `;

      byId("pressure").textContent = "—";
      byId("wind").textContent = "—";
      byId("gust").textContent = "—";
      byId("position").textContent = "—";

      byId("updatedAt").textContent =
        data.updatedAt
          ? new Date(data.updatedAt).toLocaleString("zh-TW")
          : "—";

      byId("typhoonNo").textContent = "—";
    }

    function showTyphoon(data, typhoon) {
      const name =
        typhoon.name ||
        typhoon.internationalName ||
        "未命名熱帶氣旋";

      byId("stormName").textContent = name;

      const badge = byId("statusBadge");

      badge.classList.remove("off");
      badge.innerHTML = `
        <span>●</span>
        <span>目前有熱帶氣旋</span>
      `;

      const current =
        typhoon.current ||
        (
          Array.isArray(typhoon.analysis) &&
          typhoon.analysis.length
            ? typhoon.analysis[typhoon.analysis.length - 1]
            : null
        );

      if (current) {
        byId("pressure").textContent =
          current.pressureHpa !== null &&
          current.pressureHpa !== undefined
            ? `${formatNumber(current.pressureHpa)} hPa`
            : "—";

        const windKmh = msToKmh(current.maxWindMs);
        const gustKmh = msToKmh(current.maxGustMs);

        byId("wind").textContent =
          windKmh !== null
            ? `${windKmh.toFixed(1)} km/h`
            : "—";

        byId("gust").textContent =
          gustKmh !== null
            ? `${gustKmh.toFixed(1)} km/h`
            : "—";

        if (
          Number.isFinite(Number(current.lat)) &&
          Number.isFinite(Number(current.lon))
        ) {
          byId("position").textContent =
            `${Number(current.lat).toFixed(2)}°N ` +
            `${Number(current.lon).toFixed(2)}°E`;
        } else {
          byId("position").textContent = "—";
        }
      }

      byId("updatedAt").textContent =
        data.updatedAt
          ? new Date(data.updatedAt).toLocaleString("zh-TW")
          : "—";

      byId("typhoonNo").textContent =
        typhoon.cwaTyNo ||
        typhoon.cwaTdNo ||
        "—";

      drawTrack(typhoon);
    }

    async function loadTyphoonData() {
      try {
        const response = await fetch(
          `${DATA_URL}?t=${Date.now()}`,
          {
            cache: "no-store"
          }
        );

        if (!response.ok) {
          throw new Error(
            `HTTP ${response.status}`
          );
        }

        const data = await response.json();

        if (!data || data.ok !== true) {
          throw new Error("颱風資料格式錯誤");
        }

        const typhoons =
          Array.isArray(data.typhoons)
            ? data.typhoons
            : [];

        if (typhoons.length === 0) {
          showNoTyphoon(data);
          return;
        }

        const typhoon =
          data.typhoon ||
          typhoons[0];

        showTyphoon(data, typhoon);

      } catch (error) {
        console.error(
          "載入颱風資料失敗：",
          error
        );

        byId("stormName").textContent =
          "颱風資料載入失敗";

        const badge = byId("statusBadge");

        badge.classList.add("off");
        badge.innerHTML = `
          <span>●</span>
          <span>資料錯誤</span>
        `;

        byId("updatedAt").textContent =
          "請稍後重新整理";
      }
    }

    createMap();
    loadTyphoonData();

    // 每 10 分鐘重新讀取一次 GitHub Pages 資料
    setInterval(
      loadTyphoonData,
      10 * 60 * 1000
    );
  </script>
</body>
</html>
