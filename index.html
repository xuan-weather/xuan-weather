        #map .leaflet-tile {
            max-width: none;

        /* 修正全台主地圖在 iPhone Safari 上出現的水平／垂直圖磚十字接縫。

            max-width: none !important;
            max-height: none !important;
            border: 0 !important;
            outline: 0 !important;

        /* 全螢幕修正：iPhone／Safari 進入全螢幕後，讓地圖真正填滿視窗，並避免控制按鈕被底部安全區裁切 */
        /* 全螢幕修正：iPhone／Safari 讓地圖延伸到最上方安全區，不留下頂部空白 */
        #map.leaflet-fullscreen-on,

            left: 0 !important;
            inset: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            height: 100svh !important;
            height: 100dvh !important;
            max-width: none !important;
            max-height: none !important;
            min-width: 0 !important;
            min-height: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
            border: 0 !important;
            border-radius: 0 !important;
            transform: none !important;
            z-index: 99999 !important;

(function(){
  var intro=document.getElementById('xuan-original-intro');
  if(!intro)return;
  var timer;
  var seenKey='xuanOriginalBrandIntroSeen';
  function hide(){clearTimeout(timer);intro.classList.add('xoi-hide')}
  var btn=document.getElementById('xoi-skip');
  if(btn)btn.addEventListener('click',function(){try{sessionStorage.setItem(seenKey,'1')}catch(e){}hide()});
  try{
    if(sessionStorage.getItem(seenKey)==='1'){
      intro.classList.add('xoi-hide');
      return;
    }
    sessionStorage.setItem(seenKey,'1');
  }catch(e){}
  try{
    if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches){hide();return}
  }catch(e){}
  timer=setTimeout(hide,2000);
})();
</script>
