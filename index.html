<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xuan Weather｜全台即時異常排版測試</title>
<style>
:root{--bg:#f3f6fb;--panel:#fff;--text:#172033;--muted:#64748b;--border:#e3e8f0;--soft:#fff5cf;--soft-border:#f2d58b;--blue:#168bd2;--shadow:0 10px 30px rgba(15,23,42,.07)}
*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:680px;margin:0 auto}.demo-note{font-size:12px;color:var(--muted);margin:0 0 12px;line-height:1.5}.widget{padding:13px;border:1px solid rgba(239,68,68,.25);border-radius:18px;background:linear-gradient(135deg,rgba(239,68,68,.06),rgba(255,255,255,.96));box-shadow:var(--shadow)}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:12px}.title{font-weight:900;font-size:17px;line-height:1.4}.time{font-size:11px;color:var(--muted);white-space:nowrap;padding-top:3px}.filters{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter{flex:0 0 auto;border:1px solid var(--border);border-radius:11px;background:#f8fafc;color:#475569;padding:9px 11px;font-size:12px;font-weight:800;white-space:nowrap;cursor:pointer}.filter.active{color:#fff;border-color:#168bd2;background:linear-gradient(135deg,#0891b2,#2563eb)}.filter span{opacity:.8;margin-left:3px}.list-wrap{max-height:390px;overflow-y:auto;overscroll-behavior:contain;padding:0 3px 2px 0;scrollbar-width:thin;scrollbar-color:#cbd5e1 transparent}.list{display:grid;gap:7px}.item{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:9px;min-height:66px;padding:9px 11px;border:1px solid var(--soft-border);border-radius:13px;background:var(--soft);cursor:pointer;transition:background .15s,border-color .15s}.item:hover{background:#ffefb0;border-color:#edc86a}.emoji{font-size:18px;text-align:center}.main{min-width:0}.station{font-size:13px;font-weight:900;line-height:1.35;overflow-wrap:anywhere}.sub{margin-top:3px;color:#64748b;font-size:10.5px;line-height:1.35;overflow-wrap:anywhere}.value{display:flex;align-items:baseline;justify-content:flex-end;gap:4px;white-space:nowrap;padding-left:2px}.value b{font-size:20px;line-height:1;font-weight:900;font-variant-numeric:tabular-nums}.value small{font-size:11px;font-weight:800;color:#64748b}.dot{display:inline-block;width:9px;height:9px;margin-left:6px;border-radius:50%;background:#ef4444;vertical-align:middle}.empty{padding:20px 12px;text-align:center;color:var(--muted);font-size:13px;background:#f8fafc;border:1px dashed var(--border);border-radius:12px}.foot{margin-top:9px;color:var(--muted);font-size:10px;line-height:1.5}.list-wrap[hidden]{display:none}.filter .chevron{display:inline-block;margin-left:4px;font-size:10px;transition:transform .18s}.filter[aria-expanded="true"] .chevron{transform:rotate(180deg)}
@media(max-width:420px){body{padding:10px}.widget{padding:11px;border-radius:16px}.title{font-size:15px}.time{font-size:10px}.filter{padding:8px 9px;font-size:11px}.item{grid-template-columns:25px minmax(0,1fr) auto;gap:7px;min-height:61px;padding:8px 9px;border-radius:12px}.emoji{font-size:16px}.station{font-size:12px}.sub{font-size:10px}.value b{font-size:18px}.value small{font-size:10px}.list-wrap{max-height:350px}}
</style>
</head>
<body>
<div class="wrap">
<p class="demo-note">排版測試預覽｜以下為示範資料，不是即時觀測值。預設收合，點擊「全部異常」展開或再次點擊收合；點擊其他分類會展開該分類。</p>
<section class="widget" aria-label="全台即時異常排版測試">
  <div class="head"><div class="title">⚠️ 全台即時異常</div><div class="time">資料時間：10/13 19:10</div></div>
  <nav class="filters" id="filters" aria-label="異常分類"></nav>
  <div class="list-wrap" id="listWrap" hidden><div class="list" id="list"></div></div>
  <div class="foot">示範資料僅供版面測試。正式網站仍依原本 CWA／MOENV 觀測資料與既有門檻判斷。</div>
</section>
</div>
<script>
const data=[
 {type:'aqi',icon:'😷',name:'彰化縣 大城',desc:'環境部 AQX_P_432｜對所有族群不健康',value:'164',unit:'AQI'},
 {type:'aqi',icon:'😷',name:'金門縣 金門',desc:'環境部 AQX_P_432｜對所有族群不健康',value:'159',unit:'AQI'},
 {type:'aqi',icon:'😷',name:'雲林縣 麥寮',desc:'環境部 AQX_P_432｜對所有族群不健康',value:'159',unit:'AQI'},
 {type:'aqi',icon:'😷',name:'臺中市 豐原',desc:'環境部 AQX_P_432｜對所有族群不健康',value:'156',unit:'AQI'},
 {type:'aqi',icon:'😷',name:'臺南市 臺南',desc:'環境部 AQX_P_432｜對所有族群不健康',value:'156',unit:'AQI'},
 {type:'aqi',icon:'😷',name:'苗栗縣 三義',desc:'環境部 AQX_P_432｜對所有族群不健康',value:'154',unit:'AQI'},
 {type:'aqi',icon:'😷',name:'臺南市 安南',desc:'環境部 AQX_P_432｜對所有族群不健康',value:'154',unit:'AQI'},
 {type:'aqi',icon:'😷',name:'新北市 富貴角',desc:'環境部 AQX_P_432｜對所有族群不健康',value:'154',unit:'AQI'},
 {type:'aqi',icon:'😷',name:'新北市 新北（樹林）',desc:'環境部 AQX_P_432｜對所有族群不健康',value:'151',unit:'AQI'},
 {type:'temp',icon:'🌡️',name:'臺北市 士林',desc:'氣象署 CWA｜高溫觀測示範',value:'36.2',unit:'°C'},
 {type:'rain',icon:'🌧️',name:'屏東縣 三地門',desc:'氣象署 CWA｜降雨觀測示範',value:'52',unit:'mm/h'},
 {type:'wind',icon:'💨',name:'澎湖縣 東吉島',desc:'氣象署 CWA｜陣風觀測示範',value:'19.1',unit:'m/s'}
];
const types=[['all','全部異常'],['temp','🌡️ 高溫'],['rain','🌧️ 強降雨'],['wind','💨 強陣風'],['aqi','😷 空品']];let active='all';let expanded=false;
const filters=document.getElementById('filters'),list=document.getElementById('list'),listWrap=document.getElementById('listWrap');
function renderFilters(){filters.innerHTML='';types.forEach(([type,label])=>{const n=type==='all'?data.length:data.filter(x=>x.type===type).length;const b=document.createElement('button');b.className='filter'+(active===type?' active':'');b.type='button';b.setAttribute('aria-pressed',String(active===type));if(type==='all'){b.setAttribute('aria-expanded',String(expanded));b.innerHTML=`${label} <span>${n}</span><span class="chevron" aria-hidden="true">${expanded?'▲':'▼'}</span>`;}else{b.innerHTML=`${label} <span>${n}</span>`;}b.addEventListener('click',()=>{if(type==='all'){active='all';expanded=!expanded;}else{active=type;expanded=true;}listWrap.hidden=!expanded;renderFilters();renderList();});filters.appendChild(b);});}
function renderList(){const rows=active==='all'?data:data.filter(x=>x.type===active);list.innerHTML='';if(!rows.length){list.innerHTML='<div class="empty">目前沒有此分類的示範異常</div>';return;}rows.forEach(x=>{const item=document.createElement('article');item.className='item';item.tabIndex=0;item.setAttribute('role','button');item.innerHTML=`<div class="emoji">${x.icon}</div><div class="main"><div class="station">${x.name}<span class="dot"></span></div><div class="sub">${x.desc}</div></div><div class="value"><b>${x.value}</b><small>${x.unit}</small></div>`;const select=()=>{item.style.outline='2px solid #38bdf8';item.style.outlineOffset='1px';setTimeout(()=>{item.style.outline='';item.style.outlineOffset='';},650);};item.addEventListener('click',select);item.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select();}});list.appendChild(item);});listWrap.scrollTop=0;}
listWrap.hidden=true;renderFilters();renderList();
</script>
</body>
</html>
