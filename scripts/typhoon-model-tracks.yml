name: Update typhoon model tracks

on:
  workflow_dispatch:
  schedule:
    # Run every 6 hours
    - cron: "23 */6 * * *"

permissions:
  contents: write

concurrency:
  group: typhoon-model-tracks
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ECMWF BUFR decoder and downloader
        run: |
          python -m pip install --upgrade pip
          python -m pip install ecmwf-opendata eccodes

      - name: Check required script exists
        run: test -f scripts/update_typhoon_tracks.py

      - name: Fetch and normalize official ECMWF / AIFS tracks
        run: python scripts/update_typhoon_tracks.py

      - name: Check output JSON exists and is valid
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/typhoon-model-tracks.json")
          if not path.is_file():
              raise SystemExit("ERROR: data/typhoon-model-tracks.json was not created")
          try:
              data = json.loads(path.read_text(encoding="utf-8"))
          except Exception as exc:
              raise SystemExit(f"ERROR: generated JSON is invalid: {exc}")
          if not isinstance(data, dict):
              raise SystemExit("ERROR: generated JSON root must be an object")
          storms = data.get("storms")
          if not isinstance(storms, list):
              raise SystemExit("ERROR: JSON must contain a 'storms' array")
          print(f"JSON valid. Storm records: {len(storms)}")
          PY

      - name: Commit updated track JSON
        run: |
          if git diff --quiet -- data/typhoon-model-tracks.json; then
            echo "No data change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/typhoon-model-tracks.json
          git commit -m "Update official typhoon model tracks"
          git push
